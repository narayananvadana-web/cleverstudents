<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SSC Mastery | Smart Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--srf:#161b27;--brd:rgba(255,255,255,.1);--txt:#e2e8f0;--mut:#94a3b8;--font:'Nunito',sans-serif;--r-lg:16px;--r-md:8px;--r-sm:4px}
    body.light-mode{--bg:#f8fafc;--srf:#fff;--txt:#0f172a;--brd:rgba(0,0,0,.1);--mut:#64748b}
    *,::before,::after{margin:0;padding:0;box-sizing:border-box}
    html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;min-width:100%!important;background:var(--bg)!important;overflow-x:hidden!important;top:0px!important}
    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;font-size:18px;}
    
    .protected-mode,.protected-mode *{user-select:none!important;-webkit-user-select:none!important;-ms-user-select:none!important}
    input,textarea,select{user-select:auto!important;-webkit-user-select:auto!important}
    img{user-drag:none}.img-th,.modal img{pointer-events:auto!important;cursor:pointer}
    :target{scroll-margin-top:70px}
    .notranslate{translate:no!important}

    .top-info-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 15px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--brd);min-height:50px;flex-wrap:wrap}
    .news-ticker-wrap{flex:1;min-width:150px;overflow:hidden;background:rgba(0,0,0,.3);border-radius:20px;padding:8px 15px;border:1px solid rgba(255,215,0,.3);display:flex;align-items:center;gap:10px}
    .news-icon{flex-shrink:0;font-size:1.2rem;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .ticker-container{width:100%;overflow:hidden;white-space:nowrap;flex:1}
    #newsTicker{display:inline-block;white-space:nowrap;animation:scrollTicker 40s linear infinite}
    #newsTicker:hover{animation-play-state:paused}
    @keyframes scrollTicker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .news-link{color:#ffd700;font-weight:800;font-size:1.05rem;cursor:pointer;margin:0 12px;pointer-events:auto!important;user-select:auto!important}
    .news-link:hover{color:#fff}

    @keyframes redBlink{0%,100%{box-shadow:0 0 5px rgba(255,0,0,.4);border-color:rgba(255,0,0,.5)}50%{box-shadow:0 0 20px rgba(255,0,0,.9);border-color:rgba(255,0,0,.9)}}
    .lang-select{padding:8px 14px;border-radius:16px;border:2px solid rgba(255,0,0,.5);background:var(--srf);color:var(--txt);font-weight:800;font-size:1.05rem;cursor:pointer;animation:redBlink 1s ease-in-out infinite;flex-shrink:0;min-width:110px;z-index:10}
    .goog-te-banner-frame,#goog-gt-tt,.goog-tooltip,.goog-text-highlight,.goog-te-spinner-pos,.goog-logo-link,.goog-te-gadget span,.VIpgJd-ZVi9od-ORHb,.VIpgJd-ZVi9od-l4eHX,.goog-te-gadget img,.skiptranslate{display:none!important}
    #google_translate_element{position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;overflow:hidden!important}

    .top-bar{background:var(--srf);border-bottom:1px solid var(--brd);padding:0 15px;position:sticky;top:0;z-index:999}
    .top-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;justify-content:space-between}
    .logo{font-family:'Fredoka One',cursive;font-size:1.5rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .user-info{font-weight:800;font-size:1rem;color:#4ade80}
    .theme-btn{background:var(--bg);color:var(--txt);border:1px solid var(--brd);font-weight:800;font-size:1rem;cursor:pointer;padding:8px 16px;border-radius:50px}

    .main-wrap{max-width:100%!important;width:100%!important;padding:20px 10px 80px!important;margin:0 auto}
    .shell{background:var(--srf);border-radius:12px;overflow:hidden;border:1px solid var(--brd);width:100%;max-width:1400px;margin:0 auto}
    .banner{padding:15px 20px!important;display:flex;align-items:center;justify-content:center;gap:15px;box-shadow:0 4px 10px rgba(0,0,0,.3);flex-wrap:wrap;text-align:center}
    .banner h1{font-size:1.6rem!important;font-weight:900!important;color:#fff!important;margin:0}
    .banner p{font-size:1.15rem!important;font-weight:700!important;color:#fff!important;border-left:3px solid rgba(255,255,255,.6);padding-left:12px;margin:0}
    
    .sub-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:15px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--brd)}
    .btn-sub{padding:12px 20px;border:2px solid transparent;border-radius:8px;color:#fff;font-weight:800;font-size:1.1rem;cursor:pointer;opacity:.65;transform:scale(.95);white-space:nowrap;transition:all 0.3s;}
    .btn-sub.active{opacity:1;transform:scale(1.05);border-color:#fff;box-shadow:0 0 15px rgba(255,255,255,.2)}
    
    .study-tabs-row{display:flex;gap:10px;padding:15px;background:rgba(0,0,0,.15);flex-wrap:wrap;justify-content:center}
    .study-tab-btn{padding:10px 20px;border-radius:50px;border:2px solid var(--brd);background:0 0;color:var(--mut);font-weight:800;font-size:1.05rem;cursor:pointer;white-space:nowrap;transition:all 0.3s;}
    .study-tab-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6;box-shadow:0 4px 10px rgba(59,130,246,.4)}
    
    .content{min-height:150px;background:var(--srf);padding-bottom:20px}
    
    .ch-row{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;margin:8px 12px 0;color:#fff;font-weight:800;font-size:1.15rem;border-radius:8px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,.15)}
    .ch-row:hover{filter:brightness(1.1);transform:translateY(-1px)}
    .ch-content{display:none;background:rgba(0,0,0,.25);border:1px solid var(--brd);margin:0 12px 10px;padding:20px;border-radius:0 0 8px 8px;line-height:1.75;font-size:1.1rem;color:#f8fafc;overflow-x:auto}
    body.light-mode .ch-content{color:#0f172a;background:#ffffff}
    .ch-content.show{display:block;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
    
    .img-th{max-width:220px;max-height:160px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--brd);margin:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:15px}
    .q-card{border:none;border-radius:8px;padding:20px 12px;text-align:center;cursor:pointer;color:#fff;transition:all 0.3s}
    .q-card:hover{transform:translateY(-4px);box-shadow:0 6px 15px rgba(0,0,0,.3)}
    .q-card h4{font-weight:900;font-size:1.1rem;margin-bottom:8px;word-break:break-word}
    .q-card small{font-size:.95rem;opacity:0.9}

    .q-player{padding:25px;background:var(--srf);border:1px solid var(--brd);border-radius:12px;max-width:1400px;margin:0 auto}
    .q-panel{border-radius:16px;padding:25px;background:rgba(0,0,0,.2)}
    .options-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:20px}
    .opt-btn{padding:16px 20px;background:rgba(255,255,255,.05);border:2px solid var(--brd);border-radius:12px;cursor:pointer;font-weight:800;font-size:1.2rem;color:var(--txt);display:flex;align-items:center;gap:12px;transition:all 0.2s;width:100%;word-break:break-word;text-align:left}
    .opt-btn:hover{border-color:#3b82f6;background:rgba(59,130,246,.1)}
    .opt-btn.correct{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}
    .opt-btn.wrong{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}
    .opt-btn.reveal{border-color:#22c55e!important;background:rgba(34,197,94,.2)!important}
    .feedback{display:none;padding:16px;border-radius:10px;font-weight:800;font-size:1.15rem;color:#fff!important;margin-bottom:20px;line-height:1.6}
    .feedback.show{display:block}.feedback.correct{background:#15803d}.feedback.wrong{background:#b91c1c}

    .btn{padding:12px 22px;border:none;border-radius:50px;cursor:pointer;font-weight:800;color:#fff;display:inline-flex;align-items:center;gap:8px;font-size:1.1rem;transition:all 0.2s}
    .btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
    .btn-blue{background:#3b82f6}.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-dark{background:#334155}.btn-orange{background:#f59e0b}
    .btn-sm{padding:8px 18px;font-size:1rem}

    #login-overlay{position:fixed;inset:0;background:var(--bg);z-index:10000;display:none;align-items:center;justify-content:center}
    .login-box{background:var(--srf);padding:40px 30px;border-radius:var(--r-lg);box-shadow:0 15px 40px rgba(0,0,0,.6);width:90%;max-width:420px;border:1px solid var(--brd);text-align:center}
    .login-inp{width:100%;padding:14px;margin-bottom:16px;border-radius:10px;border:1px solid var(--brd);background:rgba(0,0,0,.2);color:var(--txt);font-size:1.1rem;font-weight:600;outline:0}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99999;display:none;justify-content:center;align-items:center}
    .modal.show{display:flex}.modal img{max-width:92%;max-height:92%;border-radius:8px}
    .modal-close{position:absolute;top:20px;right:25px;color:#fff;font-size:2.5rem;cursor:pointer;font-weight:900}
    .spinner{display:inline-block;width:24px;height:24px;border:4px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .item-count-badge{font-size:.95rem;padding:4px 14px;background:rgba(0,0,0,.25);border-radius:20px;white-space:nowrap}
    .item-count-badge span{font-weight:900;color:#fbbf24}
    .syl-iframe{width:100%;min-height:600px;border:none;border-radius:8px;background:transparent;display:block}

    @media(max-width:768px){
      body{font-size:16px}
      .options-grid{grid-template-columns:1fr;gap:10px}
    }
  </style>
</head>

<script src="/supabase-client.js"></script>

  <div id="img-modal" class="modal" onclick="window.closeModal()"><span class="modal-close">×</span><img id="modal-img" src=""></div>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    // ==================== ULTRA-FAST DIRECT SUPABASE QUERIES ====================
    function getSbClient() {
      return window.supabaseClient || (window.supabaseDb && window.supabaseDb.client) || null;
    }

    async function fetchDB(key) {
      try {
        const snap = await Promise.race([
          window.supabaseDb.ref(key).once('value'),
          new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), 8000))
        ]);
        return snap ? snap.val() : null;
      } catch (e) {
        console.warn('fetchDB fallback for ' + key, e);
        return null;
      }
    }

    // Fast single-query loader for 400+ SSC quiz sets (avoids N+1 hang!)
    async function fastFetchQuizIndex() {
      var sb = getSbClient();
      if (sb && sb.from) {
        try {
          const { data, error } = await sb
            .from('quiz_sets')
            .select('id, quiz_key, title, subject, sub_subject, topic, sub_topic, order_index, metadata')
            .eq('course', 'ssc');
          if (!error && Array.isArray(data)) {
            var idx = {};
            data.forEach(function(row) {
              var meta = row.metadata || {};
              idx[row.quiz_key] = {
                id: row.id,
                count: Number(meta.count) || 10,
                subject: row.subject || meta.subject || 'General Studies',
                subSubject: row.sub_subject || meta.subSubject || 'General',
                topic: row.topic || meta.topic || row.title || row.quiz_key,
                subTopic: row.sub_topic || meta.subTopic || 'General',
                order: row.order_index || meta.order || 0
              };
            });
            return idx;
          }
        } catch (err) {
          console.error('Fast quiz index query error:', err);
        }
      }
      return (await fetchDB('sscQuestionBank_index')) || {};
    }

    // Fast single-query loader for questions of a specific quiz set
    async function fastFetchQuizQuestions(quizKey) {
      var sb = getSbClient();
      var setMeta = window.DB.quiz && window.DB.quiz[quizKey];
      if (sb && sb.from && setMeta && setMeta.id) {
        try {
          const { data, error } = await sb
            .from('quiz_questions')
            .select('*')
            .eq('quiz_set_id', setMeta.id)
            .order('order_index', { ascending: true });
          if (!error && Array.isArray(data) && data.length > 0) {
            return data.map(function(r) {
              var m = r.metadata || {};
              return {
                question: r.question_html || r.question_text || m.question || '',
                options: r.options || m.options || { A: r.option_a, B: r.option_b, C: r.option_c, D: r.option_d },
                correctAnswer: r.correct_answer || m.correctAnswer || 'A',
                explanation: r.explanation_html || r.explanation || m.explanation || ''
              };
            });
          }
        } catch (err) {
          console.error('Fast question fetch error:', err);
        }
      }
      return await fetchDB('qb_' + quizKey);
    }

    var sssColorMap={};var sssColorIndex=0;
    var SSS_COLORS=['linear-gradient(135deg,#3b82f6,#1d4ed8)','linear-gradient(135deg,#10b981,#047857)','linear-gradient(135deg,#8b5cf6,#6d28d9)','linear-gradient(135deg,#f59e0b,#d97706)','linear-gradient(135deg,#ef4444,#dc2626)','linear-gradient(135deg,#06b6d4,#0891b2)','linear-gradient(135deg,#ec4899,#db2777)','linear-gradient(135deg,#84cc16,#65a30d)'];
    function getSSSColor(sss){if(!sssColorMap[sss]){sssColorMap[sss]=SSS_COLORS[sssColorIndex%SSS_COLORS.length];sssColorIndex++;}return sssColorMap[sss];}

    var newsWithLinks=[
      {text:'🎓 Reasoning - 16,000+ Practice Questions',action:function(){window.switchSubject('Reasoning & Intelligence');studyType='quiz';window.refreshUI()}},
      {text:'📚 Quantitative Aptitude Quizzes',action:function(){window.switchSubject('Quantitative Aptitude');studyType='quiz';window.refreshUI()}},
      {text:'📝 General English - 2,700+ Questions',action:function(){window.switchSubject('General English');studyType='quiz';window.refreshUI()}},
      {text:'🌍 General Studies - 12,000+ MCQs',action:function(){window.switchSubject('General Studies');studyType='quiz';window.refreshUI()}}
    ];
    window.buildNewsTicker = function(){var t=document.getElementById('newsTicker');if(!t)return;var h='';newsWithLinks.forEach(function(i,idx){h+='<a class="news-link" onclick="event.stopPropagation();window.handleNewsClick('+idx+')">'+i.text+'</a>';if(idx<newsWithLinks.length-1)h+='<span style="color:rgba(255,255,255,.3);margin:0 6px">|</span>'});t.innerHTML=h+h}
    window.handleNewsClick = function(i){var n=newsWithLinks[i%newsWithLinks.length];if(n&&n.action)n.action()}
    window.buildNewsTicker();

    window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'te,hi,ta,ml,kn,en',layout:google.translate.TranslateElement.InlineLayout.HORIZONTAL,autoDisplay:false},'google_translate_element');};
    window.changeLanguage = function(l){var gc=document.querySelector('.goog-te-combo');if(gc){gc.value=l;gc.dispatchEvent(new Event('change',{bubbles:true}));}else{document.cookie="googtrans=/en/"+l+"; path=/";location.reload();}}

    var DEFAULT_HIERARCHY = {
      'General English': { 'General': { 'General': ['General'] } },
      'General Studies': { 'General': { 'General': ['General'] } },
      'Reasoning & Intelligence': { 'General': { 'General': ['General'] } },
      'Quantitative Aptitude': { 'General': { 'General': ['General'] } }
    };

    window.DB = { syllabus: {}, quiz: {} };
    var settings = { users: {} };
    var studyType = 'quiz';
    var subject = 'General English';
    var qActive=[],qIdx=0,qTimer=null,qSec=0,qAns=[];
    var SSC_HIERARCHY = {};
    var SYL_CONTENT_MAP = {};
    var sylCounter = 0;

    function extractContent(item) {
      if (!item) return '';
      if (item.content && String(item.content).trim()) return item.content;
      if (item.content_html && String(item.content_html).trim()) return item.content_html;
      if (item.body && String(item.body).trim()) return item.body;
      if (item.metadata && typeof item.metadata === 'object') {
        return item.metadata.content || item.metadata.content_html || item.metadata.body || '';
      }
      return '';
    }

    function buildHierarchyFromData() {
      SSC_HIERARCHY = JSON.parse(JSON.stringify(DEFAULT_HIERARCHY));
      Object.keys(window.DB.syllabus || {}).forEach(function(k) {
        var it = window.DB.syllabus[k];
        if (!it || typeof it !== 'object') return;
        var s = it.subject || (it.metadata && it.metadata.subject) || 'General';
        var ss = it.subSubject || it.sub_subject || (it.metadata && it.metadata.subSubject) || 'General';
        var tp = it.topic || (it.metadata && it.metadata.topic) || 'General';
        var st = it.subTopic || it.sub_topic || (it.metadata && it.metadata.subTopic) || 'General';
        if (!SSC_HIERARCHY[s]) SSC_HIERARCHY[s] = {};
        if (!SSC_HIERARCHY[s][ss]) SSC_HIERARCHY[s][ss] = {};
        if (!SSC_HIERARCHY[s][ss][tp]) SSC_HIERARCHY[s][ss][tp] = [];
        if (SSC_HIERARCHY[s][ss][tp].indexOf(st) === -1) SSC_HIERARCHY[s][ss][tp].push(st);
      });
      Object.keys(window.DB.quiz || {}).forEach(function(k) {
        var q = window.DB.quiz[k];
        if (!q || typeof q !== 'object') return;
        var s = q.subject || (q.metadata && q.metadata.subject) || 'General';
        var ss = q.subSubject || q.sub_subject || (q.metadata && q.metadata.subSubject) || 'General';
        var tp = q.topic || (q.metadata && q.metadata.topic) || 'General';
        var st = q.subTopic || q.sub_topic || (q.metadata && q.metadata.subTopic) || 'General';
        if (!SSC_HIERARCHY[s]) SSC_HIERARCHY[s] = {};
        if (!SSC_HIERARCHY[s][ss]) SSC_HIERARCHY[s][ss] = {};
        if (!SSC_HIERARCHY[s][ss][tp]) SSC_HIERARCHY[s][ss][tp] = [];
        if (SSC_HIERARCHY[s][ss][tp].indexOf(st) === -1) SSC_HIERARCHY[s][ss][tp].push(st);
      });
    }

    function getMainSubjects() {
      var keys = Object.keys(SSC_HIERARCHY || {});
      return keys.length ? keys : Object.keys(DEFAULT_HIERARCHY);
    }

    function sanitizeHTML(s){if(!s)return'';var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML}
    window.initTheme = function(){var t=localStorage.getItem('ssc_st_th')||'dark',b=document.getElementById('theme-toggle');t==='light'?(document.body.classList.add('light-mode'),b.innerText='Dark Mode'):(document.body.classList.remove('light-mode'),b.innerText='Light Mode')}
    window.initTheme();
    window.toggleTheme = function(){var l=document.body.classList.toggle('light-mode');localStorage.setItem('ssc_st_th',l?'light':'dark');document.getElementById('theme-toggle').innerText=l?'Dark Mode':'Light Mode'}
    window.getArr = function(o){
      if(!o)return[];
      var r=[];
      Object.keys(o).forEach(function(k){
        if(o[k]&&typeof o[k]==='object') {
          var merged = Object.assign({}, o[k].metadata || {}, o[k]);
          merged._key = k;
          r.push(merged);
        }
      });

    window.tog = function(id){
      var el = document.getElementById(id);

      var isShowing = el.classList.toggle('show');
      if(isShowing && SYL_CONTENT_MAP[id] !== undefined){
        var raw = SYL_CONTENT_MAP[id];
        if(!raw || !String(raw).trim()){
          el.innerHTML = '<p style="color:var(--mut);">No content inside this topic yet.</p>';
          return;
        }
        if(/<!doctype|<html|<head|<style|<script/i.test(raw)){
          var ifr = document.createElement('iframe');
          ifr.className = 'syl-iframe';
          ifr.setAttribute('sandbox','allow-scripts allow-same-origin allow-modals allow-popups allow-forms');
          var helper = '<style>html,body{margin:0;padding:12px;overflow-x:hidden;font-family:sans-serif;line-height:1.6;}</style><script>function fH(){try{var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,500);if(window.frameElement)window.frameElement.style.height=(h+40)+"px";}catch(e){}}window.addEventListener("load",function(){setTimeout(fH,100);setTimeout(fH,600);});document.addEventListener("click",function(){setTimeout(fH,150);});<\/script>';
          ifr.srcdoc = /<!doctype|<html/i.test(raw) ? (raw+helper) : ('<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">'+helper+'</head><body style="color:#e2e8f0;background:#0f172a;">'+raw+'</body></html>');
          el.innerHTML = '';
          el.appendChild(ifr);
        } else {
          el.innerHTML = raw;
        }
      }
    }
