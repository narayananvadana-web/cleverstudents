<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SSC Mastery | Smart Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--srf:#161b27;--brd:rgba(255,255,255,.1);--txt:#e2e8f0;--mut:#94a3b8;--font:'Nunito',sans-serif;--r-lg:16px;--r-md:8px;--r-sm:4px}
    body.light-mode{--bg:#f8fafc;--srf:#fff;--txt:#0f172a;--brd:rgba(0,0,0,.1);--mut:#64748b}
    *,::before,::after{margin:0;padding:0;box-sizing:border-box}
    html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;background:var(--bg)!important;overflow-x:hidden!important}
    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;transition:background .3s,color .3s}
    .protected-mode,.protected-mode *{user-select:none!important;-webkit-user-select:none!important}
    input,textarea,select{user-select:auto!important;-webkit-user-select:auto!important}
    img{user-drag:none}.img-th,.modal img{pointer-events:auto!important;cursor:pointer}
    :target{scroll-margin-top:70px}
    .notranslate{translate:no!important}

    .top-info-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--brd);min-height:38px;flex-wrap:wrap}
    .news-ticker-wrap{flex:1;min-width:150px;overflow:hidden;background:rgba(0,0,0,.3);border-radius:16px;padding:4px 10px;border:1px solid rgba(255,215,0,.3);display:flex;align-items:center;gap:8px}
    .news-icon{flex-shrink:0;font-size:.9rem;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .ticker-container{width:100%;overflow:hidden;white-space:nowrap;flex:1}
    #newsTicker{display:inline-block;white-space:nowrap;animation:scrollTicker 40s linear infinite}
    #newsTicker:hover{animation-play-state:paused}
    @keyframes scrollTicker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .news-link{color:#ffd700;font-weight:700;font-size:.72rem;cursor:pointer;margin:0 8px;pointer-events:auto!important;user-select:auto!important}
    .news-link:hover{color:#fff}

    @keyframes redBlink{0%,100%{box-shadow:0 0 5px rgba(255,0,0,.4)}50%{box-shadow:0 0 20px rgba(255,0,0,.9)}}
    .lang-select{padding:5px 8px;border-radius:16px;border:2px solid rgba(255,0,0,.5);background:var(--srf);color:var(--txt);font-weight:700;font-size:.75rem;cursor:pointer;animation:redBlink 1s ease-in-out infinite;flex-shrink:0;min-width:95px;z-index:10}
    .goog-te-banner-frame,#goog-gt-tt,.goog-tooltip,.goog-text-highlight,.goog-te-spinner-pos,.goog-logo-link,.goog-te-gadget span,.VIpgJd-ZVi9od-ORHb,.VIpgJd-ZVi9od-l4eHX,.goog-te-gadget img,.skiptranslate{display:none!important}
    #google_translate_element{position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;overflow:hidden!important}

    .top-bar{background:var(--srf);border-bottom:1px solid var(--brd);padding:0 10px;position:sticky;top:0;z-index:999}
    .top-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;justify-content:space-between}
    .logo{font-family:'Fredoka One',cursive;font-size:1.1rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .user-info{font-weight:700;font-size:.75rem;color:var(--mut)}
    .theme-btn{background:var(--bg);color:var(--txt);border:1px solid var(--brd);font-weight:700;font-size:.72rem;cursor:pointer;padding:4px 8px;border-radius:50px}

    .main-wrap{max-width:100%!important;width:100%!important;padding:12px 8px 50px!important;margin:0 auto}
    .shell{background:var(--srf);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--brd);width:100%;max-width:1400px;margin:0 auto}
    .banner{padding:6px 14px!important;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.2);flex-wrap:wrap;text-align:center}
    .banner h1{font-size:1rem!important;font-weight:800!important;color:#fff!important}
    .banner p{font-size:.75rem!important;font-weight:600!important;color:#fff!important;border-left:2px solid rgba(255,255,255,.6);padding-left:8px}
    
    .sub-row{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;padding:8px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--brd)}
    .btn-sub{padding:5px 12px;border:2px solid transparent;border-radius:4px;color:#fff;font-weight:700;font-size:.76rem;cursor:pointer;opacity:.65;transform:scale(.95);white-space:nowrap}
    .btn-sub.active{opacity:1;transform:scale(1.02);border-color:#fff}
    
    .study-tabs-row{display:flex;gap:4px;padding:6px 10px;background:rgba(0,0,0,.15);flex-wrap:wrap;justify-content:center}
    .study-tab-btn{padding:5px 10px;border-radius:50px;border:1px solid var(--brd);background:0 0;color:var(--mut);font-weight:700;font-size:.7rem;cursor:pointer;white-space:nowrap}
    .study-tab-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
    .study-tab-btn.grand-test{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-color:transparent;font-size:.75rem;animation:grandPulse 2s ease-in-out infinite}
    @keyframes grandPulse{0%,100%{box-shadow:0 0 8px rgba(245,158,11,.5)}50%{box-shadow:0 0 20px rgba(239,68,68,.8)}}
    
    .content{min-height:100px;background:var(--srf)}
    
    .ch-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;margin:4px 8px 0;color:#fff;font-weight:700;font-size:.78rem;border-radius:4px;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.12)}
    .ch-row:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .ch-content{display:none;background:rgba(0,0,0,.2);border:1px solid var(--brd);margin:0 8px 6px;padding:10px;border-radius:0 0 4px 4px;line-height:1.6;font-size:.82rem;color:#f8fafc}
    body.light-mode .ch-content{color:#334155;background:rgba(0,0,0,.02)}
    .ch-content.show{display:block;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    
    .img-th{max-width:140px;max-height:100px;object-fit:cover;border-radius:3px;cursor:pointer;border:1px solid var(--brd);margin:3px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;padding:8px}
    .q-card{border:none;border-radius:5px;padding:12px 8px;text-align:center;cursor:pointer;color:#fff}
    .q-card:hover{transform:translateY(-2px)}.q-card h4{font-weight:800;font-size:.78rem;margin-bottom:3px}

    .q-player{padding:12px;background:var(--srf);border:1px solid var(--brd);border-radius:8px;max-width:1400px;margin:0 auto}
    .q-panel{border-radius:10px;padding:12px;background:rgba(0,0,0,.2)}
    .q-panel img{max-width:200px;max-height:120px;margin:5px;border-radius:4px}
    .opt-btn{padding:10px 12px;background:rgba(255,255,255,.05);border:2px solid var(--brd);border-radius:5px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--txt);text-align:left;margin-bottom:5px;width:100%}
    .opt-btn img{max-width:120px;max-height:60px;vertical-align:middle;margin:0 5px}
    .opt-btn.correct{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}
    .opt-btn.wrong{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}
    .feedback{display:none;padding:8px;border-radius:5px;font-weight:700;font-size:.8rem;color:#fff!important;margin-bottom:12px}
    .feedback.show{display:block}.feedback.correct{background:#15803d}.feedback.wrong{background:#b91c1c}

    .results-container{padding:12px;max-height:60vh;overflow-y:auto}
    .results-header{text-align:center;margin-bottom:15px;padding:12px;background:rgba(0,0,0,.2);border-radius:8px}
    .results-score{font-size:2.5rem;font-weight:900}
    .results-summary{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
    .results-summary-item{text-align:center;padding:6px 12px;background:rgba(0,0,0,.3);border-radius:5px;min-width:55px}
    .results-summary-item .val{font-size:1.3rem;font-weight:900}.results-summary-item .lbl{font-size:.65rem;color:var(--mut)}
    .result-item{background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:5px;padding:12px;margin-bottom:8px}
    .result-item img{max-width:150px;max-height:80px;margin:4px;border-radius:3px}
    .result-qno{display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-weight:900;font-size:.7rem;margin-right:6px}
    .result-qno.correct-q{background:#15803d;color:#fff}.result-qno.wrong-q{background:#b91c1c;color:#fff}.result-qno.skipped-q{background:#64748b;color:#fff}
    .result-status{display:inline-block;padding:2px 8px;border-radius:14px;font-weight:700;font-size:.7rem;margin-top:4px}
    .result-status.correct{background:#15803d;color:#fff}.result-status.wrong{background:#b91c1c;color:#fff}.result-status.skipped{background:#64748b;color:#fff}

    .btn{padding:7px 14px;border:none;border-radius:50px;cursor:pointer;font-weight:700;color:#fff;display:inline-flex;align-items:center;gap:4px;font-size:.76rem}
    .btn:hover{filter:brightness(1.1)}.btn-blue{background:#3b82f6}.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-dark{background:#334155}.btn-orange{background:#f59e0b}
    .btn-sm{padding:4px 10px;font-size:.7rem}.btn-xs{padding:3px 7px;font-size:.65rem}

    #login-overlay{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;align-items:center;justify-content:center}
    .login-box{background:var(--srf);padding:28px 22px;border-radius:var(--r-lg);box-shadow:0 10px 30px rgba(0,0,0,.5);width:90%;max-width:330px;border:1px solid var(--brd);text-align:center}
    .login-inp{width:100%;padding:10px;margin-bottom:10px;border-radius:5px;border:1px solid var(--brd);background:rgba(0,0,0,.2);color:var(--txt);font-size:.85rem;outline:0}
    .login-info{background:rgba(245,158,11,.1);border:1px solid #f59e0b;border-radius:5px;padding:8px;margin-bottom:12px;font-size:.75rem;color:var(--txt)}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99999;display:none;justify-content:center;align-items:center}
    .modal.show{display:flex}.modal img{max-width:92%;max-height:92%;border-radius:6px}
    .modal-close{position:absolute;top:15px;right:20px;color:#fff;font-size:1.8rem;cursor:pointer}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .gt-back-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--brd);border-radius:50px;cursor:pointer;font-weight:700;font-size:.75rem;margin-bottom:10px}
    .gt-back-btn:hover{background:rgba(255,255,255,.2)}
    .gt-step-indicator{background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(239,68,68,.2));border:2px solid #f59e0b;border-radius:8px;padding:10px 16px;margin-bottom:12px;text-align:center;font-weight:800;font-size:.82rem;color:#fbbf24;letter-spacing:1px;animation:stepGlow 2s ease-in-out infinite}
    @keyframes stepGlow{0%,100%{box-shadow:0 0 8px rgba(245,158,11,.3)}50%{box-shadow:0 0 20px rgba(245,158,11,.7)}}
    .gt-step-arrow{color:#f59e0b;margin:0 4px;font-weight:900}
    .gt-subject-container{border:1px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:10px;background:rgba(0,0,0,.15)}
    .gt-subj-check,input.gt-subj-check{accent-color:#22c55e;width:18px;height:18px;cursor:pointer}
    .gt-topic-check,input.gt-topic-check{accent-color:#22c55e;width:15px;height:15px;cursor:pointer}
    .gt-topic-label{transition:all 0.3s ease;display:flex;align-items:center;gap:5px;padding:6px 12px;background:rgba(0,0,0,.2);border-radius:15px;cursor:pointer;font-size:.72rem;border:2px solid transparent}
    .gt-topic-label:hover{transform:translateY(-2px);border-color:rgba(245,158,11,.4)}
    @keyframes marksBlink{0%,100%{border-color:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.6)}50%{border-color:#fca5a5;box-shadow:0 0 15px rgba(239,68,68,.9)}}
    .gt-marks-input-blinking{border:2px solid #ef4444!important;animation:marksBlink 1s ease-in-out infinite;font-size:.8rem!important;font-weight:800!important;color:#fca5a5!important;background:rgba(239,68,68,.15)!important}
    .gt-marks-input-ready{border:2px solid #22c55e!important;animation:none!important;font-size:.8rem!important;font-weight:800!important;color:#4ade80!important;background:rgba(34,197,94,.15)!important}
    .gt-section-header{cursor:pointer;padding:8px 12px;border-radius:6px;margin-bottom:4px;font-weight:700;transition:all 0.3s;display:flex;align-items:center;gap:8px}
    .gt-section-header:hover{filter:brightness(1.1)}
    .gt-section-content{display:none;padding:6px 0 6px 20px}
    .gt-section-content.open{display:block;animation:fadeIn .2s ease}
    .gt-level-count{font-size:.65rem;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.3);color:var(--mut);margin-left:4px}
    .gt-level-count-highlight{font-size:.65rem;padding:2px 7px;border-radius:10px;background:rgba(245,158,11,.2);color:#fbbf24;margin-left:4px;font-weight:700}
    .ch-content img{max-width:100%;height:auto;border-radius:4px;margin:5px 0}
    .item-count-badge{font-size:.68rem;padding:3px 10px;background:rgba(255,255,255,.12);border-radius:12px;white-space:nowrap}
    .item-count-badge span{font-weight:900;color:#fbbf24}

    @media(max-width:768px){.top-info-bar{flex-wrap:wrap}.news-ticker-wrap{flex:0 0 100%}.banner{flex-direction:column}.results-score{font-size:2rem}}
  </style>
</head>
<body class="protected-mode">

  <div id="login-overlay">
    <div class="login-box">
      <div class="logo notranslate" style="margin-bottom:12px;">⭐ SSC Mastery</div>

    <div id="google_translate_element"></div>
    <select class="lang-select" id="lang-select" onchange="window.changeLanguage(this.value)">
      <option value="en">🌐 English</option><option value="te">🔴 తెలుగు</option><option value="hi">🔴 हिन्दी</option><option value="ta">🔴 தமிழ்</option><option value="ml">🔴 മലയാളം</option><option value="kn">🔴 ಕನ್ನಡ</option>

  </div>

  <div class="top-bar"><div class="top-inner"><div class="logo notranslate">⭐ SSC Mastery</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span id="user-display" class="user-info"></span><button class="theme-btn notranslate" id="theme-toggle" onclick="window.toggleTheme()">Light Mode</button><button class="btn btn-red btn-sm" onclick="window.logout()">Logout</button></div></div></div>

  <div class="main-wrap">
    <div id="shell" class="shell"><div class="sub-row" id="sub-row"></div><div class="content" id="content-area"></div></div>
    <div id="quiz-player" class="q-player" style="display:none;"></div>
  </div>

  <div id="img-modal" class="modal" onclick="window.closeModal()"><span class="modal-close">×</span><img id="modal-img" src=""></div>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    // ============ VERCEL KV API HELPERS (No Firebase) ============
    async function fetchDB(key) {
      try {
        const res = await fetch(`/api/db?path=${encodeURIComponent(key)}`);
        if (!res.ok) return null;
        let data = await res.json();
        
        if (data && typeof data === 'object') {
          if ('result' in data) data = data.result;
          else if ('value' in data) data = data.value;
        }
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch (e) { }
        }
        if (data && typeof data === 'object' && data[key]) {
            data = data[key]; 
        }
        return data;
      } catch (err) {
        console.error(`❌ DB Fetch Error for ${key}:`, err);
        return null;
      }
    }

    async function saveDB(key, value) {
      try {
        const res = await fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'set', path: key, data: value })
        });
      } catch (err) {
        console.error(`DB Save Error for ${key}:`, err);
      }
    }

    var sssColorMap={};var sssColorIndex=0;
    var SSS_COLORS=['linear-gradient(135deg,#3b82f6,#1d4ed8)','linear-gradient(135deg,#10b981,#047857)','linear-gradient(135deg,#8b5cf6,#6d28d9)','linear-gradient(135deg,#f59e0b,#d97706)','linear-gradient(135deg,#ef4444,#dc2626)','linear-gradient(135deg,#06b6d4,#0891b2)','linear-gradient(135deg,#ec4899,#db2777)','linear-gradient(135deg,#84cc16,#65a30d)','linear-gradient(135deg,#f97316,#ea580c)','linear-gradient(135deg,#6366f1,#4f46e5)','linear-gradient(135deg,#14b8a6,#0d9488)','linear-gradient(135deg,#a855f7,#9333ea)'];
    function getSSSColor(sss){if(!sssColorMap[sss]){sssColorMap[sss]=SSS_COLORS[sssColorIndex%SSS_COLORS.length];sssColorIndex++;}return sssColorMap[sss];}

    var newsWithLinks=[{text:'🎓 Reasoning - New Study Materials',action:function(){window.switchSubject('Reasoning & Intelligence');studyType='syllabus';window.refreshUI()}},{text:'📚 Quantitative Aptitude Quiz',action:function(){window.switchSubject('Quantitative Aptitude');studyType='quiz';window.refreshUI()}},{text:'🏆 Grand Test - Create Custom Paper!',action:function(){window.openGrandTestConfig()}},{text:'📝 General English - Practice Tests',action:function(){window.switchSubject('General English');studyType='quiz';window.refreshUI()}}];
    window.buildNewsTicker = function(){var t=document.getElementById('newsTicker');if(!t)return;var s=newsWithLinks.slice().sort(function(){return 0.5-Math.random()});var h='';s.forEach(function(i,idx){h+='<a class="news-link" onclick="event.stopPropagation();window.handleNewsClick('+idx+')">'+i.text+'</a>';if(idx<s.length-1)h+='<span style="color:rgba(255,255,255,.3);margin:0 2px">|</span>'});t.innerHTML=h+h}
    window.handleNewsClick = function(i){var r=i%newsWithLinks.length;var n=newsWithLinks[r];if(n&&n.action)n.action()}
    window.buildNewsTicker();setInterval(window.buildNewsTicker,300000);

    window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'te,hi,ta,ml,kn,en',layout:google.translate.TranslateElement.InlineLayout.HORIZONTAL,autoDisplay:true},'google_translate_element');};
    window.changeLanguage = function(l){var ls=document.getElementById('lang-select');ls.style.animation='none';ls.offsetHeight;ls.style.animation='redBlink 0.3s ease-in-out 5';var gc=document.querySelector('.goog-te-combo');if(gc){gc.value=l;gc.dispatchEvent(new Event('change',{bubbles:true}));}}

    var DEFAULT_GUEST_ID='guest',DEFAULT_GUEST_PASS='guest123';
    // DB.quiz will now store the INDEX data (not the heavy shards)
    window.DB={syllabus:{},quiz:{}};
    var settings={loginEnabled:true,users:{},copyEnabled:false,guestAutoLogin:false,guestId:DEFAULT_GUEST_ID,guestPass:DEFAULT_GUEST_PASS};
    var activeSessions={},currentUser={phone:'',token:'',isGuest:false},userAccess={modes:[],subjects:[],classes:[]};
    var studyType='quiz',subject='Reasoning & Intelligence';
    var qActive=[],qIdx=0,qTimer=null,qSec=0,qAns=[],qSourceInfo=[];

    var SSC_HIERARCHY={};
    
    function getMainSubjects(){return Object.keys(SSC_HIERARCHY)}
    function getSubSubjects(main){var d=SSC_HIERARCHY[main];return d?Object.keys(d):[]}
    function getTopics(main,sub){var d=SSC_HIERARCHY[main];if(!d)return[];var s=d[sub];return s?Object.keys(s):[]}
    function getSubTopics(main,sub,topic){var d=SSC_HIERARCHY[main];if(!d)return[];var s=d[sub];if(!s)return[];var t=s[topic];return t||['General']}

    function sanitizeHTML(s){if(!s)return'';var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML}

    // ============ LAUNCHING GRAND TEST WITH SHARD FETCHING ============
    window.startGrandTest = async function(){
      var asq=[];
      var selectedConfigs = [];
      
      document.querySelectorAll('.gt-subj-check:checked').forEach(function(cb){
          var sn=cb.dataset.subject;
          document.querySelectorAll('.gt-ss-marks-input[data-subject="'+sn+'"]').forEach(function(inp){
              var tm=parseInt(inp.value)||0;
              if(tm===0)return;
              var ss=inp.dataset.ss;
              var stk=[];
              document.querySelectorAll('.gt-topic-check[data-subject="'+sn+'"][data-ss="'+ss+'"]:checked').forEach(function(tcb){
                  stk.push(tcb.dataset.key);
              });
              if(stk.length===0)return;
              selectedConfigs.push({ subject: sn, marks: tm, keys: stk });
          });
      });
      
      if(selectedConfigs.length===0){alert('⚠️ No questions selected!');return;}

      document.getElementById('shell').style.display='none';
      var p=document.getElementById('quiz-player');
      p.style.display='block';
      p.innerHTML = '<div style="padding:50px;text-align:center;"><span class="spinner"></span> Assembling Grand Test...</div>';

      // 1. Fetch the necessary Shards dynamically
      var allRequiredKeys = [];
      selectedConfigs.forEach(c => { allRequiredKeys.push(...c.keys); });
      var uniqueKeys = [...new Set(allRequiredKeys)];

      var loadedShards = {};
      await Promise.all(uniqueKeys.map(async k => {
          loadedShards[k] = await fetchDB('qb_' + k) || [];
      }));

      // 2. Distribute Marks
      selectedConfigs.forEach(c => {
          var tc = c.keys.length;
          var bpt = Math.floor(c.marks/tc);
          var ext = c.marks%tc;
          var dist = [];
          for(var i=0; i<tc; i++) dist.push({ key: c.keys[i], count: bpt + (i<ext ? 1 : 0) });
          dist = window.shuffleArray(dist);
          
          dist.forEach(d => {
              var tq = loadedShards[d.key] || [];
              if(tq.length === 0) return;
              var sf = window.shuffleArray(tq);
              var tp = Math.min(d.count, sf.length);
              for(var j=0; j<tp; j++) {
                  asq.push({ question: sf[j], source: d.key, subject: c.subject, topic: d.key.replace(/_/g,' ') });
              }
          });
      });

      asq=window.shuffleArray(asq);
      qActive=asq.map(i=>i.question);
      qSourceInfo=asq.map(i=>({source:i.source, subject:i.subject, topic:i.topic}));
      qAns=new Array(qActive.length).fill(null);
      qIdx=0; qSec=0;
      
      p.dataset.theme='linear-gradient(135deg,#f59e0b,#ef4444)';
      window.stopQT();
      qTimer=setInterval(function(){
          qSec++; 
          var el=document.getElementById('qt');
          if(el) el.innerText='Timer: '+String(Math.floor(qSec/60)).padStart(2,'0')+':'+String(qSec%60).padStart(2,'0');
      },1000);
      window.renderQ();
    }

    // ==================== APP INIT ====================
    async function initApp(){
      const [hier, sets, sess] = await Promise.all([ fetchDB('sscHierarchy'), fetchDB('appSettings'), fetchDB('activeSessions') ]);
      if(hier) SSC_HIERARCHY = hier; else SSC_HIERARCHY = DEFAULT_HIERARCHY;
      
      if(sets) {
         settings.loginEnabled=sets.loginEnabled!==undefined?sets.loginEnabled:true;
         settings.copyEnabled=sets.copyEnabled!==undefined?sets.copyEnabled:false;
         settings.users=sets.users||{};
         settings.guestAutoLogin=sets.guestAutoLogin!==undefined?sets.guestAutoLogin:false;
         settings.guestId=sets.guestId||DEFAULT_GUEST_ID;
         settings.guestPass=sets.guestPass||DEFAULT_GUEST_PASS;
      }
      
      if(settings.copyEnabled){document.body.classList.remove('protected-mode');}
      else{document.body.classList.add('protected-mode');}
      
      if(sess) activeSessions = sess;
      
      window.checkAuth();
      await window.loadAllData(function(){
         if(currentUser.phone||!settings.loginEnabled) window.refreshUI();
      });
    }
    window.onload=initApp;
  </script>
  <script src="/footer.js"></script>
  <script src="/global-navbar.js"></script>
</body>
