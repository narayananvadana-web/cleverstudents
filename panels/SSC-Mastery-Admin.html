<head>

    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;transition:background .3s,color .3s}
    .protected-mode,.protected-mode *{user-select:none!important;-webkit-user-select:none!important}
    input,textarea,select{user-select:auto!important;-webkit-user-select:auto!important}
    #editForm,#editForm *,#groupView,#groupView *,#hierarchyManager,#hierarchyManager *{user-select:auto!important}
    .notranslate{translate:no!important}
    @keyframes redBlink{0%,100%{box-shadow:0 0 5px rgba(255,0,0,.4)}50%{box-shadow:0 0 20px rgba(255,0,0,.9)}}
    .lang-select{padding:6px 10px;border-radius:16px;border:2px solid rgba(255,0,0,.5);background:var(--srf);color:var(--txt);font-weight:700;font-size:.78rem;cursor:pointer;animation:redBlink 1s ease-in-out infinite;flex-shrink:0;min-width:100px;z-index:10}
    .goog-te-banner-frame,#goog-gt-tt,.goog-tooltip,.goog-text-highlight,.goog-te-spinner-pos,.goog-logo-link,.goog-te-gadget span,.VIpgJd-ZVi9od-ORHb,.VIpgJd-ZVi9od-l4eHX,.goog-te-gadget img,.skiptranslate{display:none!important}
    #google_translate_element{position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;overflow:hidden!important}
    .top-bar{background:var(--srf);border-bottom:1px solid var(--brd);padding:0 12px;position:sticky;top:0;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5)}

    .logo{font-family:'Fredoka One',cursive;font-size:1.2rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .theme-btn{background:var(--bg);color:var(--txt);border:1px solid var(--brd);font-weight:700;font-size:.75rem;cursor:pointer;padding:5px 10px;border-radius:50px}
    .btn{padding:8px 16px;border:none;border-radius:50px;cursor:pointer;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.78rem;transition:.2s}

    .btn-blue{background:#3b82f6}.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-dark{background:#334155}.btn-orange{background:#f59e0b}.btn-teal{background:#0d9488}.btn-purple{background:#8b5cf6}.btn-pink{background:#ec4899}.btn-yellow{background:#eab308;color:#000}

    .banner{padding:8px 16px!important;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 8px rgba(0,0,0,.2);flex-wrap:wrap;text-align:center}

    .hm-input-row{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap}
    .hm-input-row input{flex:1;min-width:120px;margin-bottom:0!important;padding:5px 8px;font-size:.7rem}
    .hm-input-row button{flex-shrink:0;font-size:.6rem;padding:4px 8px}
    .hm-header-main{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
    .ad-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;margin:4px 0;color:#fff;font-weight:700;font-size:.78rem;border-radius:4px;cursor:pointer;flex-wrap:wrap;user-select:none}

    @media(max-width:600px){.list-item{flex-direction:column}.admin-tabs{gap:3px}.toolbar{flex-direction:column}.hm-subsubject,.hm-topic{margin-left:5px}.ad-h-st{margin-left:10px}.ad-h-topic{margin-left:8px}.ad-h-sub{margin-left:4px}}

  <script>
    document.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); }, false);

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script>
    // ============ VERCEL KV API HELPERS (WITH RETRY FOR 500 ERRORS) ============
    async function fetchDB(key) {
      try {
        const res = await fetch(`/api/db?path=${encodeURIComponent(key)}`);
        if (!res.ok) return null;
        let data = await res.json();
        if (data && typeof data === 'object') {
          if ('result' in data) data = data.result;
          else if ('value' in data) data = data.value;
        }
        if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { } }
        if (data && typeof data === 'object' && data[key]) { data = data[key]; }
        return data;
      } catch (err) {
        console.error(`❌ DB Fetch Error for ${key}:`, err);
        return null;
      }
    }

    // Auto-retries if Vercel throws a 500 error (Rate Limit protection)
    async function saveDB(key, value, retries = 3) {
      try {
        const res = await fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'set', path: key, data: value })
        });
        if (!res.ok) throw new Error(`Status ${res.status}`);
      } catch (err) {
        if(retries > 0){
            console.warn(`Retrying save for ${key}... (${retries} left)`);
            await new Promise(r => setTimeout(r, 1000));
            return saveDB(key, value, retries - 1);
        }
        console.error(`DB Save Error for ${key}:`, err);
        throw err;
      }
    }

    // ============ GLOBAL STATE & CONFIG ============
    window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'te,hi,ta,ml,kn,en',layout:google.translate.TranslateElement.InlineLayout.HORIZONTAL,autoDisplay:true},'google_translate_element');};
    window.changeLanguage = function(l){var ls=document.getElementById('lang-select');ls.style.animation='none';ls.offsetHeight;ls.style.animation='redBlink 0.3s ease-in-out 5';var gc=document.querySelector('.goog-te-combo');if(gc){gc.value=l;gc.dispatchEvent(new Event('change',{bubbles:true}));}}

    var DEFAULT_ADMIN_ID='admin',DEFAULT_ADMIN_PASS='admin123',DEFAULT_GUEST_ID='guest',DEFAULT_GUEST_PASS='guest123';
    var adminPhone='',adminToken='';
    var settings={loginEnabled:true,users:{},adminPass:DEFAULT_ADMIN_PASS,copyEnabled:false,guestAutoLogin:false,guestId:DEFAULT_GUEST_ID,guestPass:DEFAULT_GUEST_PASS};
    var activeSessions={},currentTab='quiz';
    var allData={syllabus:{},quiz:{}},csvRows=[],selectedItems={};
    var currentFilters={subject:'ALL',subSubject:'ALL',topic:'ALL',subTopic:'ALL',sort:'manual'};
    var draggedItem=null,draggedKey=null,draggedIndex=null;window.answersVisible=false;
    window.skippedRowsData = ""; 
    window.currentEditingQs = null;

    var SSC_HIERARCHY={
      'Reasoning & Intelligence':{ 'Verbal Reasoning':{ 'Analogy':['Number Analogy','Letter Analogy','Word Analogy'] } },
      'Quantitative Aptitude':{ 'Arithmetic':{ 'Number System':['Types','Divisibility'] } }
    };

    function getMainSubjects(){return Object.keys(SSC_HIERARCHY)}
    function getSubSubjects(main){var d=SSC_HIERARCHY[main];return d?Object.keys(d):[]}
    function getTopics(main,sub){var d=SSC_HIERARCHY[main];if(!d)return[];var s=d[sub];return s?Object.keys(s):[]}
    function getSubTopics(main,sub,topic){var d=SSC_HIERARCHY[main];if(!d)return[];var s=d[sub];if(!s)return[];var t=s[topic];return (t&&Array.isArray(t))?t:['General']}
    
    // NEW: Safely get nested properties for both Syllabus and Quiz Index items
    function getSavedSubSubject(item){return item.subSubject||item.subsubject||''}
    function getSavedTopic(item){return item.topic||''}
    function getSavedSubTopic(item){return item.subTopic||item.subtopic||item.subSubSubject||item.subsubsubject||''}

    async function saveHierarchy(){ await saveDB('sscHierarchy', SSC_HIERARCHY); }
    
    function sanitizeHTML(s){if(!s)return'';var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML}
    function scrubHtml(s){if(!s)return '';var d=document.createElement('div');d.innerHTML=s;var ws=d.querySelectorAll('script,iframe');for(var i=0;i<ws.length;i++)ws[i].remove();var as=d.querySelectorAll('*');for(var j=0;j<as.length;j++){var el=as[j];for(var k=el.attributes.length-1;k>=0;k--){var n=el.attributes[k].name.toLowerCase();if(n.indexOf('on')===0||/^(src|href)$/.test(n) && (el.getAttribute(n)||'').toLowerCase().indexOf('javascript:')===0)el.removeAttribute(el.attributes[k].name)}}return d.innerHTML}
    function escapeAttr(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;')}
    function escCSV(s){return s?s.replace(/"/g,'""'):''}

    function admPathOf(k,item){

    function renderItemsList(dk,fk,data,isQuiz){
      var tree={};
      fk.forEach(function(k){
        var item=data[k],p=admPathOf(k,item);
        if(!tree[p.subject])tree[p.subject]={};
        if(!tree[p.subject][p.sub])tree[p.subject][p.sub]={};
        if(!tree[p.subject][p.sub][p.topic])tree[p.subject][p.sub][p.topic]={};
        if(!tree[p.subject][p.sub][p.topic][p.st])tree[p.subject][p.sub][p.topic][p.st]=[];
        tree[p.subject][p.sub][p.topic][p.st].push(k);
      });
      var h='',tick=0;
      var subjColors=['linear-gradient(135deg,#3b82f6,#1d4ed8)','linear-gradient(135deg,#10b981,#047857)','linear-gradient(135deg,#8b5cf6,#6d28d9)','linear-gradient(135deg,#f59e0b,#d97706)','linear-gradient(135deg,#ef4444,#dc2626)','linear-gradient(135deg,#06b6d4,#0891b2)','linear-gradient(135deg,#ec4899,#db2777)','linear-gradient(135deg,#14b8a6,#0d9488)'];
      function san(s){return s.replace(/[^a-zA-Z0-9]/g,'_')}
      
      Object.keys(tree).sort().forEach(function(subject){
        var sBodyId='ad_subj_'+tick+'_'+san(subject);var sTot=0;
        Object.keys(tree[subject]).forEach(function(sub){var subObj=tree[subject][sub];Object.keys(subObj).forEach(function(tp){Object.keys(subObj[tp]).forEach(function(st){sTot+=subObj[tp][st].length})})});
        h+='<div class="ad-h" style="background:'+subjColors[tick%subjColors.length]+';" onclick="window.togAdm(\''+sBodyId+'\')"><span>📚 '+sanitizeHTML(subject)+'</span><span class="item-count-badge">'+sTot+' group(s)</span><span>▼</span></div>';
        h+='<div class="ad-body" id="'+sBodyId+'">';
        Object.keys(tree[subject]).sort().forEach(function(sub){
          var ssBodyId=sBodyId+'_ss_'+san(sub);var subObj=tree[subject][sub];var ssT=0;
          Object.keys(subObj).forEach(function(tp){Object.keys(subObj[tp]).forEach(function(st){ssT+=subObj[tp][st].length})});
          h+='<div class="ad-h ad-h-sub" style="background:rgba(59,130,246,.25);" onclick="window.togAdm(\''+ssBodyId+'\')"><span>📂 '+sanitizeHTML(sub)+' ('+ssT+')</span><span>▼</span></div>';
          h+='<div class="ad-body" id="'+ssBodyId+'">';
          Object.keys(subObj).sort().forEach(function(tp){
            var tpBodyId=ssBodyId+'_tp_'+san(tp);var tpT=0;
            Object.keys(subObj[tp]).forEach(function(st){tpT+=subObj[tp][st].length});
            h+='<div class="ad-h ad-h-topic" style="background:rgba(245,158,11,.22);" onclick="window.togAdm(\''+tpBodyId+'\')"><span>📌 '+sanitizeHTML(tp)+' ('+tpT+')</span><span>▼</span></div>';
            h+='<div class="ad-body" id="'+tpBodyId+'">';
            Object.keys(subObj[tp]).sort().forEach(function(st){
              var stBodyId=tpBodyId+'_st_'+san(st);
              h+='<div class="ad-h ad-h-st" style="background:rgba(236,72,153,.2);" onclick="window.togAdm(\''+stBodyId+'\')"><span>🔹 '+sanitizeHTML(st)+' ('+subObj[tp][st].length+')</span><span>▼</span></div>';
              h+='<div class="ad-body" id="'+stBodyId+'">';
              subObj[tp][st].forEach(function(k){h+=admItemRow(k,fk.indexOf(k),data[k],isQuiz)});
              h+='</div>';
            });
            h+='</div>';
          });
          h+='</div>';
        });
        h+='</div>';
        tick++;
      });
      return h;
    }

      if(!qs){toast('No data to save!','error');return}
      var qEls=document.querySelectorAll('.qe-q'),aEls=document.querySelectorAll('.qe-a'),bEls=document.querySelectorAll('.qe-b'),oEls=document.querySelectorAll('.qe-o'),pEls=document.querySelectorAll('.qe-p'),cEls=document.querySelectorAll('.qe-c'),eEls=document.querySelectorAll('.qe-e');

    function getFilteredAndSortedKeys(keys,data,isQuiz){
      var filtered=[];
      for(var i=0;i<keys.length;i++){
        var k=keys[i],item=data[k];
        if(currentFilters.subject!=='ALL'&&item.subject!==currentFilters.subject)continue;
        var ss=getSavedSubSubject(item);
        if(currentFilters.subSubject!=='ALL'&&ss!==currentFilters.subSubject)continue;
        var tp=getSavedTopic(item);
        if(currentFilters.topic!=='ALL'&&tp!==currentFilters.topic)continue;
        var st=getSavedSubTopic(item);
        if(currentFilters.subTopic!=='ALL'&&st!==currentFilters.subTopic)continue;
        filtered.push(k);
      }
      if(currentFilters.sort==='manual'){
        filtered.sort(function(a,b){
          var oA=(data[a]?data[a].order:undefined);
          var oB=(data[b]?data[b].order:undefined);
          return(oA!==undefined?oA:999999)-(oB!==undefined?oB:999999)
        });
      }
      return filtered;
    }

    window.smartParse = function(text, sourceName){
        text = text ? text.trim() : '';
        if(!text){ toast('Invalid or empty data!','error'); return; }
        if(text.startsWith('[') || text.startsWith('{')){
            try{ var parsed = JSON.parse(text); window.parseJSONData(parsed); return; }catch(e){}
        }
        var rows = window.parseCSVRows(text);
        if(rows.length < 2){toast('Need header + data rows. Found: '+rows.length,'error');return}
        var delimiter = window.detectDelimiter(rows);
        var headers = window.smartSplitLine(rows[0], delimiter);
        var colMap={subject:-1,subSubject:-1,topic:-1,subTopic:-1,question:-1,optA:-1,optB:-1,optC:-1,optD:-1,correct:-1,explanation:-1};
        for(var hi=0;hi<headers.length;hi++){
            var hdr=headers[hi].toLowerCase().replace(/[\s_"-]/g,'');
            if(hdr==='subject'||hdr==='mainsubject')colMap.subject=hi;
            else if(hdr==='subsubject')colMap.subSubject=hi;
            else if(hdr==='topic')colMap.topic=hi;
            else if(hdr==='subtopic')colMap.subTopic=hi;
            else if(hdr==='question'||hdr==='ques'||hdr==='q')colMap.question=hi;
            else if(hdr==='optiona'||hdr==='opta'||hdr==='a')colMap.optA=hi;
            else if(hdr==='optionb'||hdr==='optb'||hdr==='b')colMap.optB=hi;
            else if(hdr==='optionc'||hdr==='optc'||hdr==='c')colMap.optC=hi;
            else if(hdr==='optiond'||hdr==='optd'||hdr==='d')colMap.optD=hi;
            else if(hdr==='correct'||hdr==='answer'||hdr==='ans')colMap.correct=hi;
            else if(hdr==='explanation'||hdr==='exp')colMap.explanation=hi;
        }
        if(colMap.subject===-1&&headers.length>1)colMap.subject=1;
        if(colMap.subSubject===-1&&headers.length>2)colMap.subSubject=2;
        if(colMap.topic===-1&&headers.length>3)colMap.topic=3;
        if(colMap.subTopic===-1&&headers.length>4)colMap.subTopic=4;
        if(colMap.question===-1&&headers.length>5)colMap.question=5;
        if(colMap.optA===-1&&headers.length>6)colMap.optA=6;
        if(colMap.optB===-1&&headers.length>7)colMap.optB=7;
        if(colMap.correct===-1&&headers.length>8)colMap.correct=8;
        if(colMap.explanation===-1&&headers.length>9)colMap.explanation=9;
        
        csvRows=[]; var errors=[];
        window.skippedRowsData = rows[0] + delimiter + '"Error_Reason"\n';

        for(var l=1;l<rows.length;l++){
            var cols = window.smartSplitLine(rows[l], delimiter);
            if(cols.length < 7){ errors.push('Row '+(l+1)+': too few columns'); window.skippedRowsData += rows[l] + delimiter + '"Too few columns"\n'; continue; }
            var subject=window.getCol(cols,colMap.subject)||'General', subSubject=window.getCol(cols,colMap.subSubject)||'General', topic=window.getCol(cols,colMap.topic)||'General', subTopic=window.getCol(cols,colMap.subTopic)||'';
            var question=window.getCol(cols,colMap.question), optA=window.getCol(cols,colMap.optA), optB=window.getCol(cols,colMap.optB), optC=window.getCol(cols,colMap.optC), optD=window.getCol(cols,colMap.optD), ans=window.getCol(cols,colMap.correct).toUpperCase().trim().charAt(0), exp=window.getCol(cols,colMap.explanation)||'';
            var errorMsg = "";
            if(!question||!optA||!optB||!ans) errorMsg = "Missing Q/A/B/Correct";
            else if(['A','B','C','D'].indexOf(ans)===-1) errorMsg = "Correct must be A/B/C/D";
            if(errorMsg !== "") { errors.push('Row '+(l+1)+': ' + errorMsg); window.skippedRowsData += rows[l] + delimiter + '"' + errorMsg + '"\n'; continue; }
            var key=(subject+'_'+subSubject+'_'+topic+(subTopic?'_'+subTopic:'')).replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
            csvRows.push({key:key,subject:subject,subSubject:subSubject,topic:topic,subTopic:subTopic||'',question:question,optionA:optA,optionB:optB,optionC:optC,optionD:optD,correctAnswer:ans,explanation:exp||''});
        }
        window.showCSVPreview(errors, sourceName+' ('+(delimiter==='\t'?'TSV':'CSV')+')');
    }

    window.smartSplitLine = function(line, delimiter) { var result = []; var current = ''; var inQuotes = false; for (var i = 0; i < line.length; i++) { var ch = line[i]; if (ch === '"') { if (inQuotes && line[i + 1] === '"') { current += '"'; i++; } else { inQuotes = !inQuotes; } } else if (ch === delimiter && !inQuotes) { result.push(current.trim()); current = ''; } else { current += ch; } } result.push(current.trim()); return result; };
    window.getCol = function(cols, idx){ return (idx >= 0 && idx < cols.length) ? cols[idx] : ''; }
    window.parseCSVRows = function(text){ var rows=[], current='', inQuotes=false; for(var i=0;i<text.length;i++){ var ch=text[i]; if(ch==='"'){ if(inQuotes && text[i+1]==='"'){ current+='"'; i++; continue; } inQuotes=!inQuotes; continue; } if(ch==='\n' && !inQuotes){ if(current.trim()) rows.push(current.trim()); current=''; continue; } if(ch==='\r' && !inQuotes){ if(current.trim()) rows.push(current.trim()); current=''; if(text[i+1]==='\n') i++; continue; } current+=ch; } if(current.trim()) rows.push(current.trim()); return rows; }
    window.detectDelimiter = function(rows){ var tc=0,cc=0; for(var i=0;i<Math.min(5,rows.length);i++){ var inQ=false; for(var j=0;j<rows[i].length;j++){ var ch=rows[i][j]; if(ch==='"'){ if(inQ && rows[i][j+1]==='"') j++; else inQ=!inQ; continue; } if(ch==='\t' && !inQ) tc++; else if(ch===',' && !inQ) cc++; } } return tc>=cc ? '\t' : ','; }

    window.parseJSONData = function(jsonData){
        var rows=[];
        if(!Array.isArray(jsonData) && typeof jsonData === 'object') {
            Object.keys(jsonData).forEach(function(k) {
                if(Array.isArray(jsonData[k])) { rows = rows.concat(jsonData[k]); }
                else if(typeof jsonData[k] === 'object' && jsonData[k].question) { rows.push(jsonData[k]); }
                else if(typeof jsonData[k] === 'object') { Object.keys(jsonData[k]).forEach(subKey => { if(jsonData[k][subKey].question) rows.push(jsonData[k][subKey]); }); }
            });
            if(rows.length === 0) { if(jsonData.question) rows=[jsonData]; else if(jsonData.questions) rows=jsonData.questions; }
        } else { rows=jsonData; }

        if(!rows || rows.length === 0){ toast('No valid questions found in JSON!','error'); return; }
        
        csvRows=[]; var errors=[];
        window.skippedRowsData = "Subject,Sub-Subject,Topic,Sub-Topic,Question,Option A,Option B,Option C,Option D,Correct,Explanation,Error_Reason\n";

        for(var i=0;i<rows.length;i++){
            var r=rows[i];
            var subject=r.subject||r.Subject||'General', subSubject=r.subSubject||r.subsubject||r['Sub-Subject']||'General', topic=r.topic||r.Topic||'General', subTopic=r.subTopic||r.subtopic||r['Sub-Topic']||'';
            var question=r.question||r.Question||'', optA=r.optionA||r.optA||(r.options&&r.options.A)||r['Option A']||'', optB=r.optionB||r.optB||(r.options&&r.options.B)||r['Option B']||'', optC=r.optionC||r.optC||(r.options&&r.options.C)||r['Option C']||'', optD=r.optionD||r.optD||(r.options&&r.options.D)||r['Option D']||'', ans=(r.correctAnswer||r.answer||r.Answer||'').toString().toUpperCase().charAt(0), exp=r.explanation||r.Explanation||'';
            var errorMsg = "";
            if(!question||!optA||!optB||!ans) errorMsg = "Missing Data (Question or Options missing)";
            else if(['A','B','C','D'].indexOf(ans)===-1) errorMsg = "Invalid Correct Ans (Must be A, B, C, or D)";
            if(errorMsg !== "") { errors.push('Row '+(i+1)+': ' + errorMsg); window.skippedRowsData += `"${subject}","${subSubject}","${topic}","${subTopic}","${escCSV(question)}","${escCSV(optA)}","${escCSV(optB)}","${escCSV(optC)}","${escCSV(optD)}","${ans}","${escCSV(exp)}","${errorMsg}"\n`; continue; }
            var key=(subject+'_'+subSubject+'_'+topic+(subTopic?'_'+subTopic:'')).replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
            csvRows.push({key:key,subject:subject,subSubject:subSubject,topic:topic,subTopic:subTopic||'',question:question,optionA:optA,optionB:optB,optionC:optC,optionD:optD,correctAnswer:ans,explanation:exp||''});
        }
        window.showCSVPreview(errors,'JSON Data');
    }

    // ============ THE FIX: AUTO-CHUNKING HEAVY TOPICS (SAFE FOR VERCEL 413 LIMITS) ============
    window.uploadCSVToFB = async function(){
      if(!csvRows||csvRows.length===0)return;
      var st=document.getElementById('csvUploadStatus');
      st.innerHTML='<span class="spinner"></span> Preparing Upload...';
      
      var groups={};
      var MAX_QS_PER_PART = 2000; // 413 ఎర్రర్ రాకుండా ఒక టాపిక్ కి 60 ప్రశ్నలు మాత్రమే ఉండేలా లిమిట్
      
      for(var i=0;i<csvRows.length;i++){
        var r=csvRows[i];
        var originalKey = r.key;
        var originalTopic = r.topic;
        var currentKey = originalKey;
        var partNum = 1;
        
        // ఒకవేళ గ్రూపులో 60 కి మించి ప్రశ్నలు ఉంటే, ఆటోమేటిక్ గా కొత్త పార్ట్ (Part 2, Part 3) క్రియేట్ అవుతుంది
        while(groups[currentKey] && groups[currentKey].length >= MAX_QS_PER_PART) {
            partNum++;
            currentKey = originalKey + '_Part_' + partNum;
            r.topic = originalTopic + ' (Part ' + partNum + ')'; // స్టూడెంట్ కి ప్యానెల్ లో Part 2 అని కనిపిస్తుంది
        }
        
        if(!groups[currentKey]) groups[currentKey]=[];
        
        if(!SSC_HIERARCHY[r.subject])SSC_HIERARCHY[r.subject]={};
        if(!SSC_HIERARCHY[r.subject][r.subSubject])SSC_HIERARCHY[r.subject][r.subSubject]={};
        if(!SSC_HIERARCHY[r.subject][r.subSubject][r.topic])SSC_HIERARCHY[r.subject][r.subSubject][r.topic]=['General'];
        if(r.subTopic&&SSC_HIERARCHY[r.subject][r.subSubject][r.topic].indexOf(r.subTopic)===-1)SSC_HIERARCHY[r.subject][r.subSubject][r.topic].push(r.subTopic);
        
        groups[currentKey].push({
          question:r.question,
          options:{A:r.optionA,B:r.optionB,C:r.optionC||'',D:r.optionD||''},
          correctAnswer:r.correctAnswer,
          subject:r.subject,
          subSubject:r.subSubject,
          topic:r.topic,
          subTopic:r.subTopic||'',
          subSubSubject:r.subTopic||'',
          explanation:r.explanation||''
        });
      }
      
      await saveHierarchy();
      
      var qIndex = await fetchDB('sscQuestionBank_index') || {};
      var gKeys = Object.keys(groups);
      var done = 0;
      var failed = 0;
      
      for(var j=0; j<gKeys.length; j++){
        var k = gKeys[j];
        var newQs = groups[k];
        
        st.innerHTML=`<span class="spinner"></span> Uploading Group ${j+1} of ${gKeys.length} <br><small>(${k})</small>...`;
        
        try {
            var existingQs = await fetchDB(`qb_${k}`) || [];
            if (!Array.isArray(existingQs)) {
                existingQs = typeof existingQs === 'object' ? Object.values(existingQs) : [];
            }
            
            newQs.forEach(function(q){
               var sig = q.question+'|'+q.options.A+'|'+q.options.B+'|'+q.options.C+'|'+q.options.D;
               if(!existingQs.some(function(x){
                  return (x.question||'')+'|'+((x.options&&x.options.A)||'')+'|'+((x.options&&x.options.B)||'')+'|'+((x.options&&x.options.C)||'')+'|'+((x.options&&x.options.D)||'') === sig
               })){
                 existingQs.push(q);
               }
            });
            
            await saveDB(`qb_${k}`, existingQs);
            
            var fq = existingQs[0];
            qIndex[k] = {
                count: existingQs.length,
                subject: fq.subject || 'General',
                subSubject: fq.subSubject || 'General',
                topic: fq.topic || 'General',
                subTopic: fq.subTopic || 'General',
                order: qIndex[k] ? qIndex[k].order : Date.now()
            };

            if (j % 5 === 0 || j === gKeys.length - 1) {
                await saveDB('sscQuestionBank_index', qIndex);
            }

            if(!allData.quiz) allData.quiz = {};
            allData.quiz[k] = qIndex[k];
            done++;
            
            await new Promise(r => setTimeout(r, 300)); // బ్రేక్ టైం పెంచాను, ఎర్రర్స్ రావు

        } catch (err) {
            console.error("❌ Upload failed for group:", k, err);
            failed++;
        }
      }
      
      if(failed > 0){
        st.innerHTML=`<span style="color:#ef4444;">⚠️️ Uploaded ${done}, Failed ${failed} groups. Check Internet Connection and Try Again!</span>`;
      } else {
        st.innerHTML=`<span style="color:#22c55e;">✅ Done! Uploaded to ${done} groups.</span>`;
        toast('Upload Complete!','success');
        setTimeout(function(){window.clearCSVData();window.refreshUI()}, 1500);
      }
    }

    }
    
    // ============ USERS & SETTINGS ============
    window.renderUsers = function(){var ac=document.getElementById('admin-content'),users=settings.users||{},h='<button class="btn btn-green btn-sm notranslate" onclick="window.showAddUser()">➕ Add User</button><br><br>';var uks=Object.keys(users);if(uks.length===0)h+='<p style="color:var(--mut);">No users yet.</p>';else for(var i=0;i<uks.length;i++){var ph=uks[i],u=users[ph];h+='<div class="card"><strong>📱 '+sanitizeHTML(ph)+'</strong> | Pass: '+(u.pass?'••••':'N/A')+'<br>Subjects: '+(u.subjects||[]).join(', ')+'<br><button class="btn btn-blue btn-xs notranslate" onclick="window.editUser(\''+escapeAttr(ph)+'\')">✏️</button> <button class="btn btn-red btn-xs notranslate" onclick="window.deleteUser(\''+escapeAttr(ph)+'\')">🗑</button></div>'}h+='<div id="userEditForm" style="display:none;"></div>';ac.innerHTML=h}
    window.showAddUser = function(){var ef=document.getElementById('userEditForm');ef.style.display='block';ef.innerHTML='<div class="card"><h3>➕ Add User</h3><div class="form-group"><label>Phone/ID *</label><input id="uf-phone" class="form-inp"></div><div class="form-group"><label>Password *</label><input id="uf-pass" class="form-inp"></div><label>Subjects:</label><div class="checkbox-group">'+getMainSubjects().map(function(s){return'<label class="toggle-checkbox-label"><input type="checkbox" value="'+escapeAttr(s)+'" class="uf-subs"> '+sanitizeHTML(s)+'</label>'}).join('')+'</div><button class="btn btn-green btn-sm notranslate" onclick="window.saveUser(null)">💾 Save</button> <button class="btn btn-dark btn-sm notranslate" onclick="document.getElementById(\'userEditForm\').style.display=\'none\'">❌ Cancel</button></div>'}
    window.editUser = function(phone){var u=settings.users[phone];if(!u)return;var ef=document.getElementById('userEditForm');ef.style.display='block';ef.innerHTML='<div class="card"><h3>✏️ Edit '+sanitizeHTML(phone)+'</h3><div class="form-group"><label>Phone</label><input id="uf-phone" class="form-inp" value="'+escapeAttr(phone)+'" readonly></div><div class="form-group"><label>Password *</label><input id="uf-pass" class="form-inp" value="'+escapeAttr(u.pass||'')+'"></div><label>Subjects:</label><div class="checkbox-group">'+getMainSubjects().map(function(s){return'<label class="toggle-checkbox-label"><input type="checkbox" value="'+escapeAttr(s)+'" class="uf-subs" '+(u.subjects&&u.subjects.indexOf(s)!==-1?'checked':'')+'> '+sanitizeHTML(s)+'</label>'}).join('')+'</div><button class="btn btn-green btn-sm notranslate" onclick="window.saveUser(\''+phone+'\')">💾 Update</button> <button class="btn btn-dark btn-sm notranslate" onclick="document.getElementById(\'userEditForm\').style.display=\'none\'">❌ Cancel</button></div>'}
    
    window.saveUser = async function(orig){
      var phone=document.getElementById('uf-phone').value,pass=document.getElementById('uf-pass').value,subs=[];
      document.querySelectorAll('.uf-subs:checked').forEach(function(c){subs.push(c.value)});
      if(!phone||!pass){toast('Fill all fields','error');return}
      if(orig&&orig!==phone) delete settings.users[orig];
      settings.users[phone]={pass:pass,modes:['ALL'],subjects:subs,classes:['ALL']};
      await saveDB('appSettings', settings);
      toast('Saved!','success');
      document.getElementById('userEditForm').style.display='none';
      window.renderUsers();
    }
    window.deleteUser = async function(phone){
      if(!confirm('Delete '+phone+'?'))return;
      delete settings.users[phone];
      await saveDB('appSettings', settings);
      toast('Deleted!','success');
      window.renderUsers();
    }
    
    window.renderSettings = function(){var ac=document.getElementById('admin-content'),cp=settings.adminPass||DEFAULT_ADMIN_PASS,gid=settings.guestId||DEFAULT_GUEST_ID,gpass=settings.guestPass||DEFAULT_GUEST_PASS;ac.innerHTML='<div class="card"><h3>⚙️ Settings</h3><div class="toggle-setting-row"><span class="toggle-label">🔐 Enable Login</span><div class="toggle-right"><label class="toggle-switch"><input type="checkbox" id="set-login" '+(settings.loginEnabled?'checked':'')+' onchange="window.updateSettingToggle(\'login\')"><span class="toggle-slider"></span></label><span id="login-status">'+(settings.loginEnabled?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span></div></div><div class="toggle-setting-row"><span class="toggle-label">📋 Enable Copy</span><div class="toggle-right"><label class="toggle-switch"><input type="checkbox" id="set-copy" '+(settings.copyEnabled?'checked':'')+' onchange="window.updateSettingToggle(\'copy\')"><span class="toggle-slider"></span></label><span id="copy-status">'+(settings.copyEnabled?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span></div></div><div class="toggle-setting-row"><span class="toggle-label">👤 Guest Auto Login</span><div class="toggle-right"><label class="toggle-switch"><input type="checkbox" id="set-guest-auto" '+(settings.guestAutoLogin?'checked':'')+' onchange="window.updateSettingToggle(\'guestAuto\')"><span class="toggle-slider"></span></label><span id="guestAuto-status">'+(settings.guestAutoLogin?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span></div></div><div class="form-group"><label>Guest ID</label><input id="set-guest-id" class="form-inp" value="'+escapeAttr(gid)+'" style="max-width:250px;"></div><div class="form-group"><label>Guest Password</label><input id="set-guest-pass" class="form-inp" value="'+escapeAttr(gpass)+'" style="max-width:250px;"></div><div class="form-group"><label>Admin Password</label><input id="set-admin-pass" class="form-inp" value="'+escapeAttr(cp)+'" style="max-width:250px;"></div><button class="btn btn-green btn-sm notranslate" onclick="window.saveSettings()">💾 Save</button> <button class="btn btn-orange btn-sm notranslate" onclick="window.resetAdmin()">🔄 Reset Admin</button> <button class="btn btn-teal btn-sm notranslate" onclick="window.resetGuest()">🔄 Reset Guest</button></div>'}
    window.updateSettingToggle = function(type){var cb,se;if(type==='login'){cb=document.getElementById('set-login');se=document.getElementById('login-status')}else if(type==='copy'){cb=document.getElementById('set-copy');se=document.getElementById('copy-status')}else{cb=document.getElementById('set-guest-auto');se=document.getElementById('guestAuto-status')}if(cb&&se)se.innerHTML=cb.checked?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>'}
    
    window.saveSettings = async function(){
      var le=document.getElementById('set-login').checked,ce=document.getElementById('set-copy').checked,ga=document.getElementById('set-guest-auto').checked,ap=document.getElementById('set-admin-pass').value,gid=document.getElementById('set-guest-id').value,gpass=document.getElementById('set-guest-pass').value;
      if(!ap||!gid||!gpass){toast('All fields required','error');return}
      settings.loginEnabled=le;settings.adminPass=ap;settings.copyEnabled=ce;settings.guestAutoLogin=ga;settings.guestId=gid;settings.guestPass=gpass;
      await saveDB('appSettings', settings);
      if(ce)document.body.classList.remove('protected-mode');else document.body.classList.add('protected-mode');
      updateGuestDisplay(); window.checkAuth(); toast('Saved!','success');
    }
    
    window.resetAdmin = async function(){
      if(!confirm('Reset?'))return; settings.adminPass=DEFAULT_ADMIN_PASS;
      await saveDB('appSettings', settings); toast('Reset!','success'); window.renderSettings();
    }
    
    window.resetGuest = async function(){
      if(!confirm('Reset?'))return; settings.guestId=DEFAULT_GUEST_ID; settings.guestPass=DEFAULT_GUEST_PASS;
      await saveDB('appSettings', settings); updateGuestDisplay(); toast('Reset!','success'); window.renderSettings();
    }

    // Initialize application workflow
    async function initApp(){
      const [hier, sets, sess] = await Promise.all([ fetchDB('sscHierarchy'), fetchDB('appSettings'), fetchDB('activeSessions') ]);
      if(hier) SSC_HIERARCHY = hier;
      if(sets) {
         settings.loginEnabled=sets.loginEnabled!==undefined?sets.loginEnabled:true;
         settings.copyEnabled=sets.copyEnabled!==undefined?sets.copyEnabled:false;
         settings.users=sets.users||{};
         settings.adminPass=sets.adminPass||DEFAULT_ADMIN_PASS;
         settings.guestAutoLogin=sets.guestAutoLogin!==undefined?sets.guestAutoLogin:false;
         settings.guestId=sets.guestId||DEFAULT_GUEST_ID;
         settings.guestPass=sets.guestPass||DEFAULT_GUEST_PASS;
      }
      if(settings.copyEnabled) document.body.classList.remove('protected-mode');
      else document.body.classList.add('protected-mode');
      if(sess) activeSessions = sess;
      window.checkAuth();
    }
    window.onload=initApp;
  </script>
</body>
</html>
