<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SSC Mastery | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--srf:#161b27;--brd:rgba(255,255,255,.1);--txt:#e2e8f0;--mut:#94a3b8;--font:'Nunito',sans-serif;--r-lg:16px;--r-md:8px;--r-sm:4px}
    body.light-mode{--bg:#f8fafc;--srf:#fff;--txt:#0f172a;--brd:rgba(0,0,0,.1);--mut:#64748b}
    *,::before,::after{margin:0;padding:0;box-sizing:border-box}
    html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;background:var(--bg)!important;overflow-x:hidden!important}
    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;transition:background .3s,color .3s}
    .protected-mode,.protected-mode *{user-select:none!important;-webkit-user-select:none!important}
    input,textarea,select{user-select:auto!important;-webkit-user-select:auto!important}
    #editForm,#editForm *,#groupView,#groupView *,#hierarchyManager,#hierarchyManager *{user-select:auto!important}
    .notranslate{translate:no!important}
    @keyframes redBlink{0%,100%{box-shadow:0 0 5px rgba(255,0,0,.4)}50%{box-shadow:0 0 20px rgba(255,0,0,.9)}}
    .lang-select{padding:6px 10px;border-radius:16px;border:2px solid rgba(255,0,0,.5);background:var(--srf);color:var(--txt);font-weight:700;font-size:.78rem;cursor:pointer;animation:redBlink 1s ease-in-out infinite;flex-shrink:0;min-width:100px;z-index:10}
    .goog-te-banner-frame,#goog-gt-tt,.goog-tooltip,.goog-text-highlight,.goog-te-spinner-pos,.goog-logo-link,.goog-te-gadget span,.VIpgJd-ZVi9od-ORHb,.VIpgJd-ZVi9od-l4eHX,.goog-te-gadget img,.skiptranslate{display:none!important}
    #google_translate_element{position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;overflow:hidden!important}
    .top-bar{background:var(--srf);border-bottom:1px solid var(--brd);padding:0 12px;position:sticky;top:0;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5)}
    .top-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;justify-content:space-between}
    .logo{font-family:'Fredoka One',cursive;font-size:1.2rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .theme-btn{background:var(--bg);color:var(--txt);border:1px solid var(--brd);font-weight:700;font-size:.75rem;cursor:pointer;padding:5px 10px;border-radius:50px}
    .btn{padding:8px 16px;border:none;border-radius:50px;cursor:pointer;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.78rem;transition:.2s}
    .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
    .btn-blue{background:#3b82f6}.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-dark{background:#334155}.btn-orange{background:#f59e0b}.btn-teal{background:#0d9488}.btn-purple{background:#8b5cf6}.btn-pink{background:#ec4899}.btn-yellow{background:#eab308;color:#000}
    .btn-sm{padding:5px 12px;font-size:.72rem}.btn-xs{padding:3px 8px;font-size:.68rem}
    .main-wrap{max-width:100%!important;width:100%!important;padding:15px 8px 50px!important;margin:0 auto}
    .shell{background:var(--srf);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--brd);width:100%;max-width:1400px;margin:0 auto}
    .banner{padding:8px 16px!important;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 8px rgba(0,0,0,.2);flex-wrap:wrap;text-align:center}
    .banner h1{font-size:1.1rem!important;font-weight:800!important;color:#fff!important}
    .admin-tabs{display:flex;gap:4px;padding:8px 12px;background:rgba(0,0,0,.15);border-bottom:1px solid var(--brd);flex-wrap:wrap;justify-content:center;overflow-x:auto}
    .admin-tab-btn{padding:6px 14px;border-radius:50px;border:1px solid var(--brd);background:0 0;color:var(--mut);font-weight:700;font-size:.75rem;cursor:pointer;transition:.2s;white-space:nowrap}
    .admin-tab-btn:hover{color:var(--txt)}.admin-tab-btn.active{background:#ef4444;color:#fff;border-color:#ef4444}
    .admin-content{padding:15px;background:var(--srf);min-height:400px}
    .form-group{margin-bottom:10px}.form-group label{display:block;font-weight:700;margin-bottom:3px;color:var(--txt);font-size:.8rem}
    .form-inp{width:100%;padding:8px 12px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-size:.85rem;outline:0;margin-bottom:6px}
    textarea.form-inp{min-height:50px;resize:vertical}
    .card{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:var(--r-md);padding:15px;margin-bottom:12px}
    .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px;background:rgba(0,0,0,.2);border-radius:6px;border:1px solid var(--brd)}
    .list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:6px;margin-bottom:5px;flex-wrap:wrap;gap:8px}
    .list-item .item-info{flex:1;min-width:150px}
    .list-item .item-actions{display:flex;gap:4px}
    .tag{display:inline-block;padding:2px 7px;border-radius:14px;font-size:.65rem;font-weight:700;margin:1px}
    .tag-blue{background:#1d4ed8;color:#fff}.tag-teal{background:#0d9488;color:#fff}
    .answer-display-box{background:rgba(34,197,94,.08);border:2px solid #22c55e;border-radius:6px;padding:10px 14px;margin-top:8px;color:#86efac;font-weight:600;line-height:1.6;font-size:.8rem}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ad-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;margin:5px 0;color:#fff;font-weight:800;font-size:.85rem;border-radius:6px;cursor:pointer;flex-wrap:wrap;user-select:none}
    .ad-h-sub{border-left:3px solid #3b82f6;margin-left:12px;font-size:.78rem}
    .ad-h-topic{border-left:3px solid #f59e0b;margin-left:24px;font-size:.74rem}
    .ad-h-st{border-left:3px solid #ec4899;margin-left:36px;font-size:.7rem}
    .ad-body{display:block}.ad-body.collapsed{display:none}
  </style>
</head>
<body class="protected-mode">
<script src="/supabase-client.js"></script>

  <div class="top-bar">
    <div class="top-inner">
      <div class="logo notranslate">⚙️ SSC Admin Panel</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div id="google_translate_element"></div>
        <select class="lang-select notranslate" translate="no" id="lang-select" onchange="window.changeLanguage(this.value)">
          <option value="en">🌐 English</option><option value="te">🔴 తెలుగు</option><option value="hi">🔴 हिन्दी</option><option value="ta">🔴 தமிழ்</option><option value="ml">🔴 മലയാളം</option><option value="kn">🔴 ಕನ್ನಡ</option>
        </select>
        <span id="admin-info" style="font-weight:700;font-size:.78rem;color:#4ade80;">Admin: admin</span>
        <button class="theme-btn notranslate" id="theme-toggle" onclick="window.toggleTheme()">Light Mode</button>
      </div>
    </div>
  </div>

  <div class="main-wrap">
    <div class="shell" id="shell">
      <div class="banner notranslate" style="background:linear-gradient(135deg,#f59e0b,#ef4444);">
        <h1>⚙️ SSC Admin Control Panel</h1>
      </div>
      <div class="admin-tabs" id="admin-tabs">
        <button class="admin-tab-btn active notranslate" onclick="window.switchTab('quiz')">📝 Quiz (400 Sets)</button>
        <button class="admin-tab-btn notranslate" onclick="window.switchTab('syllabus')">📖 Syllabus</button>
      </div>
      <div class="admin-content" id="admin-content">
        <div style="padding:30px;text-align:center;"><span class="spinner"></span> Loading Data Instantly...</div>
      </div>
    </div>
  </div>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script>
    // ============ 0.2-SECOND DIRECT SUPABASE CLIENT LOADER ============
    async function fetchDB(key) {
      var db = await window.supabaseReady;
      if (key === 'sscQuestionBank_index') {
        var res = await db.from('quiz_sets').select('*').eq('course', 'ssc').limit(1000);
        var rows = (res && res.data) || [];
        var idx = {};
        rows.forEach(function(r) {
          var m = r.metadata || {};
          var k = r.quiz_key || r.legacy_key || r.id;
          idx[k] = {
            id: r.id,
            count: Number(m.count) || 10,
            subject: r.subject || m.subject || 'General Studies',
            subSubject: r.sub_subject || m.subSubject || 'General',
            topic: r.topic || m.topic || r.title || k,
            subTopic: r.sub_topic || m.subTopic || 'General',
            order: r.order_index || m.order || 0
          };
        });
        return idx;
      }
      if (key === 'sscTheoryDatabase') {
        var sRes = await db.from('study_materials').select('*').eq('course', 'ssc').limit(1000);
        var sRows = (sRes && sRes.data) || [];
        var sMap = {};
        sRows.forEach(function(r) {
          var m = r.metadata || {};
          var k = r.legacy_key || r.material_key || r.id;
          sMap[k] = {
            title: r.title || m.title || 'Untitled',
            subject: r.subject || m.subject || 'General English',
            subSubject: r.sub_subject || m.subSubject || 'General',
            topic: r.topic || m.topic || 'General',
            subTopic: r.sub_topic || m.subTopic || 'General',
            content: r.content_html || m.content || '',
            order: r.order_index || m.order || 0
          };
        });
        return sMap;
      }
      if (key.indexOf('qb_') === 0) {
        var qKey = key.substring(3);
        var qSet = allData.quiz && allData.quiz[qKey];
        var setId = qSet && qSet.id;
        if (!setId) {
          var stRes = await db.from('quiz_sets').select('id').eq('course', 'ssc').eq('quiz_key', qKey).limit(1);
          if (stRes.data && stRes.data.length) setId = stRes.data[0].id;
        }
        if (setId) {
          var qRes = await db.from('quiz_questions').select('*').eq('quiz_set_id', setId).order('order_index', { ascending: true }).limit(2000);
          var qRows = (qRes && qRes.data) || [];
          return qRows.map(function(r) {
            var m = r.metadata || {};
            return {
              question: r.question_html || r.question_text || m.question || '',
              options: r.options || m.options || { A: r.option_a, B: r.option_b, C: r.option_c, D: r.option_d },
              correctAnswer: r.correct_answer || m.correctAnswer || 'A',
              explanation: r.explanation_html || r.explanation || m.explanation || ''
            };
          });
        }
      }
      return {};
    }

    window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'te,hi,ta,ml,kn,en',layout:google.translate.TranslateElement.InlineLayout.HORIZONTAL,autoDisplay:false},'google_translate_element');};
    window.changeLanguage = function(l){var gc=document.querySelector('.goog-te-combo');if(gc){gc.value=l;gc.dispatchEvent(new Event('change',{bubbles:true}));}}

    var currentTab='quiz';
    var allData={syllabus:{},quiz:{}};

    function sanitizeHTML(s){if(!s)return'';var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML}
    function escapeAttr(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;')}
    
    window.initTheme = function(){var t=localStorage.getItem('ssc_ad_th')||'dark',b=document.getElementById('theme-toggle');t==='light'?(document.body.classList.add('light-mode'),b.innerText='Dark Mode'):(document.body.classList.remove('light-mode'),b.innerText='Light Mode')}
    window.initTheme();
    window.toggleTheme = function(){var l=document.body.classList.toggle('light-mode');localStorage.setItem('ssc_ad_th',l?'light':'dark');document.getElementById('theme-toggle').innerText=l?'Dark Mode':'Light Mode'}

    window.switchTab = function(tab){
      currentTab=tab;
      var btns=document.querySelectorAll('.admin-tab-btn');
      for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
      var ab=document.querySelector('.admin-tab-btn[onclick*="\''+tab+'\'"]');
      if(ab)ab.classList.add('active');
      window.refreshUI();
    }

    window.refreshUI = async function(){
      var ac=document.getElementById('admin-content');
      var refMap={syllabus:'sscTheoryDatabase',quiz:'sscQuestionBank_index'};
      var keyMap={syllabus:'syllabus',quiz:'quiz'};
      ac.innerHTML='<div style="padding:30px;text-align:center;"><span class="spinner"></span> Loading Data...</div>';
      try {
        const data = await fetchDB(refMap[currentTab]);
        allData[keyMap[currentTab]] = data || {};
        window.renderContent(keyMap[currentTab]);
      } catch (err) {
        ac.innerHTML='<div style="padding:30px;text-align:center;color:#ef4444;"><p>⚠️ Error loading data</p><button class="btn btn-blue btn-sm" onclick="window.refreshUI()">🔄 Retry</button></div>';
      }
    }

    window.togAdm = function(id){var el=document.getElementById(id);if(el)el.classList.toggle('collapsed')}

    function admItemRow(k,i,item,isQuiz){
      var h='<div class="list-item" data-key="'+escapeAttr(k)+'">';
      h+='<div class="item-info">';
      if(isQuiz){
        var cnt = item.count || 0;
        h+='<strong>'+sanitizeHTML(k.replace(/_/g,' '))+'</strong> <span class="tag tag-teal">'+cnt+' Qs</span> ';
        if(item.subject)h+='<span class="tag tag-blue">'+sanitizeHTML(item.subject)+'</span>';
        h+='</div><div class="item-actions"><button class="btn btn-blue btn-xs notranslate" onclick="window.viewQuizGroup(\''+escapeAttr(k)+'\')">👁 View Questions</button>';
      }else{
        h+='<strong>'+(item.title?sanitizeHTML(item.title):'Untitled')+'</strong> ';
        if(item.subject)h+='<span class="tag tag-blue">'+sanitizeHTML(item.subject)+'</span>';
        h+='</div><div class="item-actions"><button class="btn btn-blue btn-xs notranslate" onclick="window.editSyllabusItem(\''+escapeAttr(k)+'\')">👁 View Content</button>';
      }
      h+='</div></div>';
      return h;
    }

    function renderItemsList(dk,fk,data,isQuiz){
      var tree={};
      fk.forEach(function(k){
        var item=data[k];
        var s=item.subject||'General', sub=item.subSubject||'General', tp=item.topic||'General', st=item.subTopic||'General';
        if(!tree[s])tree[s]={};
        if(!tree[s][sub])tree[s][sub]={};
        if(!tree[s][sub][tp])tree[s][sub][tp]={};
        if(!tree[s][sub][tp][st])tree[s][sub][tp][st]=[];
        tree[s][sub][tp][st].push(k);
      });
      var h='',tick=0;
      var subjColors=['linear-gradient(135deg,#3b82f6,#1d4ed8)','linear-gradient(135deg,#10b981,#047857)','linear-gradient(135deg,#8b5cf6,#6d28d9)','linear-gradient(135deg,#f59e0b,#d97706)'];
      function san(s){return String(s).replace(/[^a-zA-Z0-9]/g,'_')}
      
      Object.keys(tree).sort().forEach(function(subject){
        var sBodyId='ad_subj_'+tick+'_'+san(subject);var sTot=0;
        Object.keys(tree[subject]).forEach(function(sub){var subObj=tree[subject][sub];Object.keys(subObj).forEach(function(tp){Object.keys(subObj[tp]).forEach(function(st){sTot+=subObj[tp][st].length})})});
        h+='<div class="ad-h" style="background:'+subjColors[tick%subjColors.length]+';" onclick="window.togAdm(\''+sBodyId+'\')"><span>📚 '+sanitizeHTML(subject)+'</span><span class="tag tag-teal">'+sTot+' group(s) ▼</span></div>';
        h+='<div class="ad-body collapsed" id="'+sBodyId+'">';
        Object.keys(tree[subject]).sort().forEach(function(sub){
          var ssBodyId=sBodyId+'_ss_'+san(sub);var subObj=tree[subject][sub];var ssT=0;
          Object.keys(subObj).forEach(function(tp){Object.keys(subObj[tp]).forEach(function(st){ssT+=subObj[tp][st].length})});
          h+='<div class="ad-h ad-h-sub" style="background:rgba(59,130,246,.25);" onclick="window.togAdm(\''+ssBodyId+'\')"><span>📂 '+sanitizeHTML(sub)+' ('+ssT+')</span><span>▼</span></div>';
          h+='<div class="ad-body collapsed" id="'+ssBodyId+'">';
          Object.keys(subObj).sort().forEach(function(tp){
            var tpBodyId=ssBodyId+'_tp_'+san(tp);var tpT=0;
            Object.keys(subObj[tp]).forEach(function(st){tpT+=subObj[tp][st].length});
            h+='<div class="ad-h ad-h-topic" style="background:rgba(245,158,11,.22);" onclick="window.togAdm(\''+tpBodyId+'\')"><span>📌 '+sanitizeHTML(tp)+' ('+tpT+')</span><span>▼</span></div>';
            h+='<div class="ad-body collapsed" id="'+tpBodyId+'">';
            Object.keys(subObj[tp]).sort().forEach(function(st){
              var stBodyId=tpBodyId+'_st_'+san(st);
              h+='<div class="ad-h ad-h-st" style="background:rgba(236,72,153,.2);" onclick="window.togAdm(\''+stBodyId+'\')"><span>🔹 '+sanitizeHTML(st)+' ('+subObj[tp][st].length+')</span><span>▼</span></div>';
              h+='<div class="ad-body" id="'+stBodyId+'">';
              subObj[tp][st].forEach(function(k, idx){h+=admItemRow(k,idx,data[k],isQuiz)});
              h+='</div>';
            });
            h+='</div>';
          });
          h+='</div>';
        });
        h+='</div>';
        tick++;
      });
      return h;
    }

    window.renderContent = function(dk){
      var ac=document.getElementById('admin-content'),data=allData[dk]||{},keys=Object.keys(data),isQuiz=(dk==='quiz'),h='';
      h+='<div class="toolbar"><span style="color:var(--txt);font-weight:800;">✅ Total Groups Loaded Instantly: <strong style="color:#4ade80;font-size:1.1rem;">'+keys.length+'</strong> (Click any subject below to expand)</span></div>';
      h+='<div id="groupView" style="display:none;margin-bottom:15px;"></div><div id="editForm" style="display:none;margin-bottom:15px;"></div>';
      h+='<div id="itemsList">';
      if(keys.length===0)h+='<div style="padding:25px;text-align:center;color:var(--mut);">No data yet.</div>';
      else h+=renderItemsList(dk,keys,data,isQuiz);
      h+='</div>';
      ac.innerHTML=h;
    }

    window.viewQuizGroup = async function(key){
      var gv=document.getElementById('groupView');
      gv.innerHTML='<div style="padding:20px;text-align:center;"><span class="spinner"></span> Loading questions...</div>';
      gv.style.display='block'; gv.scrollIntoView({behavior:'smooth'});
      var qs = await fetchDB('qb_' + key);
      if(!qs||!Array.isArray(qs)){gv.innerHTML='<p>No data</p>';return}
      var h='<div class="card"><h3>📝 '+sanitizeHTML(key.replace(/_/g,' '))+' ('+qs.length+' Qs) <button class="btn btn-dark btn-sm" style="float:right;" onclick="document.getElementById(\'groupView\').style.display=\'none\'">✕ Close</button></h3><br>';
      for(var i=0;i<qs.length;i++){
        var q=qs[i];
        h+='<div class="answer-display-box"><strong>Q'+(i+1)+':</strong> '+(q.question||'')+'<br><strong>✅ Answer:</strong> '+sanitizeHTML(q.correctAnswer)+') '+((q.options&&q.options[q.correctAnswer])||'');
        if(q.explanation)h+='<br><small style="color:#fbbf24;">💡 '+q.explanation+'</small>';
        h+='</div>';
      }
      h+='</div>';
      gv.innerHTML=h;
    }

    window.editSyllabusItem = function(key){
      var item=allData.syllabus[key];if(!item)return;
      var ef=document.getElementById('editForm');ef.style.display='block';
      ef.innerHTML='<div class="card"><h3>📖 '+sanitizeHTML(item.title||key)+' <button class="btn btn-dark btn-sm" style="float:right;" onclick="document.getElementById(\'editForm\').style.display=\'none\'">✕ Close</button></h3><div style="margin-top:12px;padding:12px;background:rgba(0,0,0,.3);border-radius:8px;">'+(item.content||'No content')+'</div></div>';
      ef.scrollIntoView({behavior:'smooth'});
    }

    window.addEventListener('DOMContentLoaded', function(){
      window.refreshUI();
    });
  </script>
  <script src="/footer.js"></script>
  <script src="/global-navbar.js"></script>
</body>
</html>
