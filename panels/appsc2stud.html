<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APPSC Mastery | Student Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--srf:#161b27;--brd:rgba(255,255,255,.1);--txt:#e2e8f0;--mut:#94a3b8;--font:'Nunito',sans-serif;--r-lg:16px;--r-md:8px;--r-sm:4px}
    body.light-mode{--bg:#f8fafc;--srf:#fff;--txt:#0f172a;--brd:rgba(0,0,0,.1);--mut:#64748b}
    *,::before,::after{margin:0;padding:0;box-sizing:border-box}
    html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;min-width:100%!important;background:var(--bg)!important;overflow-x:hidden!important}
    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
    
    .protected-mode,.protected-mode *{user-select:none!important;-webkit-user-select:none!important;-ms-user-select:none!important}
    input,textarea,select{user-select:auto!important;-webkit-user-select:auto!important}
    .notranslate{translate:no!important}

    .top-info-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 15px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--brd);min-height:50px;flex-wrap:wrap}
    .news-ticker-wrap{flex:1;min-width:200px;overflow:hidden;background:rgba(0,0,0,.3);border-radius:20px;padding:8px 15px;border:1px solid rgba(255,215,0,.3);display:flex;align-items:center;gap:10px}
    .news-icon{flex-shrink:0;font-size:1.2rem;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}
    .ticker-container{width:100%;overflow:hidden;white-space:nowrap;flex:1;min-width:0}
    #newsTicker{display:inline-block;white-space:nowrap;animation:scrollTicker 40s linear infinite}
    #newsTicker:hover{animation-play-state:paused}
    @keyframes scrollTicker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .news-link{color:#ffd700;font-weight:700;font-size:.9rem;cursor:pointer;margin:0 15px;text-decoration:none}
    .news-link:hover{color:#fff;text-shadow:0 0 10px rgba(255,215,0,.8)}
    .news-separator{color:rgba(255,255,255,.3);margin:0 5px}
    
    @keyframes redBlink{0%,100%{box-shadow:0 0 5px rgba(255,0,0,.4);border-color:rgba(255,0,0,.5)}50%{box-shadow:0 0 20px rgba(255,0,0,.9);border-color:rgba(255,0,0,.9)}}
    .lang-select{padding:8px 12px;border-radius:20px;border:2px solid rgba(255,0,0,.5);background:var(--srf);color:var(--txt);font-weight:700;font-size:.85rem;cursor:pointer;animation:redBlink 1s ease-in-out infinite;flex-shrink:0;min-width:110px;font-family:var(--font)}
    .lang-select option{background:var(--srf);color:var(--txt)}
    .goog-te-banner-frame,#goog-gt-tt,.goog-tooltip,.goog-text-highlight,.goog-te-spinner-pos,.goog-logo-link,.goog-te-gadget span,.VIpgJd-ZVi9od-ORHb,.VIpgJd-ZVi9od-l4eHX,.goog-te-gadget img,.skiptranslate{display:none!important}
    #google_translate_element{position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;overflow:hidden!important}

    .main-wrap{max-width:100%!important;width:100%!important;padding:20px 10px 80px!important;margin:0 auto}
    .shell{background:var(--srf);border-radius:8px;overflow:hidden;border:1px solid var(--brd);max-width:1400px;margin:0 auto}
    
    .filter-row{display:flex;gap:10px;padding:10px 15px;flex-wrap:wrap;justify-content:center;align-items:center;background:rgba(0,0,0,.15);border-bottom:1px solid var(--brd)}
    .filter-label{font-weight:800;font-size:.85rem;color:var(--mut);white-space:nowrap}
    .filter-select{padding:7px 14px;border-radius:20px;border:1px solid var(--brd);background:var(--srf);color:var(--txt);font-weight:700;font-size:.82rem;cursor:pointer;font-family:var(--font);min-width:130px}
    
    .sub-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:14px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--brd)}
    .btn-sub{padding:9px 18px;border:2px solid transparent;border-radius:8px;color:#fff;font-weight:800;font-size:.9rem;cursor:pointer;opacity:.7;transform:scale(.95);white-space:nowrap;font-family:var(--font);transition:.2s}
    .btn-sub:hover{opacity:.9;transform:scale(1)}
    .btn-sub.active{opacity:1;transform:scale(1.05);border-color:#fff;box-shadow:0 0 15px rgba(255,255,255,.3)}
    
    .sub-cat-row{display:flex;gap:8px;padding:12px 15px;background:rgba(0,0,0,.1);border-bottom:1px solid var(--brd);overflow-x:auto;justify-content:center;flex-wrap:wrap}
    .btn-sub-cat{padding:7px 15px;border:2px solid rgba(255,255,255,.2);border-radius:20px;background:rgba(255,255,255,.05);color:var(--txt);font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap;font-family:var(--font);transition:.2s}
    .btn-sub-cat:hover{background:rgba(255,255,255,.15)}
    .btn-sub-cat.active{background:#f59e0b;color:#000;border-color:#f59e0b}
    
    .study-tabs-row{display:flex;gap:8px;padding:10px 15px;background:rgba(0,0,0,.15);flex-wrap:wrap;justify-content:center}
    .study-tab-btn{padding:8px 18px;border-radius:50px;border:1px solid var(--brd);background:0 0;color:var(--mut);font-weight:800;font-size:.85rem;cursor:pointer;font-family:var(--font);transition:.2s;white-space:nowrap}
    .study-tab-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
    .study-tab-btn.grand-test{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-color:transparent;font-size:.85rem;animation:grandPulse 2s ease-in-out infinite}
    @keyframes grandPulse{0%,100%{box-shadow:0 0 10px rgba(245,158,11,.5)}50%{box-shadow:0 0 25px rgba(239,68,68,.8),0 0 40px rgba(245,158,11,.4)}}
    
    .content{min-height:150px;background:var(--srf);padding-bottom:20px}
    .banner{padding:12px 20px!important;display:flex;align-items:center;justify-content:center;gap:15px;box-shadow:0 4px 10px rgba(0,0,0,.2);text-align:center;flex-wrap:wrap}
    .banner h1{font-size:1.3rem!important;font-weight:900!important;color:#fff!important}
    .banner p{font-size:.9rem!important;font-weight:700!important;color:#fff!important}

    /* Collapsible Topic & Sub-Topic Rows with Alternating Shades */
    .ch-row{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;margin:10px 15px 0;color:#fff;font-weight:800;font-size:1.02rem;border-radius:8px;cursor:pointer;transition:.2s;box-shadow:0 3px 8px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12)}
    .ch-row:hover{filter:brightness(1.12);transform:translateY(-1px)}
    .ch-sub-row{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;margin:8px 10px 0;color:#fff;font-weight:800;font-size:.94rem;border-radius:8px;cursor:pointer;transition:.2s;border-left:4px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.2)}
    .ch-sub-row:hover{filter:brightness(1.12)}
    .ch-content{display:none;background:rgba(0,0,0,.28);border:1px solid var(--brd);margin:0 15px 12px;padding:15px;border-radius:0 0 8px 8px;line-height:1.8;color:#f8fafc;overflow-x:auto}
    .ch-sub-content{display:none;background:rgba(0,0,0,.2);border:1px solid var(--brd);margin:0 10px 10px;padding:12px;border-radius:0 0 8px 8px}
    body.light-mode .ch-content{color:#334155;background:rgba(0,0,0,.03)}
    .ch-content.show,.ch-sub-content.show{display:block;animation:fadeIn .25s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    
    .badge-pill{background:rgba(0,0,0,.35);padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:800;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.15)}
    .badge-pill b{color:#fde047}

    .img-th{max-width:200px;max-height:150px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--brd);margin:5px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:8px}
    .q-card{border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;color:#fff;transition:.2s;box-shadow:0 4px 10px rgba(0,0,0,.25)}
    .q-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.45);filter:brightness(1.12)}
    .q-card h4{font-weight:900;font-size:1.05rem;margin-bottom:6px}

    /* Grand Test Config */
    .gt-subject-section{background:rgba(0,0,0,.2);border-radius:8px;padding:15px;margin:12px 15px;border:1px solid var(--brd)}
    .gt-subject-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:800;font-size:1rem;flex-wrap:wrap;gap:8px}
    .gt-subject-header-left{display:flex;align-items:center;gap:8px}
    .gt-topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)}
    .gt-checkbox{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.15);border-radius:6px;cursor:pointer;font-size:.82rem;transition:.2s;border:1px solid transparent}
    .gt-checkbox:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.2)}
    .gt-checkbox input{accent-color:#f59e0b;width:16px;height:16px;cursor:pointer;flex-shrink:0}
    .gt-marks-input{width:80px;padding:6px 10px;border-radius:6px;border:1px solid var(--brd);background:rgba(0,0,0,.3);color:#fff;font-weight:700;text-align:center;font-family:var(--font)}
    .gt-total-bar{background:linear-gradient(135deg,#f59e0b,#ef4444);padding:15px 20px;border-radius:8px;margin:15px;text-align:center;font-weight:900;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
    .gt-warning{background:rgba(239,68,68,.1);border:1px solid #ef4444;border-radius:8px;padding:12px;margin:10px 15px;color:#ef4444;font-size:.85rem;display:none}
    .gt-select-all-btn{font-size:.7rem;padding:4px 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--txt);border-radius:15px;cursor:pointer;font-family:var(--font)}
    .gt-select-all-btn:hover{background:rgba(255,255,255,.2)}

    /* Quiz Player */
    .q-player{padding:20px;background:var(--srf);border:1px solid var(--brd);border-radius:8px;max-width:1400px;margin:0 auto}
    .q-panel{border-radius:16px;padding:20px;background:rgba(0,0,0,.2)}
    body.light-mode .q-panel{background:#f1f5f9;border:1px solid #e2e8f0}
    .opt-btn{padding:14px 18px;background:rgba(255,255,255,.05);border:2px solid var(--brd);border-radius:8px;cursor:pointer;font-weight:700;font-size:1rem;color:var(--txt);text-align:left;margin-bottom:10px;width:100%;transition:.2s;font-family:var(--font);display:flex;align-items:center;gap:10px}
    .opt-btn:hover{border-color:#3b82f6}
    .opt-btn.correct{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}
    .opt-btn.wrong{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}
    .opt-btn.reveal{background:rgba(34,197,94,.2)!important;border-color:#22c55e!important}
    .feedback{display:none;padding:14px;border-radius:8px;font-weight:700;color:#fff!important;margin-bottom:20px;line-height:1.6}
    .feedback.show{display:block}
    .feedback.correct{background:#15803d;border-left:4px solid #22c55e}
    .feedback.wrong{background:#b91c1c;border-left:4px solid #ef4444}

    /* Full Results Analytics */
    .results-container{padding:20px;max-height:78vh;overflow-y:auto}
    .results-header{text-align:center;margin-bottom:20px;padding:20px;background:rgba(0,0,0,.2);border-radius:12px}
    .results-score{font-size:4rem;font-weight:900}
    .results-summary{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:15px 0}
    .results-summary-item{text-align:center;padding:10px 20px;background:rgba(0,0,0,.3);border-radius:8px;min-width:80px}
    .results-summary-item .val{font-size:1.8rem;font-weight:900}
    .results-summary-item .lbl{font-size:.7rem;color:var(--mut)}
    .analysis-card{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:8px;padding:15px;margin-bottom:12px}
    .analysis-card h4{margin-bottom:8px}
    .progress-bar-bg{background:rgba(0,0,0,.3);border-radius:20px;height:12px;overflow:hidden;margin:5px 0}
    .progress-bar-fill{height:100%;border-radius:20px;transition:width .5s}
    .result-item{background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:8px;padding:15px;margin-bottom:10px}
    .result-qno{display:inline-block;width:28px;height:28px;border-radius:50%;text-align:center;line-height:28px;font-weight:900;font-size:.8rem;margin-right:8px}
    .result-qno.correct-q{background:#15803d;color:#fff}.result-qno.wrong-q{background:#b91c1c;color:#fff}.result-qno.skipped-q{background:#64748b;color:#fff}
    .result-status{display:inline-block;padding:4px 10px;border-radius:20px;font-weight:700;font-size:.8rem}
    .result-status.correct{background:#15803d;color:#fff}.result-status.wrong{background:#b91c1c;color:#fff}.result-status.skipped{background:#64748b;color:#fff}
    .result-question{font-weight:800;font-size:1.05rem;margin:8px 0}
    .result-option{padding:8px 12px;margin:4px 0;border-radius:6px;font-size:.9rem;border-left:3px solid transparent}
    .result-option.correct-answer{background:rgba(34,197,94,.15);border-left-color:#22c55e;color:#22c55e;font-weight:700}
    .result-option.user-wrong{background:rgba(239,68,68,.15);border-left-color:#ef4444;color:#ef4444;font-weight:700}
    .result-option.user-correct{background:rgba(34,197,94,.25);border-left-color:#22c55e;color:#22c55e;font-weight:700}
    .result-explanation{background:rgba(59,130,246,.1);border:1px solid #3b82f6;border-radius:6px;padding:8px 12px;margin-top:8px;color:#93c5fd;font-size:.85rem}
    .result-source{font-size:.75rem;color:var(--mut);margin-bottom:4px}

    .btn{padding:10px 20px;border:none;border-radius:50px;cursor:pointer;font-weight:800;color:#fff;font-family:var(--font);display:inline-flex;align-items:center;gap:6px;transition:.2s}
    .btn:hover{filter:brightness(1.15)}.btn-blue{background:#3b82f6}.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-dark{background:#334155}.btn-orange{background:#f59e0b}
    .btn-sm{padding:6px 14px;font-size:.8rem}.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
    
    /* AI Chat */
    .ai-btn{position:fixed;bottom:20px;right:20px;width:55px;height:55px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#7c3aed);font-size:1.5rem;z-index:999;box-shadow:0 4px 20px rgba(139,92,246,.5);border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
    .chat-box{background:var(--srf);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--brd);display:none;max-width:400px;position:fixed;bottom:80px;right:20px;width:90%;z-index:998}
    .chat-msgs{height:350px;overflow-y:auto;padding:20px;background:rgba(0,0,0,.2)}
    .chat-msg{display:flex;margin-bottom:16px;align-items:flex-start}.chat-msg.user{flex-direction:row-reverse}
    .msg-bub{max-width:85%;padding:12px 16px;border-radius:20px;font-size:.9rem;line-height:1.5}
    .chat-msg.user .msg-bub{background:#3b82f6;color:#fff}
    .chat-msg.bot .msg-bub{background:rgba(255,255,255,.05);border:1px solid var(--brd);color:var(--txt)}
    .chat-inp-row{display:flex;gap:10px;padding:14px;background:var(--srf);border-top:1px solid var(--brd)}
    .chat-inp{flex:1;padding:12px 16px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:50px;color:var(--txt);font-size:.9rem;outline:0;font-family:var(--font)}

    .spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #login-overlay{position:fixed;inset:0;background:var(--bg);z-index:10000;display:none;align-items:center;justify-content:center}
    .login-box{background:var(--srf);padding:40px 30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);width:90%;max-width:380px;border:1px solid var(--brd);text-align:center}
    .login-inp{width:100%;padding:14px;margin-bottom:16px;border-radius:8px;border:1px solid var(--brd);background:rgba(0,0,0,.2);color:var(--txt);font-size:1rem;outline:0;font-family:var(--font)}
    .logo-text{font-family:'Fredoka One',cursive;font-size:1.8rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99999;display:none;justify-content:center;align-items:center}
    .modal.show{display:flex}.modal img{max-width:92%;max-height:92%;border-radius:8px}
    .modal-close{position:absolute;top:18px;right:24px;color:#fff;font-size:2rem;cursor:pointer}
    .back-btn-row{padding:10px 15px}
    .syl-iframe{width:100%;min-height:600px;border:none;border-radius:8px;background:transparent;display:block}

    @media(max-width:768px){
      .results-score{font-size:3rem}.gt-topic-grid{grid-template-columns:1fr}
      .gt-subject-header{flex-direction:column;align-items:flex-start}
      .sub-row{gap:6px;padding:10px}.btn-sub{padding:8px 14px;font-size:.8rem}
      .chat-box{width:95%;right:2.5%}
      .ch-row,.ch-sub-row{flex-direction:column;align-items:flex-start;gap:6px}
    }
  </style>
</head>
<body class="protected-mode" oncontextmenu="return false;">

  <div id="login-overlay">
    <div class="login-box">
      <div class="logo-text">🎯 APPSC Mastery</div>
      <h2 style="margin-bottom:25px;color:var(--txt);">Student Login</h2>
      <input type="text" id="login-phone" class="login-inp" placeholder="User ID / Phone">
      <input type="password" id="login-pass" class="login-inp" placeholder="Password">
      <button class="btn btn-blue" style="width:100%;padding:14px;font-size:1.1rem;margin-top:10px;" onclick="document.getElementById('login-overlay').style.display='none'">Login</button>
      <button class="btn btn-orange" style="width:100%;padding:12px;font-size:.95rem;margin-top:10px;border-radius:8px;" onclick="document.getElementById('login-overlay').style.display='none'">👤 Study as Guest</button>
    </div>
  </div>

  <div class="main-wrap">
    <div class="top-info-bar">
      <div class="news-ticker-wrap"><span class="news-icon">📢</span><div class="ticker-container"><span id="newsTicker"></span></div></div>
      <div id="google_translate_element"></div>
      <select class="lang-select notranslate" translate="no" id="lang-select" onchange="changeLanguage(this.value)">
        <option value="en">🌐 English</option><option value="te">🔴 తెలుగు</option><option value="hi">🔴 हिन्दी</option><option value="ta">🔴 தமிழ்</option><option value="ml">🔴 മലയാളം</option><option value="kn">🔴 ಕನ್ನಡ</option>
      </select>
    </div>
    
    <div id="shell" class="shell">
      <div class="filter-row">
        <span class="filter-label">📚 Group:</span>
        <select class="filter-select" id="filterGroup" onchange="updateGroupFilter(this.value)">
          <option value="ALL">All Groups</option>
          <option value="Group 1">Group 1</option>
          <option value="Group 2">Group 2</option>
        </select>
        <span class="filter-label">📅 Stage:</span>
        <select class="filter-select" id="filterStage" onchange="updateStageFilter(this.value)">
          <option value="ALL">All Stages</option>
          <option value="Prelims">Prelims</option>
          <option value="Mains">Mains</option>
        </select>
      </div>
      <div class="sub-row" id="sub-row"></div>
      <div class="sub-cat-row" id="sub-cat-row" style="display:none;"></div>
      <div class="study-tabs-row" id="study-tabs-row"></div>
      <div class="content" id="content-area">
        <div style="padding:50px;text-align:center;"><span class="spinner"></span> Loading APPSC Study Materials & Quizzes...</div>
      </div>
    </div>
    <div id="quiz-player" class="q-player" style="display:none;"></div>
    
    <!-- AI Chat Button -->
    <button class="btn ai-btn" id="ai-toggle-btn" onclick="toggleAIChat()" title="AI Tutor">🤖</button>
    <div id="ai-shell" class="chat-box">
      <div class="chat-msgs" id="chat-msgs"><div class="chat-msg bot"><div class="msg-bub"><strong>[AI Tutor]</strong> Ask me anything about APPSC Group 1 &amp; Group 2 exams!</div></div></div>
      <div class="chat-inp-row"><input id="chat-inp" class="chat-inp" placeholder="Type your question..." onkeypress="if(event.key=='Enter')sendChat()"><button class="btn btn-blue" id="chat-send-btn" onclick="sendChat()">Send</button></div>
    </div>
  </div>

  <!-- Image Modal -->

    function mapKeyToSubject(raw) {
      var k = String(raw || '').toLowerCase().replace(/[^a-z]/g, '');
      if (k.indexOf('history') !== -1 || k.indexOf('culture') !== -1 || k.indexOf('freedom') !== -1 || k.indexOf('bifurcation') !== -1) return 'History';
      if (k.indexOf('polity') !== -1 || k.indexOf('governance') !== -1 || k.indexOf('constitution') !== -1 || k.indexOf('rights') !== -1 || k.indexOf('dpsp') !== -1 || k.indexOf('parliament') !== -1 || k.indexOf('judiciary') !== -1 || k.indexOf('ethics') !== -1) return 'India Polity';
      if (k.indexOf('econom') !== -1 || k.indexOf('agricultur') !== -1 || k.indexOf('industry') !== -1 || k.indexOf('budget') !== -1 || k.indexOf('poverty') !== -1 || k.indexOf('welfare') !== -1 || k.indexOf('planning') !== -1) return 'Economy';
      if (k.indexOf('geograph') !== -1 || k.indexOf('climate') !== -1 || k.indexOf('demograph') !== -1 || k.indexOf('urban') !== -1) return 'Geography';
      if (k.indexOf('science') !== -1 || k.indexOf('physics') !== -1 || k.indexOf('chemistry') !== -1 || k.indexOf('biology') !== -1 || k.indexOf('space') !== -1 || k.indexOf('ict') !== -1 || k.indexOf('biotech') !== -1 || k.indexOf('computer') !== -1) return 'General Science';
      if (k.indexOf('ecolog') !== -1 || k.indexOf('environment') !== -1 || k.indexOf('biodivers') !== -1 || k.indexOf('disaster') !== -1 || k.indexOf('pollution') !== -1) return 'Ecology & Environment';
      if (k.indexOf('current') !== -1 || k.indexOf('national') !== -1 || k.indexOf('international') !== -1 || k.indexOf('sport') !== -1 || k.indexOf('award') !== -1) return 'Current Affairs';
      if (k.indexOf('reason') !== -1 || k.indexOf('mental') !== -1 || k.indexOf('data') !== -1 || k.indexOf('numerical') !== -1 || k.indexOf('logical') !== -1 || k.indexOf('problem') !== -1 || k.indexOf('aptitude') !== -1) return 'Mental Ability';
      return 'History';
    }

    // ==================== 0.2-SECOND DIRECT SUPABASE LOADER ====================
    async function fastLoadAllAPPSCData() {
      var db = await window.supabaseReady;
      var [matRes, quizRes] = await Promise.all([
        db.from('study_materials').select('*').eq('course', 'appsc').limit(1000),
        db.from('quiz_sets').select('*').eq('course', 'appsc').limit(1000)
      ]);

      var matRows = (matRes && matRes.data) || [];
      var quizRows = (quizRes && quizRes.data) || [];

      var sylMap = {}, essayMap = {};
      matRows.forEach(function(r) {
        var m = r.metadata || {};
        var k = r.legacy_key || r.material_key || r.id;
        var rawSubj = r.subject || m.subject || 'History';
        var itemObj = {
          id: r.id,
          title: r.title || m.title || 'Untitled',
          group: r.group_name || m.group || 'Group 1',
          stage: r.stage || m.stage || 'Prelims',
          subject: mapKeyToSubject(rawSubj),
          rawSubject: rawSubj,
          subSubject: r.sub_subject || m.subSubject || rawSubj || 'General',
          topic: r.topic || m.topic || r.title || 'General',
          content: r.content_html || m.content || '',
          imageUrls: r.image_urls || m.imageUrls || [],
          order: r.order_index || m.order || 0
        };
        if (r.material_type === 'essay') essayMap[k] = itemObj;
        else sylMap[k] = itemObj;
      });

      var quizMap = {};
      quizRows.forEach(function(r) {
        var m = r.metadata || {};
        var k = r.quiz_key || r.legacy_key || r.id;
        var parts = k.split('_');
        var rawSubj = r.subject || m.subject || parts[0] || 'History';
        var mappedSubj = mapKeyToSubject(rawSubj);
        var mainTopic = r.sub_subject || m.subSubject || (parts.length > 2 ? parts[1] : rawSubj) || 'General';
        var subTopic = r.topic || m.topic || (parts.length > 2 ? parts.slice(2).join(' ') : parts.slice(1).join(' ')) || r.title || k;

        quizMap[k] = {
          id: r.id,
          key: k,
          count: Number(m.count) || 20,
          group: r.group_name || m.group || 'ALL',
          stage: r.stage || m.stage || 'ALL',
          subject: mappedSubj,
          subSubject: mainTopic.replace(/_/g, ' '),
          topic: subTopic.replace(/_/g, ' '),
          order: r.order_index || m.order || 0
        };
      });

      DB.syllabus = sylMap;
      DB.essay = essayMap;
      DB.quiz = quizMap;
      buildDynamicSubCategories();
    }

    function buildDynamicSubCategories() {
      SUBJECTS.forEach(function(sObj) {
        var subCatSet = {};
        Object.keys(DB.quiz).forEach(function(k) {
          var q = DB.quiz[k];
          if (q.subject === sObj.id && q.subSubject && q.subSubject !== 'General') {
            subCatSet[q.subSubject] = true;
          }
        });
        Object.keys(DB.syllabus).forEach(function(k) {
          var it = DB.syllabus[k];
          if (it.subject === sObj.id && it.subSubject && it.subSubject !== 'General') {
            subCatSet[it.subSubject] = true;
          }
        });
        sObj.subCats = Object.keys(subCatSet).sort().map(function(cName) {
          return { id: cName, name: '📂 ' + cName };
        });
        sObj.hasSubCats = sObj.subCats.length > 0;
      });
    }

    async function fetchQuizSetQuestions(quizKey) {
      if (DB.questionsCache[quizKey]) return DB.questionsCache[quizKey];
      var db = await window.supabaseReady;
      var setMeta = DB.quiz && DB.quiz[quizKey];
      var setId = setMeta && setMeta.id;
      if (!setId) {
        var sRes = await db.from('quiz_sets').select('id').eq('course', 'appsc').eq('quiz_key', quizKey).limit(1);
        if (sRes.data && sRes.data.length) setId = sRes.data[0].id;
      }
      if (setId) {
        var qRes = await db.from('quiz_questions').select('*').eq('quiz_set_id', setId).order('order_index', { ascending: true }).limit(2000);
        var rows = (qRes && qRes.data) || [];
        // Update actual count
        if (setMeta && rows.length > 0) setMeta.count = rows.length;
        var formatted = rows.map(function(r) {
          var m = r.metadata || {};
          return {
            question: r.question_html || r.question_text || m.question || '',
            options: r.options || m.options || { A: r.option_a, B: r.option_b, C: r.option_c, D: r.option_d },
            correctAnswer: r.correct_answer || m.correctAnswer || 'A',
            explanation: r.explanation_html || r.explanation || m.explanation || ''
          };
        });
        DB.questionsCache[quizKey] = formatted;
        return formatted;
      }
      return [];
    }

    window.tog = function(id){
      var el = document.getElementById(id);
      if(!el) return;
      var isShowing = el.classList.toggle('show');
      if(isShowing && SYL_CONTENT_MAP[id] !== undefined){
        var raw = SYL_CONTENT_MAP[id];
        if(!raw || !String(raw).trim()){
          el.innerHTML = '<p style="color:var(--mut);">No content inside this topic yet.</p>';
          return;
        }
        if(/<!doctype|<html|<head|<style|<script/i.test(raw)){
          var ifr = document.createElement('iframe');
          ifr.className = 'syl-iframe';
          ifr.setAttribute('sandbox','allow-scripts allow-same-origin allow-modals allow-popups allow-forms');
          var helper = '<style>html,body{margin:0;padding:12px;overflow-x:hidden;font-family:sans-serif;line-height:1.6;}</style><script>function fH(){try{var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,500);if(window.frameElement)window.frameElement.style.height=(h+40)+"px";}catch(e){}}window.addEventListener("load",function(){setTimeout(fH,100);setTimeout(fH,600);});document.addEventListener("click",function(){setTimeout(fH,150);});<\/script>';
          ifr.srcdoc = /<!doctype|<html/i.test(raw) ? (raw+helper) : ('<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">'+helper+'</head><body style="color:#e2e8f0;background:#0f172a;">'+raw+'</body></html>');
          el.innerHTML = '';
          el.appendChild(ifr);
        } else {
          el.innerHTML = raw;
        }
      }
    };

    function shuffleArray(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}

    function buildGrandTestConfigUI(ca){
      var quizData=DB.quiz, allTopics={};
      Object.keys(quizData).forEach(function(key){
        var qMeta = quizData[key];

        var ms = qMeta.subject || 'History';
        var dt = ((qMeta.subSubject && qMeta.subSubject !== 'General' ? qMeta.subSubject + ' - ' : '') + (qMeta.topic || key)).replace(/_/g,' ');
        if(!allTopics[ms]) allTopics[ms]={};
        allTopics[ms][key] = { name: dt, count: qMeta.count || 20, subject: ms };
      });
      var h='<div class="banner" style="background:linear-gradient(135deg,#f59e0b,#ef4444);"><h1>🏆 Grand Test Configuration</h1><p>Customize Your APPSC Exam Paper</p></div>';
      h+='<div style="padding:10px 15px;color:var(--mut);font-size:.85rem;">📋 <b>Steps:</b> 1️⃣ Check Subject → 2️⃣ Select Topics → 3️⃣ Enter Marks → 4️⃣ Click Start</div>';
      h+='<div class="gt-warning" id="gtWarning">⚠️ Select at least one subject, check its topics, and enter marks > 0 to enable the Start button.</div><div id="gtConfigForm">';
      SUBJECTS.forEach(function(sObj){
        var sn = sObj.id;
        if(!allTopics[sn]) return;
        var tps=allTopics[sn], tks=Object.keys(tps).sort(), stq=0;

        var si=sn.replace(/[^a-z0-9]/gi,'_');
        h+='<div class="gt-subject-section"><div class="gt-subject-header" onclick="toggleGTSection(\''+si+'\')"><div class="gt-subject-header-left"><input type="checkbox" class="gt-subj-check" data-subject="'+sn+'" onchange="gtOnSubjectToggle(\''+sn+'\')" onclick="event.stopPropagation();" style="accent-color:#f59e0b;width:18px;height:18px;"><span style="color:#fff;">'+sn+'</span><small style="color:var(--mut);">('+stq+' Qs available)</small></div><div style="display:flex;align-items:center;gap:8px;" onclick="event.stopPropagation();"><span style="font-size:.8rem;color:var(--mut);">Marks:</span><input type="number" class="gt-marks-input gt-subj-marks" data-subject="'+sn+'" value="0" min="0" max="'+stq+'" onchange="gtOnMarksChange(\''+sn+'\')" oninput="gtOnMarksInput(\''+sn+'\')" style="width:80px;" placeholder="0"><span style="font-size:.7rem;color:var(--mut);">/ '+stq+'</span></div><span style="cursor:pointer;font-size:.8rem;">▼</span></div><div style="padding:5px 0;" onclick="event.stopPropagation();"><button class="gt-select-all-btn" onclick="gtSelectAllTopics(\''+sn+'\')">✅ Select All</button> <button class="gt-select-all-btn" onclick="gtDeselectAllTopics(\''+sn+'\')">☐ Deselect All</button></div><div class="gt-topic-grid" id="gt_topics_'+si+'">';

        });
        h+='</div><div style="font-size:.75rem;color:var(--mut);margin-top:5px;" id="gt_distribution_'+si+'"></div></div>';
      });
      h+='<div class="gt-total-bar"><span>📊 Total Questions: <span id="gtTotalMarks" style="font-size:1.3rem;">0</span></span><button class="btn btn-green" onclick="startGrandTest()" id="gtStartBtn" disabled>🚀 Start Grand Test</button></div></div>';

    function gtOnTopicToggle(sn){var ta=0;document.querySelectorAll('.gt-topic-check[data-subject="'+sn+'"]:checked').forEach(function(cb){ta+=parseInt(cb.dataset.count)||0;});var me=document.querySelector('.gt-subj-marks[data-subject="'+sn+'"]');if(me){me.max=ta;var cv=parseInt(me.value)||0;if(cv>ta&&ta>0)me.value=ta;if(ta===0)me.value=0;}updateGTTotal();updateGTDistribution(sn);}

    function gtOnMarksChange(sn){var me=document.querySelector('.gt-subj-marks[data-subject="'+sn+'"]'),mv=parseInt(me.max)||0,cv=parseInt(me.value)||0;if(cv<0)me.value=0;if(mv>0&&cv>mv)me.value=mv;updateGTTotal();updateGTDistribution(sn);}
    function gtSelectAllTopics(sn){if(!document.querySelector('.gt-subj-check[data-subject="'+sn+'"]').checked){document.querySelector('.gt-subj-check[data-subject="'+sn+'"]').checked=true;}document.querySelectorAll('.gt-topic-check[data-subject="'+sn+'"]').forEach(function(cb){cb.disabled=false;cb.checked=true;});gtOnTopicToggle(sn);}
    function gtDeselectAllTopics(sn){document.querySelectorAll('.gt-topic-check[data-subject="'+sn+'"]').forEach(function(cb){cb.checked=false;});gtOnTopicToggle(sn);}
    function updateGTDistribution(sn){var me=document.querySelector('.gt-subj-marks[data-subject="'+sn+'"]'),m=parseInt(me?me.value:0)||0,st=document.querySelectorAll('.gt-topic-check[data-subject="'+sn+'"]:checked'),tc=st.length,si=sn.replace(/[^a-z0-9]/gi,'_'),de=document.getElementById('gt_distribution_'+si);if(!de)return;if(tc>0&&m>0){var pt=Math.floor(m/tc),r=m%tc,dt='📊 Equal Distribution: ~'+pt+' Qs per topic';if(r>0)dt+=' ('+r+' topic(s) get 1 extra Q)';de.innerHTML=dt;de.style.color='#22c55e';}else if(tc>0&&m===0){de.innerHTML='⚠️ Enter marks (greater than 0) to see distribution';de.style.color='#f59e0b';}else if(m>0&&tc===0){de.innerHTML='⚠️ Select at least one topic above';de.style.color='#ef4444';}else{de.innerHTML='';}}
    function updateGTTotal(){var t=0,hv=false;document.querySelectorAll('.gt-subj-check:checked').forEach(function(cb){var sn=cb.dataset.subject,me=document.querySelector('.gt-subj-marks[data-subject="'+sn+'"]'),m=parseInt(me?me.value:0)||0,st=document.querySelectorAll('.gt-topic-check[data-subject="'+sn+'"]:checked').length;if(m>0&&st>0){hv=true;t+=m;}});var te=document.getElementById('gtTotalMarks'),sb=document.getElementById('gtStartBtn'),we=document.getElementById('gtWarning');if(te)te.innerText=t;if(sb)sb.disabled=!(t>0&&hv);if(we){var ac=document.querySelectorAll('.gt-subj-check:checked').length>0;we.style.display=(ac&&!hv)?'block':'none';}}

    async function startGrandTest(){
      var btn = document.getElementById('gtStartBtn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Preparing Grand Test...'; }
      var asq = [];
      var checkedSubjs = document.querySelectorAll('.gt-subj-check:checked');
      for (var sIdx = 0; sIdx < checkedSubjs.length; sIdx++) {
        var cb = checkedSubjs[sIdx];
        var sn = cb.dataset.subject;
        var tm = parseInt(document.querySelector('.gt-subj-marks[data-subject="'+sn+'"]').value) || 0;
        if (tm === 0) continue;
        var stk = [];
        document.querySelectorAll('.gt-topic-check[data-subject="'+sn+'"]:checked').forEach(function(tcb){ stk.push(tcb.dataset.key); });
        if (stk.length === 0) continue;

        var tc = stk.length, bpt = Math.floor(tm / tc), ext = tm % tc, dist = [];
        for (var i = 0; i < tc; i++) dist.push({ key: stk[i], count: bpt + (i < ext ? 1 : 0) });
        dist = shuffleArray(dist).filter(function(d){ return d.count > 0; });

        var loadedSets = await Promise.all(dist.map(function(d){ return fetchQuizSetQuestions(d.key); }));
        dist.forEach(function(d, idx){
          var qs = loadedSets[idx] || [];
          var sf = shuffleArray(qs);
          var tp = Math.min(d.count, sf.length);
          var tName = d.key.replace(/_/g, ' ');
          for (var j = 0; j < tp; j++) {
            asq.push({ question: sf[j], source: d.key, subject: sn, topic: tName });
          }
        });
      }

      if (asq.length === 0) {
        alert('⚠️ No questions could be loaded! Please check your selection.');
        if (btn) { btn.disabled = false; btn.innerHTML = '🚀 Start Grand Test'; }
        return;
      }

      asq = shuffleArray(asq);
      qActive = asq.map(function(i){ return i.question; });
      qSourceInfo = asq.map(function(i){ return { source: i.source, subject: i.subject, topic: i.topic }; });
      qAns = new Array(qActive.length).fill(null);
      qIdx = 0; qSec = 0;
      document.getElementById('shell').style.display = 'none';
      document.getElementById('ai-shell').style.display = 'none';
      var p = document.getElementById('quiz-player');
      p.style.display = 'block';
      p.dataset.theme = 'linear-gradient(135deg,#f59e0b,#ef4444)';
      stopQT();
      qTimer = setInterval(function(){
        qSec++;
        var el = document.getElementById('qt');
        if (el) el.innerText = '⏱️ Timer: ' + String(Math.floor(qSec/60)).padStart(2,'0') + ':' + String(qSec%60).padStart(2,'0');
      }, 1000);
      renderQ();
    }

    // ==================== QUIZ ENGINE ====================
    function renderQ(){
      var q=qActive[qIdx],pa=qAns[qIdx],c=document.getElementById('quiz-player').dataset.theme||'',m=String(Math.floor(qSec/60)).padStart(2,'0'),s=String(qSec%60).padStart(2,'0'),si=qSourceInfo[qIdx];
      var corr = q.correctAnswer || 'A';
      function oc(o){if(!pa)return'';if(pa.sel===o)return pa.ok?'correct':'wrong';if(corr===o&&!pa.ok)return'reveal';return'';}
      var fb='';
      if(pa){
        fb='<div class="feedback show '+(pa.ok?'correct':'wrong')+'">'+(pa.ok?'✅ <b>Correct!</b>':'❌ <b>Incorrect!</b>')+'<br>✅ Correct Answer: <b>'+corr+') '+(q.options?q.options[corr]||'':'')+'</b>';
        if(q.explanation)fb+='<br><small>💡 '+(q.explanation||'')+'</small>';
        fb+='</div>';
      }
      var html='<div class="q-panel"><div style="display:flex;justify-content:space-between;margin-bottom:15px;flex-wrap:wrap;gap:8px;"><span class="btn" style="background:'+c+'">🏆 Q '+(qIdx+1)+'/'+qActive.length+'</span><span class="btn btn-dark" id="qt">⏱️ Timer: '+m+':'+s+'</span></div>';
      if(si)html+='<div style="font-size:.78rem;color:var(--mut);margin-bottom:8px;">📘 <b>'+si.subject+'</b> | 📝 '+si.topic+'</div>';
      html+='<div style="font-size:1.2rem;font-weight:800;margin-bottom:20px;line-height:1.5;">'+(q.question||'No Question')+'</div>';
      if(q.options){
        ['A','B','C','D'].forEach(function(o){
          if(q.options[o]){
            html+='<button class="opt-btn '+oc(o)+'" onclick="answerQ(\''+o+'\')" '+(pa?'disabled':'')+'><b>'+o+')</b> <span style="flex:1;">'+q.options[o]+'</span></button>';
          }
        });
      }
      html+=fb+'<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:15px;"><button class="btn btn-dark" onclick="prevQ()" '+(qIdx===0?'disabled':'')+'>◀ Prev</button><button class="btn btn-green" onclick="nextQ()" '+(!pa?'disabled':'')+'>'+(qIdx===qActive.length-1?'🏁 Finish':'Next ▶')+'</button><button class="btn btn-red" onclick="confirmCloseQ()">✕ Exit</button></div></div>';
      document.getElementById('quiz-player').innerHTML=html;
    }

    function answerQ(s){var corr=qActive[qIdx].correctAnswer||'A';qAns[qIdx]={sel:s,ok:s===corr};renderQ();}
    function prevQ(){if(qIdx>0){qIdx--;renderQ();}}
    function nextQ(){if(qIdx<qActive.length-1){qIdx++;renderQ();}else{finishGrandTest();}}
    function stopQT(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
    function confirmCloseQ(){if(confirm('⚠️ Exit Quiz? Your progress will be lost.'))closeQ();}
    function closeQ(){stopQT();document.getElementById('quiz-player').style.display='none';document.getElementById('shell').style.display='block';refreshUI();}

    // ==================== FULL RESULTS ANALYTICS SCREEN ====================
    function finishGrandTest(){
      stopQT();
      var total=qActive.length,ok=0,wrong=0,skipped=0;
      var subjectAnalysis={},topicAnalysis={};
      for(var i=0;i<qAns.length;i++){
        var si=qSourceInfo[i],subj=si?si.subject:sub,topic=si?si.topic:'Practice Quiz';
        if(!subjectAnalysis[subj])subjectAnalysis[subj]={total:0,correct:0,wrong:0,skipped:0,marks:0,correctMarks:0};
        if(!topicAnalysis[topic])topicAnalysis[topic]={total:0,correct:0,wrong:0,skipped:0,subject:subj};
        subjectAnalysis[subj].total++;subjectAnalysis[subj].marks++;topicAnalysis[topic].total++;
        if(!qAns[i]){skipped++;subjectAnalysis[subj].skipped++;topicAnalysis[topic].skipped++;}
        else if(qAns[i].ok){ok++;subjectAnalysis[subj].correct++;subjectAnalysis[subj].correctMarks++;topicAnalysis[topic].correct++;}
        else{wrong++;subjectAnalysis[subj].wrong++;topicAnalysis[topic].wrong++;}
      }
      var percent=total>0?Math.round((ok/total)*100):0;
      var grade,gradeColor;
      if(percent>=90){grade='🏆 Excellent!';gradeColor='#22c55e';}
      else if(percent>=75){grade='🌟 Very Good!';gradeColor='#3b82f6';}
      else if(percent>=60){grade='👍 Good';gradeColor='#f59e0b';}
      else if(percent>=40){grade='📚 Need Practice';gradeColor='#f97316';}
      else{grade='💪 Keep Trying!';gradeColor='#ef4444';}
      var timeStr=String(Math.floor(qSec/60)).padStart(2,'0')+':'+String(qSec%60).padStart(2,'0');
      var c='linear-gradient(135deg,#f59e0b,#ef4444)';
      var html='<div class="results-container"><div class="results-header"><div class="results-score" style="background:'+c+';-webkit-background-clip:text;-webkit-text-fill-color:transparent;">'+percent+'%</div><p style="font-size:1.5rem;font-weight:900;color:'+gradeColor+';margin:10px 0;">'+grade+'</p><div class="results-summary"><div class="results-summary-item"><div class="val" style="color:#22c55e;">'+ok+'</div><div class="lbl">✅ Correct</div></div><div class="results-summary-item"><div class="val" style="color:#ef4444;">'+wrong+'</div><div class="lbl">❌ Wrong</div></div><div class="results-summary-item"><div class="val" style="color:#94a3b8;">'+skipped+'</div><div class="lbl">⚠️ Skipped</div></div><div class="results-summary-item"><div class="val" style="color:#60a5fa;">'+total+'</div><div class="lbl">📝 Total</div></div><div class="results-summary-item"><div class="val" style="color:#f59e0b;">'+timeStr+'</div><div class="lbl">⏱️ Time</div></div></div></div>';
      
      html+='<h3 style="margin:20px 0 10px;color:#f59e0b;">📊 Subject-wise Performance Analysis</h3>';
      Object.keys(subjectAnalysis).sort().forEach(function(sn){
        var sa=subjectAnalysis[sn],sp=sa.total>0?Math.round((sa.correct/sa.total)*100):0,bc=sp>=70?'#22c55e':(sp>=40?'#f59e0b':'#ef4444');
        html+='<div class="analysis-card"><h4>📘 '+sn+' <span style="float:right;font-size:.9rem;">'+sa.correct+'/'+sa.total+' ('+sp+'%)</span></h4><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+sp+'%;background:'+bc+';"></div></div><small style="color:var(--mut);">✅ '+sa.correct+' Correct | ❌ '+sa.wrong+' Wrong | ⚠️ '+sa.skipped+' Skipped | 📝 '+sa.marks+' Marks</small>'+(sp<50?'<br><small style="color:#f97316;">⚠️ Focus Area: Spend more time on '+sn+'</small>':'')+(sp>=80?'<br><small style="color:#22c55e;">✅ Strength Area: Good command on '+sn+'</small>':'')+'</div>';
      });

      html+='<h3 style="margin:20px 0 10px;color:#f59e0b;">📝 Topic-wise Detailed Analysis</h3>';
      var tks=Object.keys(topicAnalysis).sort(function(a,b){
        var pa=topicAnalysis[a].total>0?topicAnalysis[a].correct/topicAnalysis[a].total:0;
        var pb=topicAnalysis[b].total>0?topicAnalysis[b].correct/topicAnalysis[b].total:0;
        return pa-pb;
      });
      var wt=[],st=[];
      tks.forEach(function(tn){
        var ta=topicAnalysis[tn],tp=ta.total>0?Math.round((ta.correct/ta.total)*100):0,bc=tp>=70?'#22c55e':(tp>=40?'#f59e0b':'#ef4444');
        html+='<div class="analysis-card"><h4>📝 '+tn+' <small style="color:var(--mut);">('+ta.subject+')</small> <span style="float:right;font-size:.9rem;">'+ta.correct+'/'+ta.total+' ('+tp+'%)</span></h4><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+tp+'%;background:'+bc+';"></div></div><small style="color:var(--mut);">✅ '+ta.correct+' | ❌ '+ta.wrong+' | ⚠️ '+ta.skipped+'</small>';
        if(tp<40)wt.push({name:tn,subject:ta.subject,percent:tp});
        if(tp>=80)st.push({name:tn,subject:ta.subject,percent:tp});
        html+='</div>';
      });
      if(wt.length>0){
        html+='<div class="analysis-card" style="border-color:#ef4444;background:rgba(239,68,68,.05);"><h4 style="color:#ef4444;">⚠️ Topics Needing Immediate Attention:</h4><ul style="padding-left:20px;line-height:1.8;">';
        wt.forEach(function(t){html+='<li><b>'+t.name+'</b> ('+t.subject+') - Score: '+t.percent+'%</li>';});
        html+='</ul></div>';
      }
      if(st.length>0){
        html+='<div class="analysis-card" style="border-color:#22c55e;background:rgba(34,197,94,.05);"><h4 style="color:#22c55e;">✅ Strong Areas - Keep It Up:</h4><ul style="padding-left:20px;line-height:1.8;">';
        st.forEach(function(t){html+='<li><b>'+t.name+'</b> ('+t.subject+') - Score: '+t.percent+'%</li>';});
        html+='</ul></div>';
      }

      html+='<h3 style="margin:20px 0 10px;color:#f59e0b;">📋 Detailed Question Review</h3>';
      for(var j=0;j<qActive.length;j++){
        var qq=qActive[j],ans=qAns[j],si=qSourceInfo[j],isC=ans&&ans.ok,isW=ans&&!ans.ok;
        var corr=qq.correctAnswer||'A';
        var qnoClass=isC?'correct-q':(isW?'wrong-q':'skipped-q');
        var statusClass=isC?'correct':(isW?'wrong':'skipped');
        var statusText=isC?'✓ Correct':(isW?'✗ Wrong':'⚠ Skipped');
        html+='<div class="result-item"><span class="result-qno '+qnoClass+'">'+(j+1)+'</span><span class="result-status '+statusClass+'">'+statusText+'</span>';

        html+='<div class="result-question">'+qq.question+'</div><div class="result-option correct-answer">✅ <b>Correct Answer:</b> '+corr+') '+(qq.options?qq.options[corr]||'':'')+'</div>';
        if(isW)html+='<div class="result-option user-wrong">❌ <b>Your Answer:</b> '+ans.sel+') '+(qq.options?qq.options[ans.sel]||'':'')+'</div>';
        if(isC)html+='<div class="result-option user-correct">✅ <b>Your Answer:</b> '+ans.sel+') '+(qq.options?qq.options[ans.sel]||'':'')+'</div>';

        html+='</div>';
      }
      html+='<div style="text-align:center;margin-top:30px;padding:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;"><button class="btn btn-blue" onclick="closeQ()">📚 Back to Topics</button><button class="btn btn-green" onclick="retakeQuiz()">🔄 Retake Test</button></div></div>';
      document.getElementById('quiz-player').innerHTML=html;
      document.getElementById('quiz-player').scrollIntoView({behavior:'smooth'});
    }

    // ==================== REGULAR QUIZ LAUNCHER ====================
    async function launchQ(k,s,e,c){
      document.getElementById('shell').style.display='none';
      document.getElementById('ai-shell').style.display='none';
      var p=document.getElementById('quiz-player');
      p.style.display='block';
      p.dataset.theme=c;
      p.innerHTML='<div style="padding:50px;text-align:center;"><span class="spinner"></span> Loading Questions...</div>';

      var data = await fetchQuizSetQuestions(k);
      if(!data||!Array.isArray(data)||!data.length){alert('Quiz questions not found for: '+k);closeQ();return;}
      var fullTopicName = k.replace(/_/g, ' ');
      qActive=data.slice(s,e);
      qIdx=0;
      qAns=new Array(qActive.length).fill(null);
      qSourceInfo=qActive.map(function(){return{source:k,subject:sub,topic:fullTopicName};});
      qSec=0;
      stopQT();
      qTimer=setInterval(function(){qSec++;var el=document.getElementById('qt');if(el)el.innerText='⏱️ Timer: '+String(Math.floor(qSec/60)).padStart(2,'0')+':'+String(qSec%60).padStart(2,'0');},1000);
      renderQ();
    }

    function retakeQuiz(){
      qIdx=0;
      qAns=new Array(qActive.length).fill(null);
      qSec=0;
      stopQT();
      qTimer=setInterval(function(){qSec++;var el=document.getElementById('qt');if(el)el.innerText='⏱️ Timer: '+String(Math.floor(qSec/60)).padStart(2,'0')+':'+String(qSec%60).padStart(2,'0');},1000);
      renderQ();
    }

    // ==================== MAIN UI RENDERER (QUIZ FIRST -> SYLLABUS -> ESSAY -> GRAND TEST) ====================
    function refreshUI(){
      if(studyType==='grandtest'){openGrandTestConfig();return;}
      var sr=document.getElementById('sub-row'),scr=document.getElementById('sub-cat-row'),str=document.getElementById('study-tabs-row'),ca=document.getElementById('content-area');

      sr.innerHTML=SUBJECTS.map(function(s){return'<button class="btn-sub '+(sub===s.id?'active':'')+'" style="background:'+s.grad+';" onclick="selectSubject(\''+s.id+'\')">'+(sub===s.id?'✔ ':'')+s.name+'</button>';}).join('');
      
      if(so&&so.hasSubCats){

      var bt=so.name;

      }
      var filterInfo='';

        filterInfo=' <small style="font-size:.78rem;">('+(currentGroup!=='ALL'?currentGroup:'All Groups')+' | '+(currentStage!=='ALL'?currentStage:'All Stages')+')</small>';
      }
      var h='<div class="banner" style="background:'+so.grad+';"><h1>'+bt+'</h1><p>'+(studyType==='syllabus'?'📖 Study Material':(studyType==='essay'?'✍️ Essay Writing':'📝 Practice Tests (Click any Topic below to open)'))+filterInfo+'</p></div>';
      if(so.hasSubCats&&subCategory!=='ALL')h+='<div class="back-btn-row"><button class="btn btn-dark btn-sm" onclick="selectSubCategory(\'ALL\')">← Back to All Topics</button></div>';

      if(studyType==='syllabus')renderSyllabus(so,ca,h);
      else if(studyType==='essay')renderEssay(so,ca,h);
      else renderQuizTopics(so,ca,h);
    }

    function renderSyllabus(so,ca,h){
      SYL_CONTENT_MAP = {};
      var items = getArr(DB.syllabus).filter(function(item){
        if(item.subject !== sub) return false;
        if(currentGroup !== 'ALL' && item.group && item.group !== 'ALL' && item.group !== currentGroup) return false;
        if(currentStage !== 'ALL' && item.stage && item.stage !== 'ALL' && item.stage !== currentStage) return false;
        if(subCategory !== 'ALL' && item.subSubject !== subCategory) return false;
        return true;
      });
      if(items.length){
        items.forEach(function(t,i){
          var sid='it_'+i;
          var rowGrad = (i % 2 === 0) ? so.lightGrad : so.darkGrad;
          SYL_CONTENT_MAP[sid] = (t.content||'No content yet') + getImgs(t.imageUrls);
          h+='<div class="ch-row" style="background:'+rowGrad+';" onclick="tog(\''+sid+'\')"><span>📖 '+(t.title||'Topic')+'</span><span class="badge-pill">View Content <b>[+]</b></span></div><div id="'+sid+'" class="ch-content"></div>';
        });
      } else {
        h+='<div style="padding:40px;text-align:center;color:var(--mut);">⏳ No syllabus content found for this filter. Switch to <b>📝 Quiz</b> tab to practice questions!</div>';
      }
      ca.innerHTML=h;
    }

    function renderEssay(so,ca,h){
      SYL_CONTENT_MAP = {};
      var items = getArr(DB.essay).filter(function(item){
        if(currentGroup !== 'ALL' && item.group && item.group !== 'ALL' && item.group !== currentGroup) return false;
        if(currentStage !== 'ALL' && item.stage && item.stage !== 'ALL' && item.stage !== currentStage) return false;
        return item.subject === sub;
      });
      if(items.length === 0) items = getArr(DB.essay);
      if(items.length){
        items.forEach(function(t,i){
          var sid='es_'+i;
          var rowGrad = (i % 2 === 0) ? so.lightGrad : so.darkGrad;
          SYL_CONTENT_MAP[sid] = (t.content||'No essay content yet');
          h+='<div class="ch-row" style="background:'+rowGrad+';" onclick="tog(\''+sid+'\')"><span>✍️ '+(t.title||'Essay Topic')+'</span><span class="badge-pill">Read Essay <b>[+]</b></span></div><div id="'+sid+'" class="ch-content"></div>';
        });
      } else {
        h+='<div style="padding:40px;text-align:center;color:var(--mut);">⏳ No essays found yet.</div>';
      }
      ca.innerHTML=h;
    }

    // ==================== COLLAPSIBLE QUIZ TOPICS WITH ALTERNATING LIGHT & DARK SHADES ====================
    function renderQuizTopics(so,ca,h){
      var topicGroups = {};
      Object.keys(DB.quiz).forEach(function(key){
        var qMeta = DB.quiz[key];
        if(!qMeta || qMeta.subject !== sub) return;
        if(currentGroup !== 'ALL' && qMeta.group && qMeta.group !== 'ALL' && qMeta.group !== currentGroup) return;
        if(currentStage !== 'ALL' && qMeta.stage && qMeta.stage !== 'ALL' && qMeta.stage !== currentStage) return;
        if(subCategory !== 'ALL' && qMeta.subSubject !== subCategory) return;

        var mainTopic = (qMeta.subSubject && qMeta.subSubject !== 'General') ? qMeta.subSubject : (qMeta.topic || 'General');
        var subTopicName = qMeta.topic || key.replace(/_/g, ' ');

        if(!topicGroups[mainTopic]) topicGroups[mainTopic] = {};
        if(!topicGroups[mainTopic][subTopicName]) topicGroups[mainTopic][subTopicName] = [];
        topicGroups[mainTopic][subTopicName].push({ key: key, count: qMeta.count || 20 });
      });

      var mainTopicNames = Object.keys(topicGroups).sort();
      if(mainTopicNames.length){
        mainTopicNames.forEach(function(mTopic, tIdx){
          var tid = 'qt_main_' + tIdx;
          // Alternate between Light Shade and Dark Shade of the Subject's color!
          var mainGrad = (tIdx % 2 === 0) ? so.lightGrad : so.darkGrad;
          var subTopicsObj = topicGroups[mTopic];
          var subTopicNames = Object.keys(subTopicsObj).sort();
          var totalTopicQs = 0;
          subTopicNames.forEach(function(stName){
            subTopicsObj[stName].forEach(function(g){ totalTopicQs += g.count; });
          });

          // Collapsible Main Topic Dropdown Bar
          h += '<div class="ch-row" style="background:' + mainGrad + ';" onclick="tog(\'' + tid + '\')">';
          h += '<span>📂 ' + mTopic + '</span>';
          h += '<span class="badge-pill"><b>' + subTopicNames.length + '</b> Sub-Topics | 📝 <b>' + totalTopicQs + '</b> Qs ▼</span>';
          h += '</div>';

          h += '<div id="' + tid + '" class="ch-content">';

          subTopicNames.forEach(function(stName, sIdx){
            var stid = tid + '_sub_' + sIdx;
            var subGrad = (sIdx % 2 === 0) ? so.subLightGrad : so.subDarkGrad;
            var setsList = subTopicsObj[stName];
            var subTotalQs = 0;
            setsList.forEach(function(g){ subTotalQs += g.count; });

            h += '<div class="ch-sub-row" style="background:' + subGrad + ';" onclick="tog(\'' + stid + '\')">';
            h += '<span>📌 ' + stName + '</span>';
            h += '<span class="badge-pill">📝 <b>' + subTotalQs + '</b> Qs [+]</span>';
            h += '</div>';

            h += '<div id="' + stid + '" class="ch-sub-content"><div class="grid">';
            setsList.forEach(function(gi){
              var totalQs = gi.count || 20;
              var tc = Math.max(1, Math.ceil(totalQs / 10));
              var safeKey = gi.key.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
              for(var t = 1; t <= tc; t++){
                var st = (t - 1) * 10, end = Math.min(st + 10, totalQs);
                var cardGrad = (t % 2 === 1) ? so.lightGrad : so.darkGrad;
                h += '<div class="q-card" style="background:' + cardGrad + ';" onclick="launchQ(\'' + safeKey + '\',' + st + ',' + end + ',\'' + so.grad.replace(/'/g,"\\'") + '\')"><h4>Test ' + t + '</h4><small>' + (end - st) + ' Questions</small></div>';
              }
            });
            h += '</div></div>';
          });

          h += '</div>';
        });
      } else {
        h += '<div style="padding:40px;text-align:center;color:var(--mut);">⏳ No quizzes found for this filter.</div>';
      }
      ca.innerHTML = h;
    }

    // ==================== INITIALIZE INSTANTLY ====================
    async function initApp(){
      await fastLoadAllAPPSCData();
      refreshUI();
    }
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
  <script src="/footer.js"></script>
  <script src="/global-navbar.js"></script>
</body>
</html>
