<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💡 The Idea Lab | Clever Students</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--srf:#0f1420;--srf2:#1a2030;--brd:rgba(255,255,255,.08);--txt:#e2e8f0;--mut:#94a3b8;--font:'Nunito',sans-serif}
body.light-mode{--bg:#f8fafc;--srf:#fff;--srf2:#f1f5f9;--txt:#0f172a;--brd:rgba(0,0,0,.1);--mut:#64748b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;transition:.3s;top:0px !important}

.top-bar{background:var(--srf);border-bottom:1px solid var(--brd);padding:0 15px;position:sticky;top:0;z-index:999}
.top-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:15px;flex-wrap:wrap}
.logo{font-family:'Fredoka One',cursive;font-size:1.5rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.user-info{font-weight:700;font-size:.85rem;color:#4ade80}
.theme-btn{background:var(--bg);color:var(--txt);border:1px solid var(--brd);font-weight:700;font-size:.85rem;cursor:pointer;padding:6px 12px;border-radius:50px;font-family:var(--font)}

/* Custom Language Selector (Red Glow Pill) */
.lang-select{background:#0f172a;color:#fff;border:1.5px solid #ef4444;box-shadow:0 0 10px rgba(239,68,68,.45);padding:6px 14px;border-radius:50px;font-family:var(--font);font-weight:800;font-size:.85rem;cursor:pointer;outline:none;transition:.2s}
.lang-select:hover,.lang-select:focus{border-color:#f87171;box-shadow:0 0 14px rgba(239,68,68,.75)}
.lang-select option{background:#0f172a;color:#fff;font-weight:700;padding:8px}

/* Hide Google Translate Top Bar & Tooltips */
.goog-te-banner-frame.skiptranslate, .goog-te-gadget-icon, #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
.goog-text-highlight { background: none !important; box-shadow: none !important; }
iframe.skiptranslate { display: none !important; }

.main-wrap{max-width:1400px;margin:20px auto;padding:0 15px 60px}
.shell{background:var(--srf);border-radius:8px;overflow:hidden;border:1px solid var(--brd)}

.banner{padding:24px 20px;text-align:center;background:linear-gradient(135deg,#f59e0b,#db2777);border-bottom:3px solid #fbbf24}
.banner h1{font-size:1.6rem;font-weight:900;color:#fff;letter-spacing:1px;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.banner p{font-size:.9rem;color:rgba(255,255,255,.9);font-weight:600}

.cat-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:16px 12px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--brd)}
.cat-btn{padding:10px 22px;border:2px solid transparent;border-radius:6px;color:#fff;font-weight:800;font-size:.92rem;cursor:pointer;opacity:.65;transform:scale(.95);white-space:nowrap;font-family:var(--font);transition:.2s;background:linear-gradient(135deg,#f59e0b,#d97706)}
.cat-btn:hover{opacity:.9}
.cat-btn.active{opacity:1;transform:scale(1.05);border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.35)}

.pink-banner{padding:16px 20px;text-align:center;background:linear-gradient(135deg,#db2777,#be185d);border-bottom:2px solid rgba(255,255,255,.15)}
.pink-banner h2{font-size:1.4rem;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}

.content{padding:20px;background:var(--srf);min-height:200px}

/* Topic item */
.topic-item{margin-bottom:12px}
.topic-item > summary{list-style:none;cursor:pointer;display:block;padding:0}
.topic-item > summary::-webkit-details-marker{display:none}
.topic-item > summary::marker{display:none}

.topic-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-radius:8px;color:#fff;font-weight:800;gap:12px;flex-wrap:wrap;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:.15s}
.topic-head:hover{filter:brightness(1.12);transform:translateY(-1px)}
.topic-head .th-title{flex:1;min-width:200px}
.topic-head .view-btn{background:rgba(0,0,0,.35);padding:5px 14px;border-radius:20px;font-size:.8rem;font-weight:800;white-space:nowrap;transition:.2s}
.topic-item[open] > summary .view-btn{background:rgba(255,255,255,.4)}

/* Sub-topic item */
.subtopic-container{padding:12px 0 6px 20px;display:flex;flex-direction:column;gap:8px}
.subtopic-item{margin-bottom:0}
.subtopic-item > summary{list-style:none;cursor:pointer;display:block;padding:0}
.subtopic-item > summary::-webkit-details-marker{display:none}
.subtopic-item > summary::marker{display:none}

.subtopic-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-radius:8px;color:#fff;font-weight:700;gap:10px;flex-wrap:wrap;font-size:.88rem;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.15s}
.subtopic-head:hover{filter:brightness(1.12)}
.subtopic-head .sh-left{display:flex;align-items:center;gap:10px;flex:1;min-width:160px}
.subtopic-head .sh-title{font-size:.9rem}
.subtopic-head .sh-meta{font-size:.7rem;opacity:.85;font-weight:600}
.subtopic-head .view-btn{background:rgba(0,0,0,.35);padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:800;transition:.2s}

/* Content Body */
.subtopic-body{background:rgba(0,0,0,.35);border:1px solid var(--brd);border-radius:0 0 8px 8px;padding:16px;margin-top:-4px;line-height:1.8;color:#f8fafc;animation:fadeIn .3s ease;overflow-x:auto}
body.light-mode .subtopic-body{background:#fff;color:#0f172a}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.idea-iframe{width:100%;min-height:650px;border:none;border-radius:8px;background:transparent;display:block}

.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .icon{font-size:3rem;margin-bottom:12px;opacity:.5}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#f59e0b;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .banner h1{font-size:1.2rem}
  .cat-row{gap:6px;padding:12px}
  .cat-btn{padding:8px 14px;font-size:.78rem}
  .pink-banner h2{font-size:1.05rem}
  .topic-head{padding:12px 14px;font-size:.88rem}
  .subtopic-container{padding-left:10px}
  .subtopic-body{padding:10px}
}
</style>
</head>
<body>
<script src="/supabase-client.js"></script>

<div class="top-bar">
  <div class="top-inner">
    <div class="logo notranslate" translate="no">💡 THE IDEA LAB</div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      <span class="user-info" id="user-info">👤 Guest Student</span>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light Mode</button>

      <!-- Fixed Language Selector (Headings never change due to notranslate) -->
      <select id="customLangSelect" class="lang-select notranslate" translate="no" onchange="changeSiteLanguage(this.value)">
        <option value="en">🌐 English</option>
        <option value="te">🔴 తెలుగు</option>
        <option value="hi">🔴 हिन्दी</option>
        <option value="ta">🔴 தமிழ்</option>
        <option value="ml">🔴 മലയാളം</option>
        <option value="kn">🔴 ಕನ್ನಡ</option>
      </select>
      <div id="google_translate_element" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="main-wrap">
  <div class="shell">
    <div class="banner">
      <h1>💡 THE IDEA LAB</h1>
      <p>Smart Shortcuts · Unconventional Thinking · Mental Models</p>
    </div>

    <div class="cat-row" id="catRow"></div>

    <div class="pink-banner" id="pinkBanner">
      <h2 id="bannerTitle">📂 Select a Category</h2>
    </div>

    <div class="content">
      <div id="treeArea">
        <div class="empty"><span class="spinner"></span> Loading Idea Lab Content...</div>
      </div>
    </div>
  </div>
</div>

<script>
const DB_NODE = 'ideaLabDatabase';
let DATA = {};
let activeCat = null;
let subCounter = 0;
let SUB_CONTENT_MAP = {};

/* =========================================================
   LANGUAGE SWITCHER LOGIC (Changes inner content only!)
========================================================= */
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,te,hi,ta,ml,kn',
    autoDisplay: false
  }, 'google_translate_element');
}

function changeSiteLanguage(lang) {
  localStorage.setItem('cs_pref_lang', lang);
  // Set googtrans cookie for both main domain and current path
  document.cookie = "googtrans=/en/" + lang + "; path=/";
  document.cookie = "googtrans=/en/" + lang + "; path=/; domain=" + location.hostname;

  var gtCombo = document.querySelector('.goog-te-combo');
  if (gtCombo) {
    gtCombo.value = lang;
    gtCombo.dispatchEvent(new Event('change'));
  } else {
    location.reload();
  }

  // Also translate any open iframe content
  document.querySelectorAll('.idea-iframe').forEach(function(ifr) {
    try {
      if (ifr.contentWindow && ifr.contentWindow.triggerIframeLang) {
        ifr.contentWindow.triggerIframeLang(lang);
      }
    } catch (e) {}
  });
}

async function fetchIdeaLabData() {
  try {
    try {
      await window.supabaseAuth.ready;
      const profile = await window.supabaseAuth.profile();
      if (profile && profile.login_id) {
        document.getElementById('user-info').textContent = '👤 ' + (profile.display_name || profile.login_id);
      }
    } catch (authErr) {}

    const snapshot = await window.supabaseDb.ref(DB_NODE).once('value');
    let fetchedData = (snapshot && snapshot.val()) ? snapshot.val() : {};
    DATA = fetchedData;

    let ids = Object.keys(DATA).sort(function(a, b) {
      return (Number(DATA[a].order) || 0) - (Number(DATA[b].order) || 0);
    });

    if (!activeCat || !DATA[activeCat]) activeCat = ids[0] || null;
    render();
  } catch (err) {
    document.getElementById('treeArea').innerHTML =
      '<div class="empty"><div class="icon">⚠️</div><p>Error loading content: ' + escHtml(err.message) + '</p></div>';
  }
}

function render() {
  SUB_CONTENT_MAP = {};
  subCounter = 0;
  renderCategoryButtons();
  renderBanner();
  renderTree();
}

function renderCategoryButtons() {
  var row = document.getElementById('catRow');
  var ids = Object.keys(DATA).sort(function(a, b) { return (Number(DATA[a].order) || 0) - (Number(DATA[b].order) || 0); });
  if (!ids.length) {
    row.innerHTML = '<span style="color:var(--mut);font-size:.85rem;padding:10px;">No categories yet.</span>';
    return;
  }
  var h = '';
  ids.forEach(function(id) {
    var c = DATA[id];
    var isActive = (id === activeCat);
    h += '<button class="cat-btn' + (isActive ? ' active' : '') + '" onclick="setCat(\'' + escAttr(id) + '\')">';
    h += (isActive ? '✓ ' : '') + (c.icon || '📂') + ' ' + escHtml(c.title || id);
    h += '</button>';
  });
  row.innerHTML = h;
}

function renderBanner() {
  var c = DATA[activeCat];
  if (!c) { document.getElementById('bannerTitle').innerText = '📂 Select a Category'; return; }
  document.getElementById('bannerTitle').innerText = (c.icon || '📂') + ' ' + (c.title || activeCat);
}

function renderTree() {
  var area = document.getElementById('treeArea');
  var c = DATA[activeCat];
  if (!c) {
    area.innerHTML = '<div class="empty"><div class="icon">📭</div><p>No content yet. Please check back later.</p></div>';
    return;
  }

  var topicIds = c.topics ? Object.keys(c.topics).sort(function(a, b) {
    return (Number(c.topics[a].order) || 0) - (Number(c.topics[b].order) || 0);
  }) : [];

  if (!topicIds.length) {
    area.innerHTML = '<div class="empty"><div class="icon">📭</div><p>No topics in this category yet.</p></div>';
    return;
  }

  var palette = [
    'linear-gradient(135deg,#db2777,#be185d)',
    'linear-gradient(135deg,#8b5cf6,#6d28d9)',
    'linear-gradient(135deg,#3b82f6,#1d4ed8)',
    'linear-gradient(135deg,#10b981,#047857)',
    'linear-gradient(135deg,#f59e0b,#d97706)',
    'linear-gradient(135deg,#ec4899,#be185d)',
    'linear-gradient(135deg,#06b6d4,#0891b2)',
    'linear-gradient(135deg,#84cc16,#4d7c0f)'
  ];

  var h = '';
  topicIds.forEach(function(tid, i) {
    h += renderTopicDetails(c.topics[tid], palette[i % palette.length], i === 0);
  });
  area.innerHTML = h;
}

function renderTopicDetails(topic, grad, openFirst) {
  var subIds = topic.subtopics ? Object.keys(topic.subtopics).sort(function(a, b) {
    return (Number(topic.subtopics[a].order) || 0) - (Number(topic.subtopics[b].order) || 0);
  }) : [];

  var h = '<details class="topic-item" ' + (openFirst ? 'open' : '') + '>';
  h += '<summary>';
  h += '<div class="topic-head" style="background:' + grad + '">';
  h += '<span class="th-title">📄 ' + escHtml(topic.title || 'Untitled') + '</span>';
  h += '<span class="view-btn">View <span class="arr">[+]</span></span>';
  h += '</div></summary>';

  h += '<div class="subtopic-container">';
  if (!subIds.length) {
    h += '<div class="empty" style="padding:14px;font-size:.82rem;">No sub-topics in this topic yet.</div>';
  } else {
    subIds.forEach(function(sid) {
      h += renderSubTopicDetails(topic.subtopics[sid], grad);
    });
  }
  h += '</div></details>';
  return h;
}

function renderSubTopicDetails(sub, parentGrad) {
  subCounter++;
  var domId = 'sub_box_' + subCounter;
  var rawContent = sub.content || sub.content_html || (sub.metadata && sub.metadata.content) || '';
  SUB_CONTENT_MAP[domId] = rawContent;

  var h = '<details class="subtopic-item" ontoggle="handleSubToggle(this, \'' + domId + '\')">';
  h += '<summary>';
  h += '<div class="subtopic-head" style="background:' + parentGrad + ';opacity:.92">';
  h += '<div class="sh-left">';
  h += '<span>📄</span>';
  h += '<div>';
  h += '<div class="sh-title">' + escHtml(sub.title || 'Untitled Sub-Topic') + '</div>';
  h += '<div class="sh-meta">⏱ ' + escHtml(sub.readTime || sub.read_time || '5 min read') + '</div>';
  h += '</div></div>';
  h += '<span class="view-btn">View <span class="arr">[+]</span></span>';
  h += '</div></summary>';
  h += '<div class="subtopic-body" id="' + domId + '"></div>';
  h += '</details>';
  return h;
}

function handleSubToggle(detailsEl, domId) {
  var box = document.getElementById(domId);
  if (!box) return;
  if (!detailsEl.open) {
    box.innerHTML = '';
    return;
  }
  var raw = SUB_CONTENT_MAP[domId] || '';
  if (!raw.trim()) {
    box.innerHTML = '<p style="color:var(--mut);">No content available in this sub-topic yet.</p>';
    return;
  }

  var needsIframe = /<!doctype|<html|<head|<style|<script/i.test(raw);
  if (needsIframe) {
    var iframe = document.createElement('iframe');
    iframe.className = 'idea-iframe';
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-modals allow-popups allow-forms');
    var curLang = document.getElementById('customLangSelect').value || 'en';
    var helper = '<style>html,body{margin:0;padding:8px;overflow-x:hidden;font-family:sans-serif;top:0px!important}.goog-te-banner-frame,.goog-te-gadget-icon,#goog-gt-tt{display:none!important}</style>' +
      '<div id="gt_ifr" style="display:none"></div>' +
      '<script>' +
      'function fitH(){try{var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,400);if(window.frameElement)window.frameElement.style.height=(h+35)+"px";}catch(e){}}' +
      'window.addEventListener("load",function(){setTimeout(fitH,100);setTimeout(fitH,600);});' +
      'document.addEventListener("click",function(){setTimeout(fitH,150);});' +
      'function triggerIframeLang(l){document.cookie="googtrans=/en/"+l+"; path=/";var c=document.querySelector(".goog-te-combo");if(c){c.value=l;c.dispatchEvent(new Event("change"));setTimeout(fitH,500);}}' +
      'function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:"en",includedLanguages:"en,te,hi,ta,ml,kn",autoDisplay:false},"gt_ifr");setTimeout(function(){triggerIframeLang("' + curLang + '");},600);}' +
      '<\/script>' +
      '<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"><\/script>';
    var isFull = /<!doctype|<html/i.test(raw);
    iframe.srcdoc = isFull ? (raw + helper) : ('<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">' + helper + '</head><body style="color:#e2e8f0;background:#0f172a;">' + raw + '</body></html>');
    box.innerHTML = '';
    box.appendChild(iframe);
  } else {
    box.innerHTML = raw;
  }
}

function setCat(id) { activeCat = id; render(); }

function escHtml(s) { if (!s) return ''; var d = document.createElement('div'); d.appendChild(document.createTextNode(String(s))); return d.innerHTML; }
function escAttr(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleTheme() {
  var isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('idealab_student_theme', isLight ? 'light' : 'dark');
  document.getElementById('themeBtn').innerText = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
}

document.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem('idealab_student_theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeBtn').innerText = '🌙 Dark Mode';
  }
  var savedLang = localStorage.getItem('cs_pref_lang') || 'en';
  var sel = document.getElementById('customLangSelect');
  if (sel) sel.value = savedLang;
  if (savedLang !== 'en') {
    document.cookie = "googtrans=/en/" + savedLang + "; path=/";
  }
  fetchIdeaLabData();
});
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script src="/footer.js"></script>
<script src="/global-navbar.js"></script>
</body>
</html>
