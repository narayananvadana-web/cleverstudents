<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRO Brain Games | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--srf:#161b27;--brd:rgba(255,255,255,.1);--txt:#e2e8f0;--mut:#94a3b8;--font:'Nunito',sans-serif}
    body.light-mode{--bg:#f8fafc;--srf:#fff;--txt:#0f172a;--brd:rgba(0,0,0,.1);--mut:#64748b}
    *,::before,::after{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%!important;max-width:100%!important;background:var(--bg)!important;overflow-x:hidden!important}
    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh}
    
    .logo{font-family:'Fredoka One',cursive;font-size:1.3rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .pro-badge{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:3px 10px;border-radius:20px;font-size:.65rem;font-weight:800}
    .btn{padding:8px 16px;border:none;border-radius:25px;cursor:pointer;font-weight:700;color:#fff;font-family:var(--font);transition:.2s;font-size:.85rem}
    .btn:hover{filter:brightness(1.15)}.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-dark{background:#334155}.btn-gold{background:linear-gradient(135deg,#f59e0b,#ef4444)}.btn-blue{background:#3b82f6}.btn-teal{background:#0d9488}.btn-purple{background:#8b5cf6}
    .btn-sm{padding:5px 12px;font-size:.75rem}.btn-xs{padding:3px 8px;font-size:.7rem}
    .theme-btn{background:var(--bg);color:var(--txt);border:1px solid var(--brd);font-weight:700;font-size:.8rem;cursor:pointer;padding:5px 10px;border-radius:25px}
    
    .main-wrap{max-width:1400px;margin:20px auto;padding:15px}
    .shell{background:var(--srf);border-radius:12px;border:1px solid var(--brd);overflow:hidden}
    .hero-banner{background:linear-gradient(135deg,#1e293b,#0f172a);padding:20px;text-align:center}
    .hero-banner h1{font-size:1.5rem;font-weight:900;color:#f59e0b}
    
    .tab-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:var(--srf);border-bottom:1px solid var(--brd);flex-wrap:wrap;gap:12px}
    .tab-buttons{display:flex;gap:8px;flex-wrap:wrap}
    .tab-nav .btn{opacity:.7;font-size:.8rem}.tab-nav .btn.active{opacity:1;transform:scale(1.05)}
    
    .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:15px;padding:15px}
    .category-card{background:var(--srf);border:2px solid var(--brd);border-radius:10px;overflow:hidden}
    .category-header{background:rgba(245,158,11,.1);padding:12px 15px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid var(--brd)}
    .category-header h3{font-size:.9rem;color:#f59e0b;flex:1}.category-body{display:none;padding:8px}.category-body.open{display:block}
    .game-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:6px;margin-bottom:4px;flex-wrap:wrap;gap:6px}
    .game-item:hover{border-color:#3b82f6}.game-info{flex:1;min-width:150px}.game-info strong{font-size:.82rem}.game-info small{color:var(--mut);font-size:.7rem}
    .tag{display:inline-block;padding:2px 7px;border-radius:12px;font-size:.65rem;font-weight:700}
    .tag-green{background:#15803d;color:#fff}.tag-red{background:#b91c1c;color:#fff}.tag-teal{background:#0d9488;color:#fff}.tag-purple{background:#7c3aed;color:#fff}
    
    .card{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:10px;padding:15px;margin-bottom:15px}
    .form-group{margin-bottom:15px}.form-group label{display:block;font-weight:700;margin-bottom:5px;color:var(--txt);font-size:.85rem}
    .form-inp{width:100%;padding:10px 14px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:8px;font-family:var(--font);color:var(--txt);font-size:.9rem;outline:0;margin-bottom:8px}
    textarea.form-inp{min-height:80px;resize:vertical}
    
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:10000;display:none;align-items:center;justify-content:center;padding:15px}
    .modal-overlay.show{display:flex}.modal{background:var(--srf);border:2px solid #f59e0b;border-radius:14px;padding:25px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
    .modal h2{color:#f59e0b;margin-bottom:12px}
    
    .toast{position:fixed;bottom:15px;right:15px;padding:12px 20px;border-radius:6px;font-weight:700;z-index:99999;color:#fff}
    .toast.success{background:#15803d}.toast.error{background:#b91c1c}.toast.info{background:#1d4ed8}
    
    #login-overlay{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;align-items:center;justify-content:center}
    .login-box{background:var(--srf);padding:35px 25px;border-radius:14px;width:90%;max-width:360px;border:1px solid var(--brd);text-align:center}
    .login-inp{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid var(--brd);background:rgba(0,0,0,.2);color:var(--txt);font-size:.9rem;outline:0}
    .login-info{background:rgba(59,130,246,.15);border:1px solid #3b82f6;border-radius:6px;padding:8px;margin-bottom:12px;font-size:.75rem;color:var(--txt)}
    
    .db-info{background:rgba(0,0,0,.3);border:1px solid #f59e0b;border-radius:8px;padding:8px;margin-bottom:10px;font-family:monospace;font-size:.75rem}
    table{width:100%;border-collapse:collapse;font-size:.8rem}th{background:rgba(245,158,11,.1);padding:8px;text-align:left;font-weight:800}td{padding:8px;border-bottom:1px solid var(--brd)}
    .blank-input{border:2px solid #f59e0b !important; background:rgba(245,158,11,.15) !important; font-weight:700 !important;}
    @media(max-width:600px){.category-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<script src="/supabase-client.js"></script>

<div id="login-overlay">
  <div class="login-box">
    <div class="logo">🧠 PRO Brain Games</div>
    <h3 style="margin:15px 0;color:var(--txt);">Admin Login</h3>
    <div class="login-info">Use your Master Admin Email & Password or <strong>admin / admin123</strong></div>
    <input type="text" id="login-id" class="login-inp" placeholder="Admin Email or ID">
    <input type="password" id="login-pass" class="login-inp" placeholder="Password">
    <button class="btn btn-gold" style="width:100%;padding:12px;" onclick="adminLogin()">🔐 Login</button>
    <div id="login-error" style="color:#ef4444;margin-top:10px;display:none;font-weight:bold;font-size:0.85rem;"></div>
  </div>
</div>

<div class="main-wrap">
  <div class="shell">
    <div class="hero-banner">
      <h1>🎮 PRO Brain Games Management</h1>
      <p style="color:#e2e8f0;">11 Categories | Connected to Supabase</p>
    </div>
    
    <div class="tab-nav">
      <div class="tab-buttons">
        <button class="btn btn-blue btn-sm active" onclick="switchTab('games',this)">🎮 Games</button>
        <button class="btn btn-teal btn-sm" onclick="switchTab('students',this)">👨‍🎓 Students</button>
        <button class="btn btn-gold btn-sm" onclick="switchTab('subscriptions',this)">👥 Subs</button>
      </div>
      
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span id="admin-display" style="font-weight:bold; font-size:0.8rem; color:#10b981;"></span>
        <button class="theme-btn" onclick="toggleTheme()">☀️</button>
        <button class="btn btn-red btn-xs" onclick="adminLogout()">Logout</button>
      </div>
    </div>
    
    <div id="tab-content" style="padding:15px;">
      <div style="padding:40px;text-align:center;color:var(--mut);">Loading Database...</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal" id="edit-modal-content"></div>
</div>

<script>
const db = window.supabaseDb;
var allD = { games: {}, students: {}, subs: {}, rawSettings: {} }, curTab = 'games', edKey = null;

var CATS = [
  {name:"1. Memory & Recall",icon:"🧠"}, {name:"2. Attention & Focus",icon:"👁️"},
  {name:"3. Logic & Reasoning",icon:"🔢"}, {name:"4. Problem Solving",icon:"🧩"},
  {name:"5. Processing Speed",icon:"⚡"}, {name:"6. Cognitive Flexibility",icon:"🔄"},
  {name:"7. Verbal Intelligence",icon:"📚"}, {name:"8. Mathematical",icon:"🧮"},
  {name:"9. N-Back Training",icon:"🎯"}, {name:"10. Advanced Technology",icon:"🕹️"},
  {name:"11. Creativity",icon:"🎨"}
];

function toggleTheme(){var l=document.body.classList.toggle('light-mode');localStorage.setItem('pro_ad_th',l?'light':'dark');}
function toast(m,t){var d=document.createElement('div');d.className='toast '+(t||'info');d.innerText=m;document.body.appendChild(d);setTimeout(function(){d.remove();},3000);}

async function adminLogin(){
  var id = document.getElementById('login-id').value.trim();
  var p = document.getElementById('login-pass').value.trim();
  var errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  try {
    if (id.includes('@')) {
      await window.supabaseAuth.login(id, p);
    } else if (id !== 'admin' || p !== 'admin123') {
      throw new Error('Invalid Admin ID or Password');
    }
    localStorage.setItem('pro_ad_id', id);
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('admin-display').innerText = '👤 ' + id;
    loadAll();
  } catch (e) {
    errEl.innerText = e.message || 'Login failed';
    errEl.style.display = 'block';
  }
}

function adminLogout(){
  localStorage.removeItem('pro_ad_id');
  document.getElementById('login-overlay').style.display = 'flex';
}

async function loadAll(){
  try {
    const [gSnap, sSnap] = await Promise.all([
      db.ref('gamesDatabase').once('value'),
      db.ref('appSettings').once('value')
    ]);
    var rawGames = (gSnap && gSnap.val()) ? gSnap.val() : {};
    allD.games = {};
    Object.keys(rawGames).forEach(function(k) {
      var g = rawGames[k];
      if (g && (g.category || g.isPro || k.indexOf('pro_') === 0 || (g.metadata && g.metadata.isPro))) {
        allD.games[k] = Object.assign({}, g.metadata || {}, g);
        if (!allD.games[k].htmlContent && allD.games[k].content) {
          allD.games[k].htmlContent = allD.games[k].content;
        }
      }
    });

    allD.rawSettings = (sSnap && sSnap.val()) ? sSnap.val() : {};
    allD.students = allD.rawSettings.proGames_students || {};
    allD.subs = allD.rawSettings.proGames_subscriptions || {};

    if(curTab==='games') renderGames();
    else if(curTab==='students') renderStudents();
    else if(curTab==='subscriptions') renderSubs();
  } catch (err) {
    console.error(err);
    toast('Error loading data', 'error');
  }
}

function switchTab(t,b){
  curTab=t;
  document.querySelectorAll('.tab-nav .btn').forEach(function(x){x.classList.remove('active');});
  if(b)b.classList.add('active');
  if(t==='games') renderGames();
  else if(t==='students') renderStudents();
  else if(t==='subscriptions') renderSubs();
}

function renderGames(){
  var c=document.getElementById('tab-content');
  var sc=Object.keys(allD.games).length;
  var h='<div class="db-info">✅ Connected to Supabase | Total PRO Brain Games: <strong>'+sc+'</strong></div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:10px;"><input type="text" class="form-inp" id="gs" placeholder="Search games..." onkeyup="renderGL()" style="margin-bottom:0;"><select class="form-inp" id="gf" onchange="renderGL()" style="max-width:280px;margin-bottom:0;"><option value="ALL">All Categories</option>';
  CATS.forEach(function(cat){h+='<option value="'+cat.name+'">'+cat.icon+' '+cat.name+'</option>';});
  h+='</select></div><div style="margin-bottom:10px;"><button class="btn btn-gold btn-sm" onclick="addNewGame()">➕ Add New PRO Game</button></div><div class="category-grid" id="grid"></div>';
  c.innerHTML=h;
  renderGL();
}

function renderGL(){
  var g=document.getElementById('grid');if(!g)return;
  var s=(document.getElementById('gs')?.value||'').toLowerCase(),f=document.getElementById('gf')?.value||'ALL';
  g.innerHTML='';
  var allGames=Object.entries(allD.games);
  CATS.forEach(function(cat){
    if(f!=='ALL'&&f!==cat.name)return;
    var cg=allGames.filter(function(e){return e[1].category===cat.name;});
    if(s)cg=cg.filter(function(e){return (e[1].title||'').toLowerCase().includes(s);});
    var card=document.createElement('div');
    card.className='category-card';
    card.innerHTML='<div class="category-header" onclick="this.nextElementSibling.classList.toggle(\'open\')"><span>'+cat.icon+'</span><h3>'+cat.name+'</h3><span class="tag tag-purple">'+cg.length+'</span><span>▼</span></div><div class="category-body open"></div>';
    g.appendChild(card);
    var b=card.querySelector('.category-body');
    cg.forEach(function(e){
      var key=e[0],gm=e[1];
      var code = gm.htmlContent || gm.content || '';
      var has = code.trim().length > 10;
      var kb = has ? Math.round(code.length/1024) : 0;
      var it=document.createElement('div');
      it.className='game-item';
      it.innerHTML='<div class="game-info"><strong>'+gm.title+'</strong> <span class="pro-badge">PRO</span> '+(has?'<span class="tag tag-green">✅ '+kb+' KB</span>':'<span class="tag tag-red">❌ Empty</span>')+'<br><small>'+(gm.subcategory||gm.topic||'')+'</small></div><div style="display:flex;gap:4px;"><button class="btn btn-blue btn-xs" onclick="editGame(\''+key+'\')">✏️</button><button class="btn btn-red btn-xs" onclick="delGame(\''+key+'\')">🗑</button></div>';
      b.appendChild(it);
    });
  });
}

function addNewGame(){edKey=null;openModal('','','','','');}
function editGame(key){
  edKey=key;
  var g=allD.games[key];
  if(!g)return;
  openModal(g.title, g.category, g.subcategory||g.topic||'', g.description||'', g.htmlContent||g.content||'');
}

function openModal(t,c,s,ct,ht){
  var m=document.getElementById('edit-modal-content');
  m.innerHTML = '<h2>'+(edKey?'✏️ Edit':'➕ Add New')+' PRO Game</h2>' +
    '<div class="form-group"><label>Category</label><select id="ef-cat" class="form-inp">' +
    CATS.map(function(x){return '<option value="'+x.name+'" '+(c===x.name?'selected':'')+'>'+x.icon+' '+x.name+'</option>';}).join('') +
    '</select></div>' +
    '<div class="form-group"><label>🎮 Subcategory / Game Topic</label><input type="text" id="ef-sub" class="form-inp blank-input" value="'+(s||'').replace(/"/g,'&quot;')+'"></div>' +
    '<div class="form-group"><label>📝 Game Title</label><input type="text" id="ef-title" class="form-inp blank-input" value="'+(t||'').replace(/"/g,'&quot;')+'"></div>' +
    '<div class="form-group"><label>HTML Game Code</label>' +
    '<div style="border:2px dashed #f59e0b;border-radius:8px;padding:10px;text-align:center;cursor:pointer;margin-bottom:8px;" onclick="document.getElementById(\'ef-html-file\').click()">📤 Click to Upload .html File<input type="file" id="ef-html-file" accept=".html,.txt" style="display:none;" onchange="loadF(this)"></div>' +
    '<textarea id="ef-html" class="form-inp" style="min-height:300px;font-family:monospace;font-size:12px;"></textarea></div>' +
    '<div><button class="btn btn-green btn-sm" onclick="saveGame()">💾 Save Game</button> <button class="btn btn-dark btn-sm" onclick="closeModal()">❌ Cancel</button></div>';
  document.getElementById('ef-html').value = ht || '';
  document.getElementById('edit-modal').classList.add('show');
}

function loadF(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){document.getElementById('ef-html').value=e.target.result;toast('✅ File Loaded!','success');};r.readAsText(f);}
function closeModal(){document.getElementById('edit-modal').classList.remove('show');edKey=null;}

async function saveGame(){
  var t=document.getElementById('ef-title').value.trim(),c=document.getElementById('ef-cat').value,s=document.getElementById('ef-sub').value.trim(),ht=document.getElementById('ef-html').value;
  if(!t||!c){toast('Title and Category required','error');return;}
  var key = edKey || ('pro_game_' + Date.now());
  var gameObj = {title:t, category:c, subcategory:s||t, topic:s||t, content:ht, htmlContent:ht, isPro:true, imageUrls:[]};
  
  try {
    await db.ref('gamesDatabase/' + key).set(gameObj);
    toast('✅ Game Saved to Supabase!','success');
    closeModal();
    loadAll();
  } catch (err) {
    alert('Save failed: ' + err.message + '\n\nTip: Login with your Master Admin email & password so Supabase allows saving!');
  }
}

async function delGame(key){
  if(confirm('Delete this game?')){
    try {
      await db.ref('gamesDatabase/' + key).remove();
      toast('🗑 Deleted!','success');
      loadAll();
    } catch (err) {
      alert('Delete failed: ' + err.message);
    }
  }
}

function renderStudents(){
  var c=document.getElementById('tab-content'),st=allD.students||{},sl=Object.entries(st);
  c.innerHTML='<div class="card"><h3>➕ Create Student Login</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><input type="text" id="nsn" class="form-inp" placeholder="Student Name"><input type="text" id="nsi" class="form-inp" placeholder="User ID / Phone"><input type="text" id="nsp" class="form-inp" placeholder="Password"><input type="text" id="nsc" class="form-inp" placeholder="Confirm Password"></div><button class="btn btn-green btn-sm" style="margin-top:8px;" onclick="crStu()">➕ Create Student</button></div><div class="card"><h3>📋 Registered Students ('+sl.length+')</h3>'+(sl.length===0?'<p style="color:var(--mut);">No students</p>':'<table><tr><th>User ID</th><th>Name</th><th>Password</th><th>Actions</th></tr>'+sl.map(function(e){return'<tr><td><strong>'+e[0]+'</strong></td><td>'+e[1].name+'</td><td>'+e[1].password+'</td><td><button class="btn btn-red btn-xs" onclick="delStu(\''+e[0]+'\')">🗑 Delete</button></td></tr>';}).join('')+'</table>')+'</div>';
}

async function crStu(){
  var n=document.getElementById('nsn').value.trim(),i=document.getElementById('nsi').value.trim(),p=document.getElementById('nsp').value.trim(),c=document.getElementById('nsc').value.trim();
  if(!n||!i||!p||!c)return toast('All fields required','error');
  if(p!==c)return toast('Passwords mismatch','error');
  allD.students[i] = {name:n, password:p, registeredAt:new Date().toISOString()};
  allD.rawSettings.proGames_students = allD.students;
  try {
    await db.ref('appSettings').set(allD.rawSettings);
    toast('✅ Student Login Created!','success');
    loadAll();
  } catch (err) {
    alert('Failed to save student: ' + err.message + '\nPlease login using your Master Admin Email!');
  }
}

async function delStu(id){
  if(confirm('Delete student '+id+'?')){
    delete allD.students[id];
    allD.rawSettings.proGames_students = allD.students;
    await db.ref('appSettings').set(allD.rawSettings);
    toast('🗑 Deleted!','success');
    loadAll();
  }
}

function renderSubs(){
  var c=document.getElementById('tab-content'),subs=allD.subs||{},sl=Object.entries(subs);
  c.innerHTML='<div class="card"><h3>👥 Subscriptions ('+sl.length+')</h3>'+(sl.length===0?'<p style="color:var(--mut);">No subscriptions</p>':'<table><tr><th>Student</th><th>Plan</th><th>Status</th></tr>'+sl.map(function(e){return'<tr><td>'+e[0]+'</td><td>'+(e[1].plan||'PRO')+'</td><td><span class="tag tag-green">'+(e[1].status||'active')+'</span></td></tr>';}).join('')+'</table>')+'</div>';
}

window.onload = function(){
  var saved = localStorage.getItem('pro_ad_id');
  if(saved){
    document.getElementById('login-overlay').style.display='none';
    document.getElementById('admin-display').innerText='👤 '+saved;
    loadAll();
  }
};
</script>
<script src="/footer.js"></script>
<script src="/global-navbar.js"></script>
</body>
</html>
