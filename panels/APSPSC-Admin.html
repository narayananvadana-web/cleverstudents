<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APPSC Mastery | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --srf: #161b27;
      --brd: rgba(255, 255, 255, .1);
      --txt: #e2e8f0;
      --mut: #94a3b8;
      --font: 'Nunito', sans-serif;
      --r-lg: 16px;
      --r-md: 8px;
      --r-sm: 4px;
    }
    body.light-mode {
      --bg: #f8fafc;
      --srf: #fff;
      --txt: #0f172a;
      --brd: rgba(0, 0, 0, .1);
      --mut: #64748b;
    }
    *, ::before, ::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 100% !important;
      background: var(--bg) !important;
      overflow-x: hidden !important;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background .3s, color .3s;
    }
    body.protected-mode, body.protected-mode * { user-select: none !important; -webkit-user-select: none !important; -ms-user-select: none !important; }
    body.copy-allowed, body.copy-allowed * { user-select: auto !important; -webkit-user-select: auto !important; -ms-user-select: auto !important; }
    input, textarea, select { user-select: auto !important; -webkit-user-select: auto !important; }
    #editForm, #editForm *, #groupView, #groupView * { user-select: auto !important; -webkit-user-select: auto !important; }
    .notranslate { translate: no !important; }

    .top-bar { background: var(--srf); border-bottom: 1px solid var(--brd); padding: 0 15px; position: sticky; top: 0; z-index: 999; box-shadow: 0 4px 20px rgba(0, 0, 0, .5); }
    body.light-mode .top-bar { box-shadow: 0 4px 20px rgba(0, 0, 0, .05); }
    .top-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; padding: 12px 0; justify-content: space-between; }
    .logo { font-family: 'Fredoka One', cursive; font-size: 1.5rem; background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; flex-shrink: 0; }
    .theme-btn { background: var(--bg); color: var(--txt); border: 1px solid var(--brd); font-weight: 700; font-size: .85rem; cursor: pointer; padding: 6px 12px; border-radius: 50px; font-family: var(--font); }
    
    .btn { padding: 10px 20px; border: none; border-radius: 50px; cursor: pointer; font-weight: 800; color: #fff; font-family: var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: .2s; }
    .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-blue { background: #3b82f6; } .btn-green { background: #10b981; } .btn-red { background: #ef4444; } .btn-dark { background: #334155; } .btn-orange { background: #f59e0b; } .btn-teal { background: #0d9488; } .btn-purple { background: #8b5cf6; } .btn-pink { background: #ec4899; }
    .btn-sm { padding: 6px 14px; font-size: .8rem; } .btn-xs { padding: 4px 10px; font-size: .72rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .main-wrap { max-width: 100% !important; width: 100% !important; padding: 20px 10px 80px !important; margin: 0 auto; }
    .shell { background: var(--srf); border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--brd); width: 100%; max-width: 1400px; margin: 0 auto; }
    .banner { padding: 12px 20px !important; display: flex; align-items: center; justify-content: center; gap: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, .2); flex-wrap: wrap; text-align: center; }
    .banner h1 { font-size: 1.4rem !important; font-weight: 900 !important; color: #fff !important; }
    .banner p { color: rgba(255,255,255,.9); font-weight: 700; font-size: .95rem; }

    /* Subject Filter Buttons Row */
    .sub-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 14px; background: rgba(0, 0, 0, .22); border-bottom: 1px solid var(--brd); }
    .btn-sub { padding: 8px 16px; border: 2px solid transparent; border-radius: 8px; color: #fff; font-weight: 800; font-size: .85rem; cursor: pointer; opacity: .7; transform: scale(.96); white-space: nowrap; font-family: var(--font); transition: .2s; }
    .btn-sub:hover { opacity: .95; transform: scale(1); }
    .btn-sub.active { opacity: 1; transform: scale(1.04); border-color: #fff; box-shadow: 0 0 14px rgba(255, 255, 255, .3); }

    .admin-tabs { display: flex; gap: 8px; padding: 12px 15px; background: rgba(0, 0, 0, .15); border-bottom: 1px solid var(--brd); flex-wrap: wrap; justify-content: center; overflow-x: auto; }
    .admin-tab-btn { padding: 8px 20px; border-radius: 50px; border: 1px solid var(--brd); background: 0 0; color: var(--mut); font-weight: 800; font-size: .85rem; cursor: pointer; font-family: var(--font); transition: .2s; white-space: nowrap; }
    .admin-tab-btn:hover { color: var(--txt); border-color: var(--txt); }
    .admin-tab-btn.active { background: #ef4444; color: #fff; border-color: #ef4444; box-shadow: 0 2px 8px rgba(239, 68, 68, .4); }

    .admin-content { padding: 20px; background: var(--srf); }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; color: var(--txt); font-size: .9rem; }
    .form-inp { width: 100%; padding: 11px 14px; background: rgba(0, 0, 0, .2); border: 1px solid var(--brd); border-radius: 8px; font-family: var(--font); color: var(--txt); font-size: .92rem; outline: 0; margin-bottom: 8px; }
    textarea.form-inp { min-height: 80px; resize: vertical; }
    select.form-inp { appearance: none; cursor: pointer; }
    .card { background: rgba(255, 255, 255, .03); border: 1px solid var(--brd); border-radius: var(--r-md); padding: 20px; margin-bottom: 16px; }
    
    .csv-box { background: rgba(14, 165, 233, .08); border: 2px dashed #0ea5e9; border-radius: var(--r-md); padding: 18px; margin-bottom: 20px; }
    .csv-box h3 { color: #38bdf8; font-size: 1.05rem; }
    .csv-fmt { background: rgba(0, 0, 0, .3); border-radius: 8px; padding: 10px 12px; font-size: .75rem; color: var(--mut); line-height: 1.6; margin: 10px 0; overflow-x: auto; white-space: pre; font-family: monospace; }
    
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; padding: 12px; background: rgba(0, 0, 0, .2); border-radius: 8px; border: 1px solid var(--brd); }
    .toolbar select { min-width: 150px; }

    /* Collapsible Subject & Topic Bars with Alternating Light/Dark Shades */
    .subj-header-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; margin: 14px 0 0; color: #fff; font-weight: 900; font-size: 1.08rem; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.2); transition: .2s; }
    .subj-header-bar:hover { filter: brightness(1.1); }
    .subj-body-wrap { display: none; padding: 10px 12px 14px; background: rgba(0,0,0,.18); border: 1px solid var(--brd); border-top: none; border-radius: 0 0 8px 8px; margin-bottom: 10px; }
    .subj-body-wrap.show { display: block; animation: fadeIn .2s ease; }

    .topic-drop-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; margin: 8px 0 0; color: #fff; font-weight: 800; font-size: .96rem; border-radius: 8px; cursor: pointer; transition: .2s; box-shadow: 0 3px 6px rgba(0,0,0,.22); border-left: 5px solid rgba(255,255,255,.75); }
    .topic-drop-bar:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .topic-drop-body { display: none; padding: 10px; background: rgba(0,0,0,.25); border: 1px solid var(--brd); border-top: none; border-radius: 0 0 8px 8px; margin-bottom: 8px; }
    .topic-drop-body.show { display: block; animation: fadeIn .2s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .badge-pill { background: rgba(0,0,0,.38); padding: 4px 12px; border-radius: 20px; font-size: .78rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.18); }
    .badge-pill b { color: #fde047; }

    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(0, 0, 0, .25); border: 1px solid var(--brd); border-radius: 8px; margin-bottom: 7px; flex-wrap: wrap; gap: 10px; transition: .15s; }
    .list-item:hover { border-color: #3b82f6; background: rgba(59, 130, 246, .08); }
    .list-item.selected { background: rgba(59, 130, 246, .18); border-color: #3b82f6; }
    .list-item .item-check { width: 18px; height: 18px; cursor: pointer; accent-color: #3b82f6; }
    .list-item .item-info { flex: 1; min-width: 200px; }

    .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: .74rem; font-weight: 700; }
    .tag-green { background: #15803d; color: #fff; } .tag-red { background: #b91c1c; color: #fff; } .tag-blue { background: #1d4ed8; color: #fff; } .tag-orange { background: #c2410c; color: #fff; } .tag-teal { background: #0d9488; color: #fff; } .tag-purple { background: #7c3aed; color: #fff; }
    
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255, 255, 255, .3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 14px 24px; border-radius: 8px; font-weight: 700; z-index: 99999; animation: slideIn .3s ease; color: #fff; max-width: 400px; }
    .toast.success { background: #15803d; } .toast.error { background: #b91c1c; } .toast.info { background: #1d4ed8; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: none; align-items: center; justify-content: center; }
    .login-box { background: var(--srf); padding: 40px 30px; border-radius: var(--r-lg); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); width: 90%; max-width: 380px; border: 1px solid var(--brd); text-align: center; }
    .login-inp { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--brd); background: rgba(0, 0, 0, .2); color: var(--txt); font-family: var(--font); font-size: 1rem; outline: 0; }
    .login-info { background: rgba(59, 130, 246, .15); border: 1px solid #3b82f6; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: .85rem; color: var(--txt); text-align: left; line-height: 1.6; }
    .optional-label { color: var(--mut); font-weight: 400; font-size: .75rem; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
    .checkbox-label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(0,0,0,.2); border: 1px solid var(--brd); border-radius: 16px; font-size: .85rem; cursor: pointer; }

    /* Upload Box Styles */
    .file-upload-area{border:2px dashed #0ea5e9;border-radius:8px;padding:18px;text-align:center;cursor:pointer;transition:all 0.3s;background:rgba(14,165,233,.05);margin-bottom:10px}
    .file-upload-area:hover{border-color:#38bdf8;background:rgba(14,165,233,.1)}
    .file-upload-area.drag-over{border-color:#22c55e;background:rgba(34,197,94,.1)}
    .file-upload-icon{font-size:1.8rem;margin-bottom:6px}
    .file-types-info{font-size:.7rem;color:var(--mut);margin-top:4px}

    @media(max-width: 600px) {
      .list-item { flex-direction: column; align-items: flex-start; }
      .admin-tabs { gap: 4px; padding: 8px; }
      .admin-tab-btn { padding: 6px 14px; font-size: .75rem; }
      .toolbar { flex-direction: column; }
      .subj-header-bar, .topic-drop-bar { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body class="protected-mode">
<script src="/supabase-client.js"></script>

  <div id="login-overlay">
    <div class="login-box">
      <div class="logo" style="margin-bottom:20px;">⚙️ APPSC Admin Panel</div>
      <h2 style="margin-bottom:25px;color:var(--txt);">Admin Login</h2>
      <div class="login-info"><strong>🔑 Default Login:</strong><br>ID: admin<br>Password: admin123</div>
      <input type="text" id="login-phone" class="login-inp" placeholder="Admin ID">
      <input type="password" id="login-pass" class="login-inp" placeholder="Password">
      <button class="btn btn-orange" style="width:100%;padding:14px;font-size:1.1rem;margin-top:10px;" onclick="window.attemptLogin()">Login</button>
      <div id="login-error" style="color:#ef4444;margin-top:15px;font-weight:700;display:none;"></div>
    </div>
  </div>

  <div class="top-bar">
    <div class="top-inner">
      <div class="logo">⚙️ APPSC Admin Panel</div>
      <div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap;">
        <span id="admin-info" style="font-weight:700;font-size:.9rem;color:#4ade80;">Admin: admin</span>
        <button class="theme-btn" id="theme-toggle" onclick="window.toggleTheme()">Light Mode</button>
        <button class="btn btn-red btn-sm" onclick="window.logout()">Logout</button>
      </div>
    </div>
  </div>

  <div class="main-wrap">
    <div id="shell" class="shell">
      <div class="banner" style="background:linear-gradient(135deg,#f59e0b,#ef4444);">
        <h1>⚙️ APPSC Admin Control Panel</h1>
        <p>Manage APPSC Quiz, Syllabus &amp; Essay Content</p>
      </div>
      <!-- ✅ TAB ORDER: 1. Quiz -> 2. Syllabus -> 3. Essay -> 4. Users -> 5. Settings -->
      <div class="admin-tabs" id="admin-tabs">
        <button class="admin-tab-btn active" onclick="window.switchTab('quiz', event)">📝 Quiz</button>
        <button class="admin-tab-btn" onclick="window.switchTab('syllabus', event)">📖 Syllabus</button>
        <button class="admin-tab-btn" onclick="window.switchTab('essay', event)">✍️ Essay Writing</button>
        <button class="admin-tab-btn" onclick="window.switchTab('users', event)">👥 Users</button>
        <button class="admin-tab-btn" onclick="window.switchTab('settings', event)">⚙️ Settings</button>
      </div>
      <div class="sub-row" id="admin-sub-row"></div>
      <div class="admin-content" id="admin-content">
        <div style="padding:40px;text-align:center;"><span class="spinner"></span> Loading...</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); }, false);
    document.addEventListener('drop', function(e) { e.preventDefault(); e.stopPropagation(); }, false);
  </script>

  <script>
    // ============ 8 APPSC SUBJECT PALETTES (ALTERNATING LIGHT & DARK SHADES) ============
    var SUBJECT_THEMES = {
      'History': {
        name: 'History',
        grad: 'linear-gradient(135deg,#db2777,#be185d)',
        lightGrad: 'linear-gradient(135deg,#ec4899,#db2777)',
        darkGrad:  'linear-gradient(135deg,#9d174d,#500724)'
      },
      'India Polity': {
        name: 'India Polity',
        grad: 'linear-gradient(135deg,#2563eb,#1d4ed8)',
        lightGrad: 'linear-gradient(135deg,#3b82f6,#2563eb)',
        darkGrad:  'linear-gradient(135deg,#1e40af,#172554)'
      },
      'Economy': {
        name: 'Economy',
        grad: 'linear-gradient(135deg,#7c3aed,#5b21b6)',
        lightGrad: 'linear-gradient(135deg,#8b5cf6,#7c3aed)',
        darkGrad:  'linear-gradient(135deg,#5b21b6,#3b0764)'
      },
      'Geography': {
        name: 'Geography',
        grad: 'linear-gradient(135deg,#ea580c,#c2410c)',
        lightGrad: 'linear-gradient(135deg,#f97316,#ea580c)',
        darkGrad:  'linear-gradient(135deg,#c2410c,#7c2d12)'
      },
      'General Science': {
        name: 'General Science',
        grad: 'linear-gradient(135deg,#0d9488,#0f766e)',
        lightGrad: 'linear-gradient(135deg,#14b8a6,#0d9488)',
        darkGrad:  'linear-gradient(135deg,#115e59,#042f2e)'
      },
      'Ecology & Environment': {
        name: 'Ecology & Environment',
        grad: 'linear-gradient(135deg,#16a34a,#15803d)',
        lightGrad: 'linear-gradient(135deg,#22c55e,#16a34a)',
        darkGrad:  'linear-gradient(135deg,#166534,#052e16)'
      },
      'Current Affairs': {
        name: 'Current Affairs',
        grad: 'linear-gradient(135deg,#d97706,#b45309)',
        lightGrad: 'linear-gradient(135deg,#f59e0b,#d97706)',
        darkGrad:  'linear-gradient(135deg,#92400e,#451a03)'
      },
      'Mental Ability': {
        name: 'Mental Ability',
        grad: 'linear-gradient(135deg,#dc2626,#b91c1c)',
        lightGrad: 'linear-gradient(135deg,#ef4444,#dc2626)',
        darkGrad:  'linear-gradient(135deg,#991b1b,#450a0a)'
      }
    };
    var APPSC_SUBJECTS = Object.keys(SUBJECT_THEMES);
    var APPSC_GROUPS = ['Group 1', 'Group 2'];
    var APPSC_STAGES = ['Prelims', 'Mains'];

    function mapKeyToSubject(raw) {
      var k = String(raw || '').toLowerCase().replace(/[^a-z]/g, '');
      if (k.indexOf('history') !== -1 || k.indexOf('culture') !== -1 || k.indexOf('freedom') !== -1 || k.indexOf('bifurcation') !== -1) return 'History';
      if (k.indexOf('polity') !== -1 || k.indexOf('governance') !== -1 || k.indexOf('constitution') !== -1 || k.indexOf('rights') !== -1 || k.indexOf('dpsp') !== -1 || k.indexOf('parliament') !== -1 || k.indexOf('judiciary') !== -1 || k.indexOf('ethics') !== -1) return 'India Polity';
      if (k.indexOf('econom') !== -1 || k.indexOf('agricultur') !== -1 || k.indexOf('industry') !== -1 || k.indexOf('budget') !== -1 || k.indexOf('poverty') !== -1 || k.indexOf('welfare') !== -1 || k.indexOf('planning') !== -1) return 'Economy';
      if (k.indexOf('geograph') !== -1 || k.indexOf('climate') !== -1 || k.indexOf('demograph') !== -1 || k.indexOf('urban') !== -1) return 'Geography';
      if (k.indexOf('science') !== -1 || k.indexOf('physics') !== -1 || k.indexOf('chemistry') !== -1 || k.indexOf('biology') !== -1 || k.indexOf('space') !== -1 || k.indexOf('ict') !== -1 || k.indexOf('biotech') !== -1 || k.indexOf('computer') !== -1) return 'General Science';
      if (k.indexOf('ecolog') !== -1 || k.indexOf('environment') !== -1 || k.indexOf('biodivers') !== -1 || k.indexOf('disaster') !== -1 || k.indexOf('pollution') !== -1) return 'Ecology & Environment';
      if (k.indexOf('current') !== -1 || k.indexOf('national') !== -1 || k.indexOf('international') !== -1 || k.indexOf('sport') !== -1 || k.indexOf('award') !== -1) return 'Current Affairs';
      if (k.indexOf('reason') !== -1 || k.indexOf('mental') !== -1 || k.indexOf('data') !== -1 || k.indexOf('numerical') !== -1 || k.indexOf('logical') !== -1 || k.indexOf('problem') !== -1 || k.indexOf('aptitude') !== -1) return 'Mental Ability';
      return 'History';
    }

    // ============ 0.2-SECOND DIRECT SUPABASE HELPERS ============
    async function fetchDB(key) {
      var db = await window.supabaseReady;
      if (key === 'appscQuestionBank_index') {
        var res = await db.from('quiz_sets').select('*').eq('course', 'appsc').limit(1000);
        var rows = (res && res.data) || [];
        var idx = {};
        rows.forEach(function(r) {
          var m = r.metadata || {};
          var k = r.quiz_key || r.legacy_key || r.id;
          var parts = k.split('_');
          var rawSubj = r.subject || m.subject || parts[0] || 'History';
          var mainTopic = r.sub_subject || m.subSubject || (parts.length > 2 ? parts[1] : rawSubj) || 'General';
          var subTopic = r.topic || m.topic || (parts.length > 2 ? parts.slice(2).join(' ') : parts.slice(1).join(' ')) || r.title || k;
          idx[k] = {
            id: r.id,
            count: Number(m.count) || 20,
            group: r.group_name || m.group || 'Group 1',
            stage: r.stage || m.stage || 'Prelims',
            subject: mapKeyToSubject(rawSubj),
            subSubject: mainTopic.replace(/_/g, ' '),
            topic: subTopic.replace(/_/g, ' '),
            order: r.order_index || m.order || 0
          };
        });
        return idx;
      }
      if (key === 'appscSyllabus' || key === 'appscEssay') {
        var mType = (key === 'appscEssay') ? 'essay' : 'syllabus';
        var sRes = await db.from('study_materials').select('*').eq('course', 'appsc').eq('material_type', mType).limit(1000);
        var sRows = (sRes && sRes.data) || [];
        var sMap = {};
        sRows.forEach(function(r) {
          var m = r.metadata || {};
          var k = r.legacy_key || r.material_key || r.id;
          var rawSubj = r.subject || m.subject || 'History';
          sMap[k] = {
            id: r.id,
            title: r.title || m.title || 'Untitled',
            group: r.group_name || m.group || 'Group 1',
            stage: r.stage || m.stage || 'Prelims',
            subject: mapKeyToSubject(rawSubj),
            subSubject: r.sub_subject || m.subSubject || rawSubj || 'General',
            topic: r.topic || m.topic || r.title || 'General',
            content: r.content_html || m.content || '',
            order: r.order_index || m.order || 0
          };
        });
        return sMap;
      }
      if (key.indexOf('appsc_qb_') === 0) {
        var qKey = key.substring(9);
        var qSet = allData.quiz && allData.quiz[qKey];
        var setId = qSet && qSet.id;
        if (!setId) {
          var stRes = await db.from('quiz_sets').select('id').eq('course', 'appsc').eq('quiz_key', qKey).limit(1);
          if (stRes.data && stRes.data.length) setId = stRes.data[0].id;
        }
        if (setId) {
          var qRes = await db.from('quiz_questions').select('*').eq('quiz_set_id', setId).order('order_index', { ascending: true }).limit(2000);
          var qRows = (qRes && qRes.data) || [];
          return qRows.map(function(r) {
            var m = r.metadata || {};
            return {
              id: r.id,
              question: r.question_html || r.question_text || m.question || '',

    window.setupFileDropZone = function(){
      var dropZone = document.getElementById('fileDropZone');
      var fileInput = document.getElementById('csvFileInput');
      if(!dropZone || !fileInput) return;

      dropZone.addEventListener('dragover', function(e) {
          e.preventDefault(); e.stopPropagation();
          dropZone.classList.add('drag-over');
      }, false);
      dropZone.addEventListener('dragleave', function(e) {
          e.preventDefault(); e.stopPropagation();
          dropZone.classList.remove('drag-over');
      }, false);
      dropZone.addEventListener('drop', function(e) {
          e.preventDefault(); e.stopPropagation();
          dropZone.classList.remove('drag-over');
          var files = e.dataTransfer.files;
          if(files && files.length > 0) {
              fileInput.files = files;
              window.handleFileEvent({target: {files: files}});
          }
      }, false);
    }

    window.getFilteredAndSortedKeys = function(keys, data, isQuiz) {
      var filtered = [];
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var item = data[k] || {};
        var itemSubj = item.subject || 'History';
        var itemSubSubj = (item.subSubject && item.subSubject !== 'General') ? item.subSubject : (item.topic || 'General');

        if (currentFilters.subject !== 'ALL' && itemSubj !== currentFilters.subject) continue;
        if (currentFilters.subSubject !== 'ALL' && itemSubSubj !== currentFilters.subSubject) continue;
        filtered.push(k);
      }

      if (currentFilters.sort === 'az') {
        filtered.sort(function(a, b) {
          var na = (data[a] && data[a].title) ? data[a].title.toLowerCase() : a.toLowerCase();
          var nb = (data[b] && data[b].title) ? data[b].title.toLowerCase() : b.toLowerCase();
          return na.localeCompare(nb);
        });
      } else if (currentFilters.sort === 'za') {
        filtered.sort(function(a, b) {
          var na = (data[a] && data[a].title) ? data[a].title.toLowerCase() : a.toLowerCase();
          var nb = (data[b] && data[b].title) ? data[b].title.toLowerCase() : b.toLowerCase();
          return nb.localeCompare(na);
        });
      } else if (currentFilters.sort === 'newest') {
        filtered.reverse();
      } else {
        filtered.sort(function(a, b) {
          return ((data[a] && data[a].order) || 0) - ((data[b] && data[b].order) || 0);
        });
      }
      return filtered;
    }

    window.handleFileEvent = function(event){

    window.smartParse = function(text, sourceName){
      text = text ? text.trim() : '';
      if(!text){ toast('Invalid or empty data!','error'); return; }

      if(text.startsWith('[') || text.startsWith('{')){
        try{ var parsed = JSON.parse(text); window.parseJSONData(parsed); return; }catch(e){}
      }

      var rows = window.parseCSVRows(text);
      if(rows.length < 2){toast('Need header + data rows. Found: '+rows.length,'error');return}

      var delimiter = window.detectDelimiter(rows);
      var headers = window.smartSplitLine(rows[0], delimiter);

      var colMap={group:-1,stage:-1,subject:-1,topic:-1,question:-1,optA:-1,optB:-1,optC:-1,optD:-1,correct:-1,explanation:-1};
      for(var hi=0;hi<headers.length;hi++){
        var hdr=headers[hi].toLowerCase().replace(/[\s_"-]/g,'');
        if(hdr==='group')colMap.group=hi;
        else if(hdr==='stage')colMap.stage=hi;
        else if(hdr==='subject')colMap.subject=hi;
        else if(hdr==='topic')colMap.topic=hi;
        else if(hdr==='question'||hdr==='ques'||hdr==='q')colMap.question=hi;
        else if(hdr==='optiona'||hdr==='opta'||hdr==='a')colMap.optA=hi;
        else if(hdr==='optionb'||hdr==='optb'||hdr==='b')colMap.optB=hi;
        else if(hdr==='optionc'||hdr==='optc'||hdr==='c')colMap.optC=hi;
        else if(hdr==='optiond'||hdr==='optd'||hdr==='d')colMap.optD=hi;
        else if(hdr==='correct'||hdr==='answer'||hdr==='ans')colMap.correct=hi;
        else if(hdr==='explanation'||hdr==='exp')colMap.explanation=hi;
      }

      if(colMap.group===-1&&headers.length>0)colMap.group=0;
      if(colMap.stage===-1&&headers.length>1)colMap.stage=1;
      if(colMap.subject===-1&&headers.length>2)colMap.subject=2;
      if(colMap.topic===-1&&headers.length>3)colMap.topic=3;
      if(colMap.question===-1&&headers.length>4)colMap.question=4;
      if(colMap.optA===-1&&headers.length>5)colMap.optA=5;
      if(colMap.optB===-1&&headers.length>6)colMap.optB=6;
      if(colMap.correct===-1&&headers.length>7)colMap.correct=7;

      csvRows=[]; var errors=[];
      window.skippedRowsData = rows[0] + delimiter + '"Error_Reason"\n';

      for(var l=1;l<rows.length;l++){
        var cols = window.smartSplitLine(rows[l], delimiter);
        if(cols.length < 5){
          errors.push('Row '+(l+1)+': too few columns');
          window.skippedRowsData += rows[l] + delimiter + '"Too few columns"\n';
          continue;
        }

        var group=window.getCol(cols,colMap.group)||'Group 1', stage=window.getCol(cols,colMap.stage)||'Prelims', subject=window.getCol(cols,colMap.subject)||'History', topic=window.getCol(cols,colMap.topic)||'General';
        var question=window.getCol(cols,colMap.question), optA=window.getCol(cols,colMap.optA), optB=window.getCol(cols,colMap.optB), optC=window.getCol(cols,colMap.optC), optD=window.getCol(cols,colMap.optD), ans=window.getCol(cols,colMap.correct).toUpperCase().trim().charAt(0), exp=window.getCol(cols,colMap.explanation)||'';

        var errorMsg = "";
        if(!question||!optA||!optB||!ans) errorMsg = "Missing Q/A/B/Correct";
        else if(['A','B','C','D'].indexOf(ans)===-1) errorMsg = "Correct must be A/B/C/D";

        if(errorMsg !== "") {
          errors.push('Row '+(l+1)+': ' + errorMsg);
          window.skippedRowsData += rows[l] + delimiter + '"' + errorMsg + '"\n';
          continue;
        }

        var key=(group+'_'+stage+'_'+subject+'_'+topic).replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
        csvRows.push({key:key,group:group,stage:stage,subject:subject,topic:topic,question:question,optionA:optA,optionB:optB,optionC:optC,optionD:optD,correctAnswer:ans,explanation:exp||''});
      }
      window.showCSVPreview(errors, sourceName+' ('+(delimiter==='\t'?'TSV':'CSV')+')');
    }

    window.parseJSONData = function(jsonData){
      var rows=[];
      if(!Array.isArray(jsonData) && typeof jsonData === 'object') {
        Object.keys(jsonData).forEach(function(k) {
          if(Array.isArray(jsonData[k])) { rows = rows.concat(jsonData[k]); }
          else if(typeof jsonData[k] === 'object' && jsonData[k].question) { rows.push(jsonData[k]); }
        });
        if(rows.length === 0) { if(jsonData.question) rows=[jsonData]; else if(jsonData.questions) rows=jsonData.questions; }
      } else { rows=jsonData; }

      if(!rows || rows.length === 0){ toast('No valid questions found in JSON!','error'); return; }
      csvRows=[]; var errors=[];
      for(var i=0;i<rows.length;i++){
        var r=rows[i];
        var group=r.group||r.Group||'Group 1', stage=r.stage||r.Stage||'Prelims', subject=r.subject||r.Subject||'History', topic=r.topic||r.Topic||'General';
        var question=r.question||r.Question||'', optA=r.optionA||r.optA||(r.options&&r.options.A)||r['Option A']||'', optB=r.optionB||r.optB||(r.options&&r.options.B)||r['Option B']||'', optC=r.optionC||r.optC||(r.options&&r.options.C)||r['Option C']||'', optD=r.optionD||r.optD||(r.options&&r.options.D)||r['Option D']||'', ans=(r.correctAnswer||r.answer||r.Answer||'').toString().toUpperCase().charAt(0), exp=r.explanation||r.Explanation||'';
        if(!question||!optA||!optB||['A','B','C','D'].indexOf(ans)===-1){ errors.push('Row '+(i+1)); continue; }
        var key=(group+'_'+stage+'_'+subject+'_'+topic).replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
        csvRows.push({key:key,group:group,stage:stage,subject:subject,topic:topic,question:question,optionA:optA,optionB:optB,optionC:optC,optionD:optD,correctAnswer:ans,explanation:exp||''});
      }
      window.showCSVPreview(errors,'JSON Data');
    }

    window.smartSplitLine = function(line, delimiter) { var result = []; var current = ''; var inQuotes = false; for (var i = 0; i < line.length; i++) { var ch = line[i]; if (ch === '"') { if (inQuotes && line[i + 1] === '"') { current += '"'; i++; } else { inQuotes = !inQuotes; } } else if (ch === delimiter && !inQuotes) { result.push(current.trim()); current = ''; } else { current += ch; } } result.push(current.trim()); return result; };
    window.getCol = function(cols, idx){ return (idx >= 0 && idx < cols.length) ? cols[idx] : ''; }
    window.parseCSVRows = function(text){ var rows=[], current='', inQuotes=false; for(var i=0;i<text.length;i++){ var ch=text[i]; if(ch==='"'){ if(inQuotes && text[i+1]==='"'){ current+='"'; i++; continue; } inQuotes=!inQuotes; continue; } if(ch==='\n' && !inQuotes){ if(current.trim()) rows.push(current.trim()); current=''; continue; } if(ch==='\r' && !inQuotes){ if(current.trim()) rows.push(current.trim()); current=''; if(text[i+1]==='\n') i++; continue; } current+=ch; } if(current.trim()) rows.push(current.trim()); return rows; }
    window.detectDelimiter = function(rows){ var tc=0,cc=0; for(var i=0;i<Math.min(5,rows.length);i++){ var inQ=false; for(var j=0;j<rows[i].length;j++){ var ch=rows[i][j]; if(ch==='"'){ if(inQ && rows[i][j+1]==='"') j++; else inQ=!inQ; continue; } if(ch==='\t' && !inQ) tc++; else if(ch===',' && !inQ) cc++; } } return tc>=cc ? '\t' : ','; }

    window.showCSVPreview = function(errors,formatType){
      if(csvRows.length===0){toast('No valid rows! Errors: '+errors.length,'error');return}
      var groups={};

      if(errors.length>0) {
        h+='<p style="color:#f59e0b;font-size:.7rem;">⚠️ '+errors.length+' skipped due to empty/invalid fields.</p>';
        h+='<button class="btn btn-orange btn-sm notranslate" onclick="window.downloadSkipped()">📥 Download Skipped Rows</button><br><br>';

      h+='<button class="btn btn-green btn-sm notranslate" onclick="window.uploadCSVToFB()">🚀 Upload '+csvRows.length+' Qs</button> <button class="btn btn-dark btn-sm notranslate" onclick="window.clearCSVData()">🗑 Clear</button><div id="csvUploadStatus" style="margin-top:6px;font-size:.75rem;"></div></div>';

    window.uploadCSVToFB = async function(){
      if(!csvRows||csvRows.length===0)return;
      var st=document.getElementById('csvUploadStatus');
      st.innerHTML='<span class="spinner"></span> Preparing Upload...';

      var groups={};
      for(var i=0;i<csvRows.length;i++){
        var r=csvRows[i];
        if(!groups[r.key])groups[r.key]=[];
        groups[r.key].push({
          question:r.question,
          options:{A:r.optionA,B:r.optionB,C:r.optionC||'',D:r.optionD||''},
          correctAnswer:r.correctAnswer,
          group:r.group,
          stage:r.stage,
          subject:r.subject,
          topic:r.topic,
          explanation:r.explanation||'',
          order:Date.now()
        });
      }

      var gKeys = Object.keys(groups);
      var done = 0, failed = 0;

      for(var j=0; j<gKeys.length; j++){
        var k = gKeys[j];
        var newQs = groups[k];
        st.innerHTML='<span class="spinner"></span> Uploading Group '+(j+1)+' of '+gKeys.length+'...';
        try {
          var existingQs = await fetchDB('appsc_qb_' + k) || [];
          newQs.forEach(function(q){
            var sig = q.question+'|'+q.options.A+'|'+q.options.B;
            if(!existingQs.some(function(x){ return (x.question||'')+'|'+((x.options&&x.options.A)||'')+'|'+((x.options&&x.options.B)||'') === sig })){
              existingQs.push(q);
            }
          });
          await saveDB('appscQuestionBank/' + k, existingQs);
          done++;
        } catch (err) {
          console.error("Upload failed for group:", k, err);
          failed++;
        }
      }

      if(failed > 0){ st.innerHTML='<span style="color:#ef4444;">⚠️ Uploaded '+done+', Failed '+failed+' groups.</span>'; }
      else { st.innerHTML='<span style="color:#22c55e;">✅ Done! Uploaded to '+done+' groups.</span>'; toast('Upload Complete!','success'); setTimeout(function(){window.clearCSVData();window.refreshUI()}, 1500); }
    }

      Object.keys(users).forEach(function(ph) {
        var u = users[ph];
        h += '<div class="card"><strong>📱 ' + sanitizeHTML(ph) + '</strong> | Subjects: ' + (u.subjects || []).join(', ') + '<br><button class="btn btn-blue btn-xs" onclick="window.editUser(\'' + escHTML(ph) + '\')">✏️</button> <button class="btn btn-red btn-xs" onclick="window.deleteUser(\'' + escHTML(ph) + '\')">🗑</button></div>';
      });
      h += '<div id="userEditForm" style="display:none;"></div>';
      ac.innerHTML = h;
    }

    window.showAddUser = function() {
      var ef = document.getElementById('userEditForm'); ef.style.display = 'block';
      ef.innerHTML = '<div class="card"><h3>➕ Add User</h3><input id="uf-phone" class="form-inp" placeholder="Phone/ID"><input id="uf-pass" class="form-inp" placeholder="Password"><label>Subjects:</label><div class="checkbox-group">' + APPSC_SUBJECTS.map(function(s) { return '<label class="checkbox-label"><input type="checkbox" value="' + s + '" class="uf-subs" checked> ' + s + '</label>'; }).join('') + '</div><button class="btn btn-green btn-sm" onclick="window.saveUser(null)">💾 Save</button> <button class="btn btn-dark btn-sm" onclick="document.getElementById(\'userEditForm\').style.display=\'none\'">❌ Cancel</button></div>';
    }

    window.editUser = function(phone) {
      var u = settings.users[phone]; if (!u) return;
      var ef = document.getElementById('userEditForm'); ef.style.display = 'block';
      ef.innerHTML = '<div class="card"><h3>✏️ Edit ' + sanitizeHTML(phone) + '</h3><input id="uf-phone" class="form-inp" value="' + escHTML(phone) + '" readonly><input id="uf-pass" class="form-inp" value="' + escHTML(u.pass || '') + '"><label>Subjects:</label><div class="checkbox-group">' + APPSC_SUBJECTS.map(function(s) { return '<label class="checkbox-label"><input type="checkbox" value="' + s + '" class="uf-subs" ' + (u.subjects && u.subjects.indexOf(s) !== -1 ? 'checked' : '') + '> ' + s + '</label>'; }).join('') + '</div><button class="btn btn-green btn-sm" onclick="window.saveUser(\'' + escHTML(phone) + '\')">💾 Update</button> <button class="btn btn-dark btn-sm" onclick="document.getElementById(\'userEditForm\').style.display=\'none\'">❌ Cancel</button></div>';
    }

    window.saveUser = async function(orig) {
      var phone = document.getElementById('uf-phone').value, pass = document.getElementById('uf-pass').value, subs = [];
      document.querySelectorAll('.uf-subs:checked').forEach(function(c) { subs.push(c.value); });
      if (!phone || !pass) { toast('Fill all fields', 'error'); return; }
      settings.users[phone] = { pass: pass, modes: ['ALL'], subjects: subs, classes: ['ALL'] };
      toast('Saved!', 'success'); document.getElementById('userEditForm').style.display = 'none'; window.renderUsers();
    }

    window.deleteUser = async function(phone) {
      if (!confirm('Delete ' + phone + '?')) return;
      delete settings.users[phone];
      toast('Deleted!', 'success'); window.renderUsers();
    }

    window.renderSettings = function() {
      var ac = document.getElementById('admin-content');
      ac.innerHTML = '<div class="card"><h3>⚙️ Settings</h3><label class="checkbox-label"><input type="checkbox" id="set-login" ' + (settings.loginEnabled ? 'checked' : '') + '> Enable Login</label><br><br><label class="checkbox-label"><input type="checkbox" id="set-copy" ' + (settings.copyEnabled ? 'checked' : '') + '> Enable Copy</label><br><br><label>Admin Password</label><input id="set-admin-pass" class="form-inp" value="' + escHTML(settings.adminPass || DEFAULT_ADMIN_PASS) + '" style="max-width:300px;"><br><button class="btn btn-green btn-sm" onclick="window.saveSettings()">💾 Save</button></div>';
    }

    window.saveSettings = async function() {
      var le = document.getElementById('set-login').checked, ce = document.getElementById('set-copy').checked, ap = document.getElementById('set-admin-pass').value;
      settings.loginEnabled = le; settings.adminPass = ap; settings.copyEnabled = ce;
      window.applyCopyProtectionState(); toast('Saved!', 'success');
    }

    // Initialize application workflow instantly!
    async function initApp() {
      window.applyCopyProtectionState();
      window.refreshUI();
    }
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
  <script src="/footer.js"></script>
  <script src="/global-navbar.js"></script>
</body>
</html>
