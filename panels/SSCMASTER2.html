  <script>
    // ============ VERCEL KV API HELPERS ============
async function fetchDB(key) {
      try {
        const res = await fetch(`/api/db?key=${encodeURIComponent(key)}`);
        if (!res.ok) return null;
        let data = await res.json();
        
        // 1. Unwrap Vercel REST API wrappers ('value' or 'result')
        if (data && typeof data === 'object') {
          if ('result' in data) data = data.result;
          else if ('value' in data) data = data.value;
        }
        
        // 2. Parse stringified JSON if Vercel returned it as a text string
        if (typeof data === 'string') {
          try { 
            data = JSON.parse(data); 
          } catch (e) { 
            console.warn(`Data for ${key} is a string but not valid JSON.`); 
          }
        }
        
        // 3. 🚨 THE NEW FIX: Auto-Unwrap Firebase Double-Nesting 🚨
        // If the imported JSON kept the root folder name, we unwrap it automatically.
        if (data && typeof data === 'object' && data[key]) {
            console.log(`⚠️ Auto-unwrapped double-nested Firebase data for: ${key}`);
            data = data[key]; 
        }

        // 4. Fix Firebase Object-to-Array conversion (numbered keys to arrays)
        if (data && typeof data === 'object' && !Array.isArray(data)) {
           if (key === 'sscQuestionBank') {
             Object.keys(data).forEach(groupKey => {
               if (data[groupKey] && typeof data[groupKey] === 'object' && !Array.isArray(data[groupKey])) {
                 data[groupKey] = Object.values(data[groupKey]); // Convert {0: {...}, 1: {...}} to [...]
               }
             });
           }
        }
        
        console.log(`✅ Final processed data for ${key}:`, data);
        return data;
      } catch (err) {
        console.error(`❌ DB Fetch Error for ${key}:`, err);
        return null;
      }
    }
    async function saveDB(key, value) {
      try {
        await fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value })
        });
      } catch (err) {
        console.error("DB Save Error:", err);
      }
    }

    // ============ GLOBAL STATE & CONFIG ============
    window.googleTranslateElementInit=function(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'te,hi,ta,ml,kn,en',layout:google.translate.TranslateElement.InlineLayout.HORIZONTAL,autoDisplay:true},'google_translate_element');var ci=setInterval(function(){var gc=document.querySelector('.goog-te-combo');if(gc){clearInterval(ci);gc.addEventListener('change',function(){var ls=document.getElementById('lang-select');if(ls&&this.value!==ls.value)ls.value=this.value})}},300)};
    function changeLanguage(l){var ls=document.getElementById('lang-select');ls.style.animation='none';ls.offsetHeight;ls.style.animation='redBlink 0.3s ease-in-out 5';var gc=document.querySelector('.goog-te-combo');if(gc){gc.value=l;gc.dispatchEvent(new Event('change',{bubbles:true}));var ns=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set;ns.call(gc,l);setTimeout(function(){ls.style.animation='redBlink 1s ease-in-out infinite'},1800)}}

    var DEFAULT_ADMIN_ID='admin',DEFAULT_ADMIN_PASS='admin123',DEFAULT_GUEST_ID='guest',DEFAULT_GUEST_PASS='guest123';
    var adminPhone='',adminToken='';
    var settings={loginEnabled:true,users:{},adminPass:DEFAULT_ADMIN_PASS,copyEnabled:false,guestAutoLogin:false,guestId:DEFAULT_GUEST_ID,guestPass:DEFAULT_GUEST_PASS};
    var activeSessions={},currentTab='quiz';
    var allData={syllabus:{},quiz:{}},csvRows=[],selectedItems={};
    var currentFilters={subject:'ALL',subSubject:'ALL',topic:'ALL',subTopic:'ALL',sort:'manual'};
    var draggedItem=null,draggedKey=null,draggedIndex=null;window.answersVisible=false;

    // Fixed default hierarchy (will be overwritten if Vercel KV has data)
    var SSC_HIERARCHY={
      'Reasoning & Intelligence':{ 'Verbal Reasoning':{ 'Analogy':['Number Analogy','Letter Analogy','Word Analogy'] } },
      'Quantitative Aptitude':{ 'Arithmetic':{ 'Number System':['Types','Divisibility'] } }
    };

    function getMainSubjects(){return Object.keys(SSC_HIERARCHY)}
    function getSubSubjects(main){var d=SSC_HIERARCHY[main];return d?Object.keys(d):[]}
    function getTopics(main,sub){var d=SSC_HIERARCHY[main];if(!d)return[];var s=d[sub];return s?Object.keys(s):[]}
    function getSubTopics(main,sub,topic){var d=SSC_HIERARCHY[main];if(!d)return[];var s=d[sub];if(!s)return[];var t=s[topic];return (t&&Array.isArray(t))?t:['General']}
    function getSavedSubSubject(item){return item.subSubject||item.subsubject||''}
    function getSavedTopic(item){return item.topic||''}
    function getSavedSubTopic(item){return item.subTopic||item.subtopic||item.subSubSubject||item.subsubsubject||''}

    async function saveHierarchy(){
      await saveDB('sscHierarchy', SSC_HIERARCHY);

    function smartParse(text,sourceName){if(!text||typeof text!=='string'){toast('Invalid data!','error');return}var rows=parseCSVRows(text);if(rows.length<2){toast('Need header + data rows. Found: '+rows.length,'error');return}var delimiter=detectDelimiter(rows);var headers=smartSplitLine(rows[0],delimiter);var colMap={subject:-1,subSubject:-1,topic:-1,subTopic:-1,question:-1,optA:-1,optB:-1,optC:-1,optD:-1,correct:-1,explanation:-1};for(var hi=0;hi<headers.length;hi++){var hdr=headers[hi].toLowerCase().replace(/[\s_-]/g,'');if(hdr==='subject'||hdr==='mainsubject')colMap.subject=hi;else if(hdr==='subsubject'||hdr==='sub-subject')colMap.subSubject=hi;else if(hdr==='topic')colMap.topic=hi;else if(hdr==='subtopic'||hdr==='sub-topic')colMap.subTopic=hi;else if(hdr==='question'||hdr==='ques'||hdr==='q')colMap.question=hi;else if(hdr==='optiona'||hdr==='opta'||hdr==='a')colMap.optA=hi;else if(hdr==='optionb'||hdr==='optb'||hdr==='b')colMap.optB=hi;else if(hdr==='optionc'||hdr==='optc'||hdr==='c')colMap.optC=hi;else if(hdr==='optiond'||hdr==='optd'||hdr==='d')colMap.optD=hi;else if(hdr==='correct'||hdr==='answer'||hdr==='ans')colMap.correct=hi;else if(hdr==='explanation'||hdr==='exp')colMap.explanation=hi;}if(colMap.subject===-1&&headers.length>1)colMap.subject=1;if(colMap.subSubject===-1&&headers.length>2)colMap.subSubject=2;if(colMap.topic===-1&&headers.length>3)colMap.topic=3;if(colMap.subTopic===-1&&headers.length>4)colMap.subTopic=4;if(colMap.question===-1&&headers.length>5)colMap.question=5;if(colMap.optA===-1&&headers.length>6)colMap.optA=6;if(colMap.optB===-1&&headers.length>7)colMap.optB=7;if(colMap.correct===-1&&headers.length>8)colMap.correct=8;if(colMap.explanation===-1&&headers.length>9)colMap.explanation=9;csvRows=[];var errors=[];for(var l=1;l<rows.length;l++){var cols=smartSplitLine(rows[l],delimiter);if(cols.length<7){errors.push('Row '+(l+1)+': too few columns');continue}var subject=getCol(cols,colMap.subject)||'General',subSubject=getCol(cols,colMap.sub     function parseCSVRows(text){var rows=[],current='',inQuotes=false;for(var i=0;i<text.length;i++){var ch=text[i];if(inQuotes&&ch==='"'&&i+1<text.length&&text[i+1]==='"'){current+='""';i++;continue;}if(ch==='"'){inQuotes=!inQuotes;current+=ch;continue;}if(ch==='\n'&&!inQuotes){if(current.trim())rows.push(current.trim());current='';continue;}if(ch==='\r'&&!inQuotes){if(current.trim())rows.push(current.trim());current='';if(i+1<text.length&&text[i+1]==='\n')i++;continue;}current+=ch;}if(current.trim())rows.push(current.trim());return rows;}
    function detectDelimiter(rows){var tc=0,cc=0;for(var i=0;i<Math.min(5,rows.length);i++){var inQ=false;for(var j=0;j<rows[i].length;j++){var ch=rows[i][j];if(inQ&&ch==='"'&&rows[i][j+1]==='"'){j++;continue;}if(ch==='"'){inQ=!inQ;continue;}if(ch==='\t'&&!inQ)tc++;else if(ch===','&&!inQ)cc++;}}return tc>=cc?'\t':',';}

    window.uploadCSVToFB = async function(){
      if(!csvRows||csvRows.length===0)return;
      var st=document.getElementById('csvUploadStatus');
      st.innerHTML='<span class="spinner"></span> Uploading...';
      
      var groups={};
      for(var i=0;i<csvRows.length;i++){
        var r=csvRows[i];
        if(!groups[r.key])groups[r.key]=[];
        if(!SSC_HIERARCHY[r.subject])SSC_HIERARCHY[r.subject]={};
        if(!SSC_HIERARCHY[r.subject][r.subSubject])SSC_HIERARCHY[r.subject][r.subSubject]={};
        if(!SSC_HIERARCHY[r.subject][r.subSubject][r.topic])SSC_HIERARCHY[r.subject][r.subSubject][r.topic]=['General'];
        if(r.subTopic&&SSC_HIERARCHY[r.subject][r.subSubject][r.topic].indexOf(r.subTopic)===-1)SSC_HIERARCHY[r.subject][r.subSubject][r.topic].push(r.subTopic);
        
        groups[r.key].push({
          question:r.question,
          options:{A:r.optionA,B:r.optionB,C:r.optionC||'',D:r.optionD||''},
          correctAnswer:r.correctAnswer,
          subject:r.subject,
          subSubject:r.subSubject,
          topic:r.topic,
          subTopic:r.subTopic||'',
          subSubSubject:r.subTopic||'',
          explanation:r.explanation||'',
          order:Date.now()
        });
      }
      
      await saveHierarchy();
      
      var qb = await fetchDB('sscQuestionBank') || {};
      var gKeys = Object.keys(groups);
      var done = 0;
      
      for(var j=0; j<gKeys.length; j++){
        var k = gKeys[j];
        var qs = groups[k];
        if(!qb[k]) qb[k] = [];
        
        qs.forEach(function(q){
           var sig = q.question+'|'+q.options.A+'|'+q.options.B+'|'+q.options.C+'|'+q.options.D;
           if(!qb[k].some(function(x){
              return (x.question||'')+'|'+((x.options&&x.options.A)||'')+'|'+((x.options&&x.options.B)||'')+'|'+((x.options&&x.options.C)||'')+'|'+((x.options&&x.options.D)||'') === sig
           })){
             qb[k].push(q);
           }
        });
        done++;
      }
      
      await saveDB('sscQuestionBank', qb);
      allData.quiz = qb;
      
      st.innerHTML='<span style="color:#22c55e;">✅ Done! Uploaded to '+done+' groups.</span>';
      toast('Upload Complete!','success');
      setTimeout(function(){clearCSVData();refreshUI()}, 1500);
    }

      renderUsers();
    }
    
    function renderSettings(){var ac=document.getElementById('admin-content'),cp=settings.adminPass||DEFAULT_ADMIN_PASS,gid=settings.guestId||DEFAULT_GUEST_ID,gpass=settings.guestPass||DEFAULT_GUEST_PASS;ac.innerHTML='<div class="card"><h3>⚙️ Settings</h3><div class="toggle-setting-row"><span class="toggle-label">🔐 Enable Login</span><div class="toggle-right"><label class="toggle-switch"><input type="checkbox" id="set-login" '+(settings.loginEnabled?'checked':'')+' onchange="updateSettingToggle(\'login\')"><span class="toggle-slider"></span></label><span id="login-status">'+(settings.loginEnabled?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span></div></div><div class="toggle-setting-row"><span class="toggle-label">📋 Enable Copy</span><div class="toggle-right"><label class="toggle-switch"><input type="checkbox" id="set-copy" '+(settings.copyEnabled?'checked':'')+' onchange="updateSettingToggle(\'copy\')"><span class="toggle-slider"></span></label><span id="copy-status">'+(settings.copyEnabled?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span></div></div><div class="toggle-setting-row"><span class="toggle-label">👤 Guest Auto Login</span><div class="toggle-right"><label class="toggle-switch"><input type="checkbox" id="set-guest-auto" '+(settings.guestAutoLogin?'checked':'')+' onchange="updateSettingToggle(\'guestAuto\')"><span class="toggle-slider"></span></label><span id="guestAuto-status">'+(settings.guestAutoLogin?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span></div></div><div class="form-group"><label>Guest ID</label><input id="set-guest-id" class="form-inp" value="'+escapeAttr(gid)+'" style="max-width:250px;"></div><div class="form-group"><label>Guest Password</label><input id="set-guest-pass" class="form-inp" value="'+escapeAttr(gpass)+'" style="max-width:250px;"></div><div class="form-group"><label>Admin Password</label><input id="set-admin-pass" class="form-inp" value="'+escapeAttr(cp)+'" style="max-width:250px;"></div><button class="btn btn-green btn-sm notranslate" onclick="saveSettings()">💾 Save</button> <button class="btn btn-orange btn-sm notranslate" onclick="resetAdmin()">🔄 Reset Admin</button> <button class="btn btn-teal btn-sm notranslate" onclick="resetGuest()">🔄 Reset Guest</button></div>'}
    window.updateSettingToggle = function(type){var cb,se;if(type==='login'){cb=document.getElementById('set-login');se=document.getElementById('login-status')}else if(type==='copy'){cb=document.getElementById('set-copy');se=document.getElementById('copy-status')}else{cb=document.getElementById('set-guest-auto');se=document.getElementById('guestAuto-status')}if(cb&&se)se.innerHTML=cb.checked?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>'}
    
    window.saveSettings = async function(){
      var le=document.getElementById('set-login').checked,ce=document.getElementById('set-copy').checked,ga=document.getElementById('set-guest-auto').checked,ap=document.getElementById('set-admin-pass').value,gid=document.getElementById('set-guest-id').value,gpass=document.getElementById('set-guest-pass').value;
      if(!ap||!gid||!gpass){toast('All fields required','error');return}
      
      settings.loginEnabled=le;settings.adminPass=ap;settings.copyEnabled=ce;
      settings.guestAutoLogin=ga;settings.guestId=gid;settings.guestPass=gpass;
      
      await saveDB('appSettings', settings);
      
      if(ce)document.body.classList.remove('protected-mode');
      else document.body.classList.add('protected-mode');
      updateGuestDisplay();
      checkAuth();
      toast('Saved!','success');
    }
    
    window.resetAdmin = async function(){
      if(!confirm('Reset?'))return;
      settings.adminPass=DEFAULT_ADMIN_PASS;
      await saveDB('appSettings', settings);
      toast('Reset!','success');
      renderSettings();
    }
    
    window.resetGuest = async function(){
      if(!confirm('Reset?'))return;
      settings.guestId=DEFAULT_GUEST_ID;
      settings.guestPass=DEFAULT_GUEST_PASS;
      await saveDB('appSettings', settings);
      updateGuestDisplay();
      toast('Reset!','success');
      renderSettings();
    }

    // Initialize application workflow
    async function initApp(){
      const [hier, sets, sess] = await Promise.all([
        fetchDB('sscHierarchy'),
        fetchDB('appSettings'),
        fetchDB('activeSessions')
      ]);
      
      if(hier) SSC_HIERARCHY = hier;
      
      if(sets) {
         settings.loginEnabled=sets.loginEnabled!==undefined?sets.loginEnabled:true;
         settings.copyEnabled=sets.copyEnabled!==undefined?sets.copyEnabled:false;
         settings.users=sets.users||{};
         settings.adminPass=sets.adminPass||DEFAULT_ADMIN_PASS;
         settings.guestAutoLogin=sets.guestAutoLogin!==undefined?sets.guestAutoLogin:false;
         settings.guestId=sets.guestId||DEFAULT_GUEST_ID;
         settings.guestPass=sets.guestPass||DEFAULT_GUEST_PASS;
      }
      
      if(settings.copyEnabled) document.body.classList.remove('protected-mode');
      else document.body.classList.add('protected-mode');
      
      if(sess) activeSessions = sess;
      
      checkAuth();
    }
    window.onload=initApp;
  </script>
</body>
</html>
