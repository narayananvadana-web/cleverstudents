<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clever Students | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"></noscript>
  <style>
    :root{--bg:#080c14;--srf:#161b27;--brd:rgba(255,255,255,.1);--txt:#e2e8f0;--mut:#94a3b8;--font:'Nunito',sans-serif;--r-lg:16px;--r-md:8px;--r-sm:4px}
    body.light-mode{--bg:#f8fafc;--srf:#fff;--txt:#0f172a;--brd:rgba(0,0,0,.1);--mut:#64748b}
    *,::before,::after{margin:0;padding:0;box-sizing:border-box}
    html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;background:var(--bg)!important;overflow-x:hidden!important}
    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;transition:background .3s,color .3s}
    .protected-mode,.protected-mode *{user-select:none!important;-webkit-user-select:none!important}
    input,textarea,select{user-select:auto!important;-webkit-user-select:auto!important}
    #editForm,#editForm *,#groupView,#groupView *{user-select:auto!important}
    #editForm input,#editForm textarea,#editForm select{cursor:text!important}

    .top-bar{background:var(--srf);border-bottom:1px solid var(--brd);padding:0 15px;position:sticky;top:0;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5)}
    body.light-mode .top-bar{box-shadow:0 4px 20px rgba(0,0,0,.05)}
    .top-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:12px 0;justify-content:space-between}
    .logo{font-family:'Fredoka One',cursive;font-size:1.5rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0}
    .theme-btn{background:var(--bg);color:var(--txt);border:1px solid var(--brd);font-weight:700;font-size:.85rem;cursor:pointer;padding:6px 12px;border-radius:50px;font-family:var(--font)}
    .btn{padding:10px 20px;border:none;border-radius:50px;cursor:pointer;font-weight:800;color:#fff;font-family:var(--font);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
    .btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
    .btn-blue{background:#3b82f6}.btn-green{background:#10b981}.btn-red{background:#ef4444}.btn-dark{background:#334155}.btn-orange{background:#f59e0b}.btn-teal{background:#0d9488}.btn-purple{background:#8b5cf6}.btn-pink{background:#ec4899}
    .btn-sm{padding:6px 14px;font-size:.8rem}.btn-xs{padding:4px 10px;font-size:.7rem}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .main-wrap{max-width:100%!important;width:100%!important;padding:20px 10px 80px!important;margin:0 auto}
    .shell{background:var(--srf);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--brd);width:100%;max-width:1400px;margin:0 auto}
    .banner{padding:12px 20px!important;display:flex;align-items:center;justify-content:center;gap:15px;min-height:auto!important;box-shadow:0 4px 10px rgba(0,0,0,.2);flex-wrap:wrap;text-align:center}
    .banner h1{font-size:1.4rem!important;font-weight:900!important;margin-bottom:0!important;display:inline-block;color:#fff!important}
    .banner p{font-size:.95rem!important;font-weight:700!important;display:inline-block;color:#fff!important;border-left:2px solid rgba(255,255,255,.6);padding-left:12px;margin-top:0}

    .admin-tabs{display:flex;gap:6px;padding:12px 15px;background:rgba(0,0,0,.15);border-bottom:1px solid var(--brd);flex-wrap:wrap;justify-content:center;overflow-x:auto}
    .admin-tab-btn{padding:8px 18px;border-radius:50px;border:1px solid var(--brd);background:0 0;color:var(--mut);font-weight:700;font-size:.85rem;cursor:pointer;font-family:var(--font);transition:.2s;white-space:nowrap}
    .admin-tab-btn:hover{color:var(--txt);border-color:var(--txt)}
    .admin-tab-btn.active{background:#ef4444;color:#fff;border-color:#ef4444;box-shadow:0 2px 8px rgba(239,68,68,.4)}
    .admin-tab-btn.bulk-master-btn{border-color:#10b981;color:#34d399}
    .admin-tab-btn.bulk-master-btn.active{background:linear-gradient(135deg,#10b981,#0ea5e9);color:#fff;border-color:#10b981;box-shadow:0 2px 12px rgba(16,185,129,.45)}

    .admin-content{padding:20px;background:var(--srf)}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-weight:700;margin-bottom:6px;color:var(--txt);font-size:.9rem}
    .form-inp{width:100%;padding:12px 16px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:8px;font-family:var(--font);color:var(--txt);font-size:.95rem;outline:0;margin-bottom:10px}
    textarea.form-inp{min-height:80px;resize:vertical}
    select.form-inp{appearance:none;cursor:pointer}
    .card{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:var(--r-md);padding:20px;margin-bottom:16px}
    body.light-mode .card{background:#f8fafc;border-color:#e2e8f0}.card h3{margin-bottom:15px;font-size:1.1rem}
    .csv-box{background:rgba(14,165,233,.08);border:2px dashed #0ea5e9;border-radius:var(--r-md);padding:20px;margin-bottom:20px}.csv-box h3{color:#38bdf8}
    .bulk-all-box{background:rgba(16,185,129,.08);border:2px dashed #10b981;border-radius:var(--r-md);padding:22px;margin-bottom:20px}
    .bulk-all-box h3{color:#34d399;margin-bottom:10px;font-size:1.25rem}
    .csv-fmt{background:rgba(0,0,0,.3);border-radius:8px;padding:12px;font-size:.75rem;color:var(--mut);line-height:1.6;margin:12px 0;overflow-x:auto;white-space:pre;font-family:monospace}
    .fmt-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:800;margin:2px;background:rgba(14,165,233,.15);color:#38bdf8;border:1px solid rgba(14,165,233,.4)}
    .dropzone{border:2px dashed #0ea5e9;border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;background:rgba(14,165,233,.05);transition:.2s;margin-bottom:12px}
    .dropzone:hover,.dropzone.over{background:rgba(14,165,233,.15);border-color:#38bdf8}
    .dropzone .dz-icon{font-size:2rem}
    .dropzone small{color:var(--mut)}
    .upload-steps{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0}
    .upload-pv-table{width:100%;border-collapse:collapse;font-size:.72rem}
    .upload-pv-table th,.upload-pv-table td{border:1px solid var(--brd);padding:6px 8px;text-align:left;word-break:break-word;max-width:220px}
    .upload-pv-table th{background:rgba(0,0,0,.3);color:#60a5fa}

    .nested-sub{display:none;padding-left:16px}
    .nested-sub.show{display:block}
    .nested-list{border-left:2px solid var(--brd);margin-left:6px;padding-left:12px}
    .nested-row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;margin:8px 0 0;color:#fff;font-weight:800;border-radius:6px;cursor:pointer;font-size:.9rem}
    .nested-row.sub{background:rgba(255,255,255,.08)!important;font-weight:700}
    .nested-row.sub2{background:rgba(255,255,255,.05)!important;font-weight:600;font-size:.85rem}

    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px;padding:12px;background:rgba(0,0,0,.2);border-radius:8px;border:1px solid var(--brd)}
    .toolbar select{min-width:180px}

    .list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:8px;margin-bottom:8px;flex-wrap:wrap;gap:10px;transition:.2s;cursor:grab}
    .list-item:hover{border-color:#3b82f6}.list-item.selected{background:rgba(59,130,246,.15);border-color:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.3)}
    .list-item.dragging{opacity:0.5;background:rgba(59,130,246,.3);border-color:#3b82f6;cursor:grabbing}
    .list-item.drag-over{border-color:#10b981;background:rgba(16,185,129,.15);box-shadow:0 0 12px rgba(16,185,129,.4)}
    .list-item .item-info{flex:1;min-width:200px;pointer-events:none}
    .list-item .item-actions{display:flex;gap:6px;pointer-events:auto}
    .drag-handle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;cursor:grab;color:var(--mut);font-size:1.2rem;border-radius:6px;transition:.2s;flex-shrink:0}
    .drag-handle:hover{color:#fff;background:rgba(255,255,255,.1)}
    .drag-handle:active{cursor:grabbing}

    .tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700;margin:2px}
    .tag-green{background:#15803d;color:#fff}.tag-red{background:#b91c1c;color:#fff}.tag-blue{background:#1d4ed8;color:#fff}.tag-orange{background:#c2410c;color:#fff}.tag-teal{background:#0d9488;color:#fff}.tag-purple{background:#7c3aed;color:#fff}
    .user-card{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:var(--r-md);padding:20px;margin-bottom:12px}

    .answer-display-box{background:rgba(34,197,94,.08);border:2px solid #22c55e;border-radius:8px;padding:14px 18px;margin-top:10px;color:#86efac;font-weight:600;line-height:1.7;font-size:.9rem}
    .answer-display-box strong{color:#4ade80}
    .quiz-group-item{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.05)}
    .quiz-group-item:last-child{border-bottom:none}

    .toggle-switch{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0}
    .toggle-switch input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#64748b;transition:.3s;border-radius:26px}
    .toggle-slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background-color:white;transition:.3s;border-radius:50%}
    input:checked+.toggle-slider{background-color:#10b981}input:checked+.toggle-slider:before{transform:translateX(22px)}

    .toggle-setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:10px;margin-bottom:12px}
    .toggle-setting-row .toggle-label{font-weight:700;font-size:.9rem;color:var(--txt)}
    .toggle-setting-row .toggle-right{display:flex;align-items:center;gap:10px}
    .toggle-status{font-size:.75rem;font-weight:800;min-width:36px;text-align:center;padding:3px 8px;border-radius:12px}
    .toggle-status.on{color:#10b981;background:rgba(16,185,129,.15)}.toggle-status.off{color:#ef4444;background:rgba(239,68,68,.15)}
    .toggle-checkbox-label{display:flex;align-items:center;gap:8px;font-size:.85rem;cursor:pointer;padding:8px 14px;background:rgba(0,0,0,.2);border:1px solid var(--brd);border-radius:20px}
    .toggle-checkbox-label:hover{border-color:#3b82f6}
    .checkbox-group{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

    .spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:20px;right:20px;padding:14px 24px;border-radius:8px;font-weight:700;z-index:99999;animation:slideIn .3s ease;color:#fff;max-width:400px}
    .toast.success{background:#15803d}.toast.error{background:#b91c1c}.toast.info{background:#1d4ed8}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

    #login-overlay{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .login-box{background:var(--srf);padding:40px 30px;border-radius:var(--r-lg);box-shadow:0 10px 30px rgba(0,0,0,.5);width:90%;max-width:380px;border:1px solid var(--brd);text-align:center}
    .login-inp{width:100%;padding:14px;margin-bottom:16px;border-radius:8px;border:1px solid var(--brd);background:rgba(0,0,0,.2);color:var(--txt);font-family:var(--font);font-size:1rem;outline:0}
    .login-info{background:rgba(59,130,246,.15);border:1px solid #3b82f6;border-radius:8px;padding:12px;margin-bottom:20px;font-size:.85rem;color:var(--txt);text-align:left;line-height:1.6}.login-info strong{color:#60a5fa}
    .info-banner{background:rgba(139,92,246,.1);border:1px solid #8b5cf6;border-radius:8px;padding:10px 16px;margin-bottom:15px;font-size:.85rem;color:#a78bfa}
    .guest-info-box{background:rgba(245,158,11,.1);border:1px solid #f59e0b;border-radius:8px;padding:12px;margin-bottom:20px;font-size:.85rem;color:var(--txt);text-align:left;line-height:1.6}.guest-info-box strong{color:#fbbf24}

    .bulk-progress-outer{width:100%;height:22px;background:rgba(0,0,0,.4);border-radius:20px;overflow:hidden;border:1px solid var(--brd);margin:10px 0}
    .bulk-progress-inner{height:100%;width:0%;background:linear-gradient(90deg,#10b981,#3b82f6);transition:width .25s ease;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#fff}

    @media(max-width:600px){.list-item{flex-direction:column;align-items:flex-start}.admin-tabs{gap:4px;padding:8px}.admin-tab-btn{padding:6px 14px;font-size:.75rem}.toolbar{flex-direction:column;align-items:stretch}}
  </style>
</head>

  <script>
    function loadSheetJS(cb){
      if(window.XLSX){cb();return}
      var s=document.createElement('script');
      s.src='https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';
      s.onload=cb;s.onerror=function(){toast('Failed to load xlsx library','error');cb()};
      document.head.appendChild(s);
    }
  </script>

  <script>
    // =========================================================================
    // PostgreSQL 32-Bit Integer Safe Order Generator (Max limit: 2,147,483,647)
    // =========================================================================
    var orderSeqOffset = 0;
    function safeOrderInt() {
      orderSeqOffset = (orderSeqOffset + 1) % 1000;
      return Math.floor(Date.now() / 1000) + orderSeqOffset;
    }

    const fallbackApiDb = {
      ref: function(path) {
        let parts = String(path || '').split('/').filter(Boolean);
        let rootKey = parts[0];
        return {
          once: async function() {
            try {
              const res = await fetch('/api/db?path=' + encodeURIComponent(rootKey));
              const data = await res.json();
              let val = data.result;
              if (typeof val === 'string') { try { val = JSON.parse(val); } catch(e) {} }
              for (let i = 1; i < parts.length; i++) {
                if (val && typeof val === 'object') { val = val[parts[i]]; }
                else { val = null; break; }
              }
              return { val: () => val };
            } catch (err) {
              console.error("DB Fetch Error:", err);
              return { val: () => null };
            }
          },
          set: async function(dataToSet) {
            if (parts.length === 1) {
              return fetch('/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'set', path: rootKey, data: dataToSet }) }).then(res => res.json());
            } else {
              const res = await fetch('/api/db?path=' + encodeURIComponent(rootKey));
              const fetched = await res.json();
              let rootObj = fetched.result || {};
              if (typeof rootObj === 'string') { try { rootObj = JSON.parse(rootObj); } catch(e) { rootObj = {}; } }
              let current = rootObj;
              for (let i = 1; i < parts.length - 1; i++) {
                if (!current[parts[i]]) current[parts[i]] = {};
                current = current[parts[i]];
              }
              current[parts[parts.length - 1]] = dataToSet;
              return fetch('/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'set', path: rootKey, data: rootObj }) }).then(res => res.json());
            }
          },
          update: async function(updatesObj) {
            if (parts.length === 1) {
              const res = await fetch('/api/db?path=' + encodeURIComponent(rootKey));
              const fetched = await res.json();
              let rootObj = fetched.result || {};
              if (typeof rootObj === 'string') { try { rootObj = JSON.parse(rootObj); } catch(e) { rootObj = {}; } }
              Object.keys(updatesObj).forEach(updPath => {
                let updParts = updPath.split('/').filter(Boolean);
                let current = rootObj;
                for (let i = 0; i < updParts.length - 1; i++) {
                  if (!current[updParts[i]]) current[updParts[i]] = {};
                  current = current[updParts[i]];
                }
                current[updParts[updParts.length - 1]] = updatesObj[updPath];
              });
              return fetch('/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'set', path: rootKey, data: rootObj }) }).then(res => res.json());
            } else {
              const res = await fetch('/api/db?path=' + encodeURIComponent(rootKey));
              const fetched = await res.json();
              let rootObj = fetched.result || {};
              if (typeof rootObj === 'string') { try { rootObj = JSON.parse(rootObj); } catch(e) { rootObj = {}; } }
              let current = rootObj;
              for (let i = 1; i < parts.length; i++) {
                if (!current[parts[i]]) current[parts[i]] = {};
                current = current[parts[i]];
              }
              Object.assign(current, updatesObj);
              return fetch('/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'set', path: rootKey, data: rootObj }) }).then(res => res.json());
            }
          },
          remove: async function() {
            if (parts.length === 1) {
              return fetch('/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'remove', path: rootKey }) }).then(res => res.json());
            } else {
              const res = await fetch('/api/db?path=' + encodeURIComponent(rootKey));
              const fetched = await res.json();
              let rootObj = fetched.result || {};
              if (typeof rootObj === 'string') { try { rootObj = JSON.parse(rootObj); } catch(e) { rootObj = {}; } }
              let current = rootObj;
              for (let i = 1; i < parts.length - 1; i++) {
                if (!current[parts[i]]) return;
                current = current[parts[i]];
              }
              delete current[parts[parts.length - 1]];
              return fetch('/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'set', path: rootKey, data: rootObj }) }).then(res => res.json());
            }
          },
          push: function() {
            const newKey = 'item_' + safeOrderInt() + '_' + Math.random().toString(36).substr(2, 5);
            const pushPath = path + (path.endsWith('/') ? '' : '/') + newKey;
            return {
              key: newKey,
              set: function(data) {
                return fallbackApiDb.ref(pushPath).set(data);
              }
            };

    function normalizeSubjectName(subTxt){
      if(!subTxt)return null;

      var clean=String(subTxt).toUpperCase().replace(/[^A-Z]/g,'');
      if(subMap[clean])return subMap[clean];

    function extractClassNumber(clsTxt){
      if(clsTxt===undefined||clsTxt===null)return null;
      var s=String(clsTxt);
      var m=s.match(/(?:class|grade|std)[_\-\s]*(\d{1,2})/i) || s.match(/(\d{1,2})/);
      if(m){var n=parseInt(m[1],10);if(n>=1&&n<=10)return n;}
      var tMap={'ONE':1,'TWO':2,'THREE':3,'FOUR':4,'FIVE':5,'SIX':6,'SEVEN':7,'EIGHT':8,'NINE':9,'TEN':10};
      var up=s.toUpperCase();
      for(var tk in tMap){if(up.indexOf(tk)!==-1)return tMap[tk];}
      return null;
    }

    function cleanExtractedTitle(rawTitle){
      if(!rawTitle)return '';

        .replace(/<[^>]*>/g,' ')
        .replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'')
        .replace(/Interactive FA-1 Question Papers:\s*/ig,'')
        .replace(/Comprehensive Chapter Assessment:\s*/ig,'')
        .replace(/10 Awesome (At-Home Science|Practical) Projects:\s*/ig,'')
        .replace(/Practical Activities & Projects:\s*/ig,'')
        .replace(/—\s*(Master Mind Map|Interactive Game Arcade!?|Interactive Learning Games)/ig,'')
        .replace(/:\s*Rapid Sorter!?/ig,'')
        .replace(/\(\s*Class\s*\d+[^)]*\)/ig,'')
        .replace(/!+$/,'')
        .replace(/\s+/g,' ')
        .trim();
      if(!t||/^ready\??$/i.test(t)||/^untitled$/i.test(t))return '';
      return t;
    }

    // Tries all adapter methods AND verifies data actually persisted in DB!
    // =========================================================================
    async function verifyQuizSavedInDb(groupKey, expectedMinLen) {
      try {
        var snap = await db.ref('questionBank').once('value');
        var val = snap ? snap.val() : null;
        if (typeof val === 'string') { try { val = JSON.parse(val); } catch(e) { val = {}; } }
        if (val && Array.isArray(val[groupKey]) && val[groupKey].length >= expectedMinLen) {
          allData.quiz = val;
          return true;
        }
      } catch (e) {}
      return false;
    }

    async function saveUniversalQuizGroup(groupKey, newQuestions, mode) {
      var currentAllQuiz = (allData && allData.quiz && typeof allData.quiz === 'object') ? JSON.parse(JSON.stringify(allData.quiz)) : {};
      try {
        var snap = await db.ref('questionBank').once('value');
        var val = snap ? snap.val() : null;
        if (typeof val === 'string') { try { val = JSON.parse(val); } catch(e) { val = {}; } }
        if (val && typeof val === 'object') currentAllQuiz = val;
      } catch (e) {}

      // Remove any accidental 'Undefined' keys if present
      delete currentAllQuiz['undefined'];

      var existing = Array.isArray(currentAllQuiz[groupKey]) ? currentAllQuiz[groupKey] : [];
      var finalArr = (mode === 'replace') ? newQuestions : existing.concat(newQuestions);
      currentAllQuiz[groupKey] = finalArr;
      if (allData) allData.quiz = currentAllQuiz;

      // Method 1: Root-level db.ref('questionBank').set(currentAllQuiz)
      try {
        await db.ref('questionBank').set(currentAllQuiz);
        if (await verifyQuizSavedInDb(groupKey, finalArr.length)) return finalArr.length;
      } catch (e1) { console.warn('Method 1 (root set) failed:', e1); }

      // Method 2: Child-level db.ref('questionBank/' + groupKey).set(finalArr)
      try {
        await db.ref('questionBank/' + groupKey).set(finalArr);
        if (await verifyQuizSavedInDb(groupKey, finalArr.length)) return finalArr.length;
      } catch (e2) { console.warn('Method 2 (child set) failed:', e2); }

      // Method 3: Root-level db.ref('questionBank').update({ [groupKey]: finalArr })
      try {
        await db.ref('questionBank').update({ [groupKey]: finalArr });
        if (await verifyQuizSavedInDb(groupKey, finalArr.length)) return finalArr.length;
      } catch (e3) { console.warn('Method 3 (root update) failed:', e3); }

      // Method 4: Push each question via db.ref('questionBank').push() if adapter treats questionBank like a table
      try {
        var nr = db.ref('questionBank').push();
        if (nr && typeof nr.set === 'function') {
          await nr.set({
            key: groupKey,
            title: groupKey,
            class: newQuestions[0].class,
            subject: newQuestions[0].subject,
            chapter: newQuestions[0].chapter,
            questions: finalArr,
            order: safeOrderInt()
          });
          if (await verifyQuizSavedInDb(groupKey, 1)) return finalArr.length;
        }
      } catch (e4) { console.warn('Method 4 (push) failed:', e4); }

      // Method 5: Direct '/api/db' endpoint
      try {
        await fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'set', path: 'questionBank', data: currentAllQuiz })
        });
        if (await verifyQuizSavedInDb(groupKey, finalArr.length)) return finalArr.length;
      } catch (e5) { console.warn('Method 5 (/api/db) failed:', e5); }

      throw new Error('Supabase adapter rejected questionBank write. Check browser console (F12) for exact table schema.');
    }

    function detectModuleFromFileName(fname){
      var up=fname.toUpperCase();
      if(up.indexOf('PROCESSING.DONE')!==-1||up.indexOf('MASTER_DATA')!==-1||up.indexOf('_EXTRACTED')!==-1)return null;
      if(up.indexOf('QUIZ')!==-1||up.slice(-4)==='.CSV'||up.slice(-4)==='.TSV')return 'quiz';
      if(up.indexOf('THEORY')!==-1)return 'theory';
      if(up.indexOf('MIND')!==-1)return 'mindmap';
      if(up.indexOf('PAPER')!==-1)return 'papers';
      if(up.indexOf('PROJECT')!==-1)return 'projects';
      if(up.indexOf('GAME')!==-1)return 'games';
      if(up.indexOf('VIDEO')!==-1)return 'videos';
      if(up.indexOf('SKILL')!==-1)return 'skills';
      return null;
    }

    function inferMetaFromRelativePath(relPath,fileName,rawContent,modType){
      var defCls=parseInt(getVal('bulkDefClass'),10)||settings.bulkDefaultClass||9;
      var defSub=getVal('bulkDefSubject')||settings.bulkDefaultSubject||'Social';
      var defChap=getVal('bulkDefChapter')||'';

      var parts=String(relPath||'').split(/[\/\\]/).filter(Boolean);
      var detCls=null,detSub=null,detChap=null;

      for(var i=0;i<parts.length-1;i++){
        var p=parts[i];
        if(p.toLowerCase()==='final_output'||p.toLowerCase()==='segmented_5000')continue;
        if(!detCls){
          var cn=extractClassNumber(p);
          if(cn){detCls=cn;continue;}
        }
        if(!detSub){
          var sb=normalizeSubjectName(p);
          if(sb){detSub=sb;continue;}
        }
        detChap=p.replace(/_/g,' ').trim();
      }

      if(modType==='quiz'&&rawContent){
        var qRows=parseQuizRowsFromRawText(rawContent,detCls||defCls,detSub||defSub,detChap||'Chapter1');
        if(qRows.length){
          detCls=qRows[0].class||detCls;
          detSub=qRows[0].subject||detSub;
          if(qRows[0].chapter)detChap='Chapter'+String(qRows[0].chapter).replace(/^chapter\s*/i,'');
        }
      }

      if(defChap)detChap=defChap;

      if(!detChap&&rawContent&&modType!=='quiz'){
        var titleMatch=rawContent.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
        if(titleMatch&&titleMatch[1]){
          var ct=cleanExtractedTitle(titleMatch[1].replace(/-\s*(Theory|Complete Study Guide)/i,''));
          if(ct)detChap=ct;
        }
        if(!detChap){
          var headings=rawContent.match(/<h[12][^>]*>([\s\S]*?)<\/h[12]>/ig)||[];
          for(var hi=0;hi<headings.length;hi++){
            if(headings[hi].indexOf('mm-word')!==-1)continue;
            var chClean=cleanExtractedTitle(headings[hi]);
            if(chClean&&chClean.length<90){detChap=chClean;break;}
          }
        }
      }
      if(!detChap){
        var fnClean=fileName.replace(/\.[^.]+$/,'').replace(/(theory|mind_?map|papers|projects|games|quiz_?output)/ig,'').replace(/[_\-]+/g,' ').trim();
        detChap=cleanExtractedTitle(fnClean)||'Chapter1';
      }

      return {
        class:detCls||defCls,
        subject:detSub||defSub,
        chapter:cleanExtractedTitle(detChap)||'Chapter1'
      };
    }

    async function handleBulkMasterFiles(fileList){
      if(!fileList||!fileList.length)return;
      var pv=document.getElementById('bulkMasterPreview');
      pv.innerHTML='<div style="padding:20px;text-align:center;"><span class="spinner"></span> Scanning & parsing '+fileList.length+' files...</div>';

      bulkMasterQueue=[];
      var seenModKeys={};
      var sharedChapterTitle='';
      var csvDetectedSub=null,csvDetectedCls=null;

      var tempItems=[];
      for(var i=0;i<fileList.length;i++){
        var f=fileList[i];
        var mod=detectModuleFromFileName(f.name);
        if(!mod)continue;

        var text=await new Promise(function(resolve){
          var r=new FileReader();
          r.onload=function(e){resolve(e.target.result||'')};
          r.onerror=function(){resolve('')};
          r.readAsText(f);
        });
        if(!text.trim())continue;

        var rel=f.webkitRelativePath||f.name;
        var meta=inferMetaFromRelativePath(rel,f.name,text,mod);
        if(mod==='quiz'){
          csvDetectedSub=meta.subject;
          csvDetectedCls=meta.class;
        }
        if(meta.chapter&&meta.chapter!=='Chapter1'&&!sharedChapterTitle){
          sharedChapterTitle=meta.chapter;
        }
        tempItems.push({f:f,mod:mod,text:text,rel:rel,meta:meta});
      }

      for(var j=0;j<tempItems.length;j++){
        var item=tempItems[j];
        var f=item.f,mod=item.mod,text=item.text,rel=item.rel,meta=item.meta;
        if((!meta.chapter||meta.chapter==='Chapter1')&&sharedChapterTitle){
          meta.chapter=sharedChapterTitle;
        }
        if(csvDetectedSub && meta.subject==='Science' && csvDetectedSub!=='Science' && rel.indexOf('General_Science')!==-1){
          meta.subject=csvDetectedSub;
        }
        if(csvDetectedCls && !meta.class){
          meta.class=csvDetectedCls;
        }

        var ext=f.name.split('.').pop().toLowerCase();
        var dedupKey=meta.class+'|'+meta.subject+'|'+meta.chapter+'|'+mod;
        if(mod!=='quiz'){
          if(seenModKeys[dedupKey]==='html'&&ext==='txt')continue;
          seenModKeys[dedupKey]=ext;
          bulkMasterQueue=bulkMasterQueue.filter(function(it){return it.dedupKey!==dedupKey;});
        }else{
          if(seenModKeys[dedupKey]&&seenModKeys[dedupKey]!==ext)continue;
          seenModKeys[dedupKey]=ext;
        }

        bulkMasterQueue.push({
          dedupKey:dedupKey,
          fileName:f.name,
          relPath:rel,
          module:mod,
          class:meta.class,
          subject:meta.subject,
          chapter:meta.chapter,
          rawText:text
        });
      }

      renderBulkMasterPreview();
    }

    function parseQuizRowsFromRawText(rawText,fallbackCls,fallbackSub,fallbackChap){
      var t0=rawText.replace(/^\uFEFF/,'').trim();
      var rawArr=[];
      if(t0.charAt(0)==='['||t0.charAt(0)==='{'){
        try{
          var parsed=JSON.parse(t0);
          rawArr=Array.isArray(parsed)?parsed:Object.values(parsed);
        }catch(e){return [];}
      }else{
        var lines=smartBlockSplit(t0).map(function(l){return l.trim()}).filter(Boolean);
        if(lines.length<2)return [];
        var headers=smartSplit(lines[0]);
        for(var i=1;i<lines.length;i++){
          var cols=smartSplit(lines[i]);
          var rec={};
          for(var j=0;j<headers.length;j++)rec[headers[j]]=cols[j]!==undefined?cols[j]:'';
          rawArr.push(rec);
        }
      }

      var formattedQuestions=[];
      rawArr.forEach(function(r){
        if(!r||typeof r!=='object')return;
        var keys=Object.keys(r);
        function findK(names){
          for(var i=0;i<names.length;i++){
            var w=names[i].toLowerCase().replace(/[\s_\-]/g,'');
            for(var j=0;j<keys.length;j++){
              if(keys[j].toLowerCase().replace(/[\s_\-]/g,'')===w)return keys[j];
            }
          }
          return null;
        }
        var kClass=findK(['class','classname','classno']);
        var kSub=findK(['subject']);
        var kChap=findK(['chapter','subsubject','sub-subject']);
        var kTopic=findK(['topic','level','questiontype']);
        var kSubTopic=findK(['subtopic','sub-topic','questiontype']);
        var kQues=findK(['question','ques']);
        var kA=findK(['optiona','opta','a']);
        var kB=findK(['optionb','optb','b']);
        var kC=findK(['optionc','optc','c']);
        var kD=findK(['optiond','optd','d']);
        var kAns=findK(['answer','correctanswer','correct','ans']);
        var kExp=findK(['explanation','expl']);

        var cn=extractClassNumber(kClass?r[kClass]:'')||fallbackCls||9;
        var sub=normalizeSubjectName(kSub?r[kSub]:'')||fallbackSub||'Social';
        var ch=String((kChap?r[kChap]:'')||fallbackChap||'1').trim();
        var ques=String((kQues?r[kQues]:'')||r.question||'').trim();
        var optA=String((kA?r[kA]:'')||(r.options&&r.options.A)||'').trim();
        var optB=String((kB?r[kB]:'')||(r.options&&r.options.B)||'').trim();
        var optC=String((kC?r[kC]:'')||(r.options&&r.options.C)||'').trim();
        var optD=String((kD?r[kD]:'')||(r.options&&r.options.D)||'').trim();
        var ans=String((kAns?r[kAns]:'')||r.correctAnswer||'').trim().toUpperCase().charAt(0);
        var exp=String((kExp?r[kExp]:'')||r.explanation||'').trim();
        var topTxt=String((kTopic?r[kTopic]:'')||r.topic||'General').trim();
        var subTopTxt=String((kSubTopic?r[kSubTopic]:'')||r.subtopic||'All Questions').trim();

        if(!ques||!optA||!optB||['A','B','C','D'].indexOf(ans)===-1)return;

        var chNorm=ch.replace(/^chapter\s*/i,'').replace(/^ch\s*/i,'').replace(/\s+/g,'')||'1';

        formattedQuestions.push({
          question:ques,
          options:{A:optA,B:optB,C:optC,D:optD},
          correctAnswer:ans,
          subject:sub,
          class:cn,
          chapter:chNorm,
          topic:topTxt||'General',
          subtopic:subTopTxt||'All Questions',
          explanation:exp,
          imageUrls:[],
          order:safeOrderInt()
        });
      });
      return formattedQuestions;
    }

// Generates a fixed, non-repeating ID for each Class + Subject + Module + Chapter
    function makeUniqueModuleKey(mod, cls, sub, chap) {
      var cleanChap = String(chap || 'Chapter1')
        .toLowerCase()
        .replace(/^chapter\s*/i, 'ch')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '') || 'ch1';
      var cleanSub = String(sub || 'Social').replace(/[^a-zA-Z0-9]/g, '');
      return 'Class' + cls + '_' + cleanSub + '_' + mod + '_' + cleanChap;
    }

    function executeBulkMasterUpload(){
      if(!bulkMasterQueue.length)return;
      var btn=document.getElementById('btnStartBulkMaster');
      if(btn)btn.disabled=true;
      var stBox=document.getElementById('bulkMasterStatusBox');
      // Default to 'replace' so re-uploading never duplicates quiz questions
      var qMode=getVal('bulkQuizModeSel')||'replace';
      var total=bulkMasterQueue.length;
      var refMap={'theory':'theoryDatabase','mindmap':'mindMapDatabase','papers':'papersDatabase','games':'gamesDatabase','projects':'projectsDatabase','videos':'videosDatabase','skills':'skillsDatabase'};

      var uploadedModules=0,uploadedQuestions=0,errorsList=[];

      async function processAll(){
        for(var idx=0;idx<total;idx++){
          var item=bulkMasterQueue[idx];
          var pct=Math.round(((idx+1)/total)*100);
          stBox.innerHTML='<div class="bulk-progress-outer"><div class="bulk-progress-inner" style="width:'+pct+'%;">'+pct+'% ('+(idx+1)+'/'+total+')</div></div><div style="font-size:.85rem;color:#38bdf8;margin-bottom:10px;">⏳ Uploading & Updating <strong>'+sanitizeHTML(item.module.toUpperCase())+'</strong>: Class '+item.class+' · '+sanitizeHTML(item.subject)+' · '+sanitizeHTML(item.chapter)+'...</div>';

          if(item.module==='quiz'){
            var qList=parseQuizRowsFromRawText(item.rawText,item.class,item.subject,item.chapter);
            if(!qList.length){
              errorsList.push(item.fileName+': 0 valid quiz rows');
              continue;
            }
            var qGroups={};
            qList.forEach(function(qObj){
              var chClean=String(qObj.chapter||'1').replace(/^chapter\s*/i,'').replace(/^ch\s*/i,'').replace(/\s+/g,'')||'1';
              var gk='Class'+qObj.class+'_'+qObj.subject+'_Chapter'+chClean;
              qObj.chapter=chClean;
              if(!qGroups[gk])qGroups[gk]=[];
              qGroups[gk].push(qObj);
            });
            try{
              var gKeys=Object.keys(qGroups);
              for(var gi=0;gi<gKeys.length;gi++){
                var k=gKeys[gi];
                await saveUniversalQuizGroup(k, qGroups[k], qMode);
                uploadedQuestions+=qGroups[k].length;
              }
              uploadedModules++;
            }catch(err){
              console.error('Quiz bulk error:',err);
              errorsList.push(item.fileName+': '+(err.message||'Quiz DB error'));
            }
          }else{
            var rp=refMap[item.module];
            if(!rp)continue;
            try{
              // Deterministic key prevents duplicate entries when re-uploading the same chapter!
              var fixedKey=makeUniqueModuleKey(item.module, item.class, item.subject, item.chapter);
              var payload={
                title:item.chapter,
                subject:item.subject,
                class:item.class,
                topic:item.chapter,
                content:item.rawText,
                imageUrls:[],
                key:fixedKey,
                order:safeOrderInt()
              };
              await db.ref(rp+'/'+fixedKey).set(payload);
              uploadedModules++;
            }catch(err){
              errorsList.push(item.fileName+': '+(err.message||'DB error'));
            }
          }
        }

        if(btn)btn.disabled=false;
        var errHtml=errorsList.length?('<div style="color:#f87171;font-size:.82rem;margin-top:6px;">⚠️ Errors: '+sanitizeHTML(errorsList.join(' | '))+'</div>'):'';
        stBox.innerHTML='<div class="bulk-progress-outer"><div class="bulk-progress-inner" style="width:100%;">100% COMPLETED</div></div><div style="padding:12px;background:rgba(34,197,94,.15);border:1px solid #22c55e;border-radius:8px;color:#4ade80;font-weight:800;margin-bottom:12px;">🎉 Successfully synced '+uploadedModules+' module files (including '+uploadedQuestions+' Quiz MCQs) without duplicates!'+errHtml+'</div>';
        toast('Synced '+uploadedModules+' modules (Zero Duplicates)!','success');
      }

      processAll();
    }

    function handleDragStart(e){
      draggedItem=e.target.closest('.list-item');
      if(!draggedItem)return;
      draggedKey=draggedItem.dataset.key;
      draggedIndex=parseInt(draggedItem.dataset.index);
      draggedItem.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',draggedKey);
    }

    function handleDragEnd(e){
      if(draggedItem)draggedItem.classList.remove('dragging');
      document.querySelectorAll('.list-item').forEach(function(el){el.classList.remove('drag-over')});
      draggedItem=null;draggedKey=null;draggedIndex=null;
    }

    function handleDragOver(e){
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      var target=e.target.closest('.list-item');
      if(target&&target!==draggedItem){
        target.classList.add('drag-over');
      }
    }

    function handleDragLeave(e){
      var target=e.target.closest('.list-item');
      if(target)target.classList.remove('drag-over');
    }

    function handleDrop(e){
      e.preventDefault();
      e.stopPropagation();
      var target=e.target.closest('.list-item');
      if(!target||!draggedKey||target===draggedItem)return;
      target.classList.remove('drag-over');
      var targetKey=target.dataset.key;
      var targetIndex=parseInt(target.dataset.index);
      if(draggedIndex===targetIndex)return;
      swapOrder(currentTab,draggedKey,targetKey,draggedIndex,targetIndex);
    }

    function swapOrder(dk,keyA,keyB,idxA,idxB){
      var data=allData[dk];
      if(!data)return;
      var isQuiz=(dk==='quiz');

      function getOrder(k,def){
        var it=data[k];
        if(isQuiz){
          return (it&&it.length&&it[0].order!==undefined)?it[0].order:def;
        }
        return (it&&it.order!==undefined)?it.order:def;
      }

      var orderA=getOrder(keyA,idxA*10);
      var orderB=getOrder(keyB,idxB*10);
      if(orderA===orderB){
        orderA=idxA*10;
        orderB=idxB*10;
      }

      var rm={'theory':'theoryDatabase','quiz':'questionBank','mindmap':'mindMapDatabase','papers':'papersDatabase','games':'gamesDatabase','projects':'projectsDatabase','videos':'videosDatabase','skills':'skillsDatabase'};
      var updates={};
      if(isQuiz){
        if(data[keyA]&&data[keyA][0])data[keyA][0].order=orderB;
        if(data[keyB]&&data[keyB][0])data[keyB][0].order=orderA;
        db.ref('questionBank').set(data).catch(function(err){toast('Error: '+err.message,'error')});
      }else{
        updates[keyA+'/order']=orderB;
        updates[keyB+'/order']=orderA;
        if(data[keyA])data[keyA].order=orderB;
        if(data[keyB])data[keyB].order=orderA;
        db.ref(rm[dk]).update(updates).catch(function(err){toast('Error: '+err.message,'error')});
      }

      if(currentFilters.sort!=='manual'){
        currentFilters.sort='manual';
        var so=document.getElementById('sortOrder');
        if(so)so.value='manual';
      }
      refreshUI();
    }

    function getFilteredAndSortedKeys(keys,data,isQuiz,isCommon){
      var filtered=[];
      for(var i=0;i<keys.length;i++){
        var k=keys[i];
        var item=data[k];

        if(isQuiz){
          var parts=k.split('_');
          var qSub=parts.length>1?parts[1]:null;
          var qCls=parts.length>0?parts[0].replace('Class',''):null;
          if(currentFilters.subject!=='ALL'&&qSub!==currentFilters.subject)continue;
          if(currentFilters.class!=='ALL'&&qCls!==currentFilters.class)continue;
        }else if(currentTab==='skills'){
          if(currentFilters.category!=='ALL'&&item.category!==currentFilters.category)continue;
        }else if(currentTab==='games'||currentTab==='projects'){
          if(currentFilters.subject!=='ALL'&&item.subject!==currentFilters.subject)continue;
          if(currentFilters.class!=='ALL'&&String(item.class)!==currentFilters.class)continue;
        }else if(currentTab==='theory'||currentTab==='mindmap'||currentTab==='papers'||currentTab==='videos'){
          if(currentFilters.subject!=='ALL'&&item.subject!==currentFilters.subject)continue;
          if(currentFilters.class!=='ALL'&&String(item.class)!==currentFilters.class)continue;
        }
        filtered.push(k);
      }

      if(currentFilters.sort==='manual'){
        filtered.sort(function(a,b){
          var oA, oB;
          if(isQuiz){
            oA=(data[a]&&data[a].length)?data[a][0].order:undefined;
            oB=(data[b]&&data[b].length)?data[b][0].order:undefined;
          }else{
            oA=(data[a]?data[a].order:undefined);
            oB=(data[b]?data[b].order:undefined);
          }
          var vA=oA!==undefined?oA:999999;
          var vB=oB!==undefined?oB:999999;
          if(vA===vB)return a.localeCompare(b);
          return vA-vB;
        });
      }else if(currentFilters.sort==='az'){
        filtered.sort(function(a,b){
          var na=(data[a]&&data[a].title)?data[a].title.toLowerCase():a.toLowerCase();
          var nb=(data[b]&&data[b].title)?data[b].title.toLowerCase():b.toLowerCase();
          return na.localeCompare(nb);
        });
      }else if(currentFilters.sort==='za'){
        filtered.sort(function(a,b){
          var na=(data[a]&&data[a].title)?data[a].title.toLowerCase():a.toLowerCase();
          var nb=(data[b]&&data[b].title)?data[b].title.toLowerCase():b.toLowerCase();
          return nb.localeCompare(na);
        });
      }else if(currentFilters.sort==='oldest'){
        filtered.reverse();
      }

      return filtered;
    }

    function smartSplit(line){
      var delim='\t';
      if(line.indexOf('\t')!==-1)delim='\t';
      else if(line.indexOf(',')!==-1)delim=',';
      else if(line.indexOf('|')!==-1)delim='|';

      var res=[],cur='',iq=false,fieldStart=true;
      for(var i=0;i<line.length;i++){
        var ch=line[i];
        if(fieldStart&&ch==='"'){
          iq=true;fieldStart=false;continue;
        }
        if(ch===delim&&!iq){res.push(cur.trim());cur='';fieldStart=true;continue}
        if((ch==='\n'||ch==='\r')&&!iq){
          if(ch==='\r'&&line[i+1]==='\n'){i++;continue}
          continue;
        }
        if(iq&&ch==='"'&&line[i+1]==='"'){cur+='"';i++;continue}
        if(iq&&ch==='"'){iq=false;fieldStart=false;continue}
        if(ch!==delim||iq)fieldStart=false;
        if(!(ch===delim&&iq))cur+=ch;
      }
      res.push(cur.trim());
      return res;
    }

          if(h===names[j].toLowerCase().replace(/[\s_]/g,''))return i;
        }
      }
      return -1;
    }

    async function handleDropEvent(ev){

      if(!files||!files.length)return;
      if(files.length===1){
        if(files[0].size>20*1024*1024){toast('File too large (max 20MB)','error');return}
        readUploadFile(files[0]);

    async function readMultipleUploadFiles(files){
      var combinedRows=[];
      var customTopic=getVal('uploadTopicInp');
      for(var i=0;i<files.length;i++){
        var f=files[i];
        var txt=await new Promise(function(resolve){
          var r=new FileReader();
          r.onload=function(e){resolve(e.target.result||'')};
          r.onerror=function(){resolve('')};
          r.readAsText(f);
        });
        if(!txt.trim())continue;
        if(currentTab!=='quiz'){
          var meta=inferMetaFromRelativePath(f.name,f.name,txt,currentTab);
          var finalT=customTopic||meta.chapter||'Chapter1';
          combinedRows.push({
            Title:finalT,
            Subject:getUploadDefaultSubject(),
            Class:getUploadDefaultClass(),
            Topic:finalT,
            Content:txt
          });
        }else{
          var qParsed=parseQuizRowsFromRawText(txt,getUploadDefaultClass(),getUploadDefaultSubject(),f.name.replace(/\.[^.]+$/,''));
          combinedRows=combinedRows.concat(qParsed);
        }
      }
      if(combinedRows.length)showUploadPreview(combinedRows);
      else toast('No valid records found in selected files','error');
    }

    function readUploadFile(file){
      var nm=(file.name||'').toLowerCase();
      if(nm.indexOf('.xlsx')!==-1||nm.indexOf('.xls')!==-1){readXLSX(file);return}
      var reader=new FileReader();
      reader.onload=function(e){parseUploadText(e.target.result,file.name)};
      reader.readAsText(file);
    }

    function readXLSX(file){
      loadSheetJS(function(){
        if(typeof XLSX==='undefined'){toast('Unable to load xlsx library','error');return}
        var reader=new FileReader();
        reader.onload=function(e){
          try{
            var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
            var ws=wb.Sheets[wb.SheetNames[0]];
            var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
            if(!aoa||!aoa.length){toast('Empty Excel file','error');return}
            var txt=aoa.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join('\t')}).join('\n');
            parseUploadText(txt,file.name);
          }catch(err){toast('Excel parse error: '+err.message,'error')}
        };
        reader.readAsArrayBuffer(file);
      });
    }

    function parseUploadText(text,fileName){
      var t0=text.replace(/^\uFEFF/,'').trim();
      if(!t0){toast('Empty data','error');return}
      var first=t0.charAt(0);
      if(first==='{'||first==='['){
        try{parseJSONUpload(t0);return}
        catch(e){toast('Invalid JSON: '+e.message,'error');return}
      }

      if(currentTab!=='quiz'&&(/^<!doctype\s+html/i.test(t0)||/^<html/i.test(t0)||/^<div[\s>]/i.test(t0)||/^<svg[\s>]/i.test(t0))){
        var customTitle=getVal('uploadTopicInp');
        var meta=inferMetaFromRelativePath(fileName||'',fileName||'',t0,currentTab);
        var extractedTitle=customTitle||meta.chapter||(currentTab.toUpperCase()+' Module');

        showUploadPreview([{
          Title:extractedTitle.substring(0,100),
          Subject:getUploadDefaultSubject(),
          Class:getUploadDefaultClass(),
          Topic:extractedTitle.substring(0,100),
          Content:t0
        }]);
        return;
      }

      if(/<table[\s>]/i.test(t0)&&currentTab==='quiz'){
        parseHTMLTable(t0);
        return;
      }
      parseTabular(t0);
    }

    function parseJSONUpload(text){
      var obj=JSON.parse(text);
      var rows=[];
      if(Array.isArray(obj)){
        obj.forEach(function(o){rows.push(o)});
      }else if(obj&&typeof obj==='object'){
        Object.keys(obj).forEach(function(k){
          rows.push(obj[k]);
        });
      }
      if(!rows.length){toast('No records in JSON','error');return}
      showUploadPreview(rows);
    }

    function parseHTMLTable(text){
      var doc=new DOMParser().parseFromString(text,'text/html');
      var tables=doc.querySelectorAll('table');
      if(!tables.length){toast('No <table> found in HTML','error');return}
      var rows=[];
      for(var i=0;i<tables.length;i++){
        var trs=tables[i].querySelectorAll('tr');
        var headerKeys=[];
        if(trs.length){
          var hCells=trs[0].querySelectorAll('th');
          if(hCells.length){
            for(var hi=0;hi<hCells.length;hi++)headerKeys[hi]=(hCells[hi].textContent||'').trim();
          }
        }
        for(var j=0;j<trs.length;j++){
          if(j===0&&headerKeys.length)continue;
          var cells=trs[j].querySelectorAll('th,td');
          var rec={};
          cells.forEach(function(c,k){
            var key=headerKeys[k]||('col'+(k+1));
            rec[key]=c.textContent.trim();
          });
          rows.push(rec);
        }
      }
      if(!rows.length){toast('No rows found in HTML table','error');return}
      showUploadPreview(rows);
    }

    function smartBlockSplit(text){
      var phys=String(text||'').split(/\r?\n/);
      var blocks=[],cur=[],inQ=false;
      for(var bi=0;bi<phys.length;bi++){
        var ln=phys[bi],unesc=0;
        for(var bk=0;bk<ln.length;bk++){if(ln[bk]==='"'){if(ln[bk+1]==='"'){bk++;continue}unesc++;}}
        if(unesc%2===1)inQ=!inQ;
        cur.push(ln);
        if(!inQ){blocks.push(cur.join('\n'));cur=[];}
      }
      if(cur.length)blocks.push(cur.join('\n'));
      return blocks;
    }

    function parseTabular(text){
      var lines=smartBlockSplit(text).map(function(l){return l.trim()}).filter(function(l){return l!==''});
      if(lines.length<2){
        if(currentTab!=='quiz'&&lines.length===1){
          var customT=getVal('uploadTopicInp')||'Content';
          showUploadPreview([{Title:customT,Content:text,Subject:getUploadDefaultSubject(),Class:getUploadDefaultClass(),Topic:customT}]);
          return;
        }
        toast('Need header + data rows','error');return;
      }
      var headers=smartSplit(lines[0].trim());
      if(!headers||!headers.length){toast('No headers found','error');return}
      var knownCols=['class','classname','classno','subject','topic','chapter','title','name','content','body','data','question','category','subsubject','subtopic','option','optiona','optionb','optionc','optiond','correct','correctanswer','explanation','imageurls','round','section','difficulty','level','questiontype','sourcepdf','page','scope','project','paper','item','marks','answer','col1','col2','col3'];
      var matches=0;
      for(var ki=0;ki<headers.length;ki++){
        var hh=String(headers[ki]).toLowerCase().replace(/[\s_\-]/g,'');
        for(var kj=0;kj<knownCols.length;kj++){if(hh===knownCols[kj]){matches++;break}}
      }
      if(matches===0&&currentTab!=='quiz'){
        var whole=lines.join('\n');
        var rec={};
        var cTitle=getVal('uploadTopicInp')||cleanExtractedTitle(lines[0]).substring(0,80)||'Content';
        rec['Title']=cTitle;
        rec['Content']=whole;
        rec['Subject']=getUploadDefaultSubject();
        rec['Class']=getUploadDefaultClass();
        rec['Topic']=cTitle;
        showUploadPreview([rec]);
        return;
      }
      var rows=[];
      for(var i=1;i<lines.length;i++){
        var cols=smartSplit(lines[i].trim());
        var rec={};
        for(var j=0;j<headers.length;j++)rec[headers[j]]=cols[j]!==undefined?cols[j]:'';
        rows.push(rec);
      }
      if(!rows.length){toast('No data rows found','error');return}
      showUploadPreview(rows);
    }

          ans=String(r.correctAnswer||r.correct||r.answer||'').trim().toUpperCase().charAt(0);
        }

function uploadContentItems(rp,items,st){
      if(!items.length){st.innerHTML='<span style="color:#ef4444;">No valid rows</span>';return}
      var idx=0;
      function nx(){
        if(idx>=items.length){
          st.innerHTML='<span style="color:#22c55e;">✅ Done! '+items.length+' items synced (no duplicates).</span>';
          toast('Upload Complete!','success');
          setTimeout(function(){clearCSVData();refreshUI()},1500);
          return;
        }
        var it=items[idx];
        var fixedKey=makeUniqueModuleKey(currentTab, it.class||9, it.subject||'Social', it.title||it.topic||('item_'+idx));
        it.key=fixedKey;
        if(!it.order||it.order>2147483647)it.order=safeOrderInt();
        db.ref(rp+'/'+fixedKey).set(it).then(function(){
          idx++;
          st.innerHTML='<span>'+idx+'/'+items.length+'</span>';
          nx();
        }).catch(function(err){
          console.error('Upload error:',err);
          idx++;nx();
        });
      }
      nx();
    }

      h+='<div class="form-group" style="flex:1;min-width:180px;"><label>Sub-Topic (optional)</label><input type="text" id="qz-subtopic" class="form-inp" placeholder="e.g., 2-digit sums"></div>';
      h+='</div>';
      h+='<div class="form-group"><label>Question *</label><input type="text" id="qz-question" class="form-inp" placeholder="Type the question"></div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:15px;">';
      h+='<div class="form-group" style="flex:1;min-width:180px;"><label>Option A *</label><input type="text" id="qz-a" class="form-inp"></div>';
      h+='<div class="form-group" style="flex:1;min-width:180px;"><label>Option B *</label><input type="text" id="qz-b" class="form-inp"></div>';
      h+='<div class="form-group" style="flex:1;min-width:180px;"><label>Option C (optional)</label><input type="text" id="qz-c" class="form-inp"></div>';
      h+='<div class="form-group" style="flex:1;min-width:180px;"><label>Option D (optional)</label><input type="text" id="qz-d" class="form-inp"></div>';
      h+='</div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:15px;align-items:center;">';
      h+='<div class="form-group" style="flex:1;min-width:150px;"><label>Correct Answer *</label><select id="qz-ans" class="form-inp"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>';
      h+='<div class="form-group" style="flex:2;min-width:220px;"><label>Explanation (optional)</label><input type="text" id="qz-exp" class="form-inp" placeholder="Explanation for this answer"></div>';
      h+='</div>';
      h+='<button class="btn btn-green btn-sm" onclick="saveQuizQuestion()">💾 Save Question</button> ';
      h+='<button class="btn btn-dark btn-sm" onclick="cancelEditForm()">❌ Cancel</button>';
      h+='</div>';
      ef.innerHTML=h;
    }

    function saveQuizQuestion(){
      var cn=parseInt(getVal('qz-class'),10);
      var sub=getVal('qz-subject');
      var ch=getVal('qz-chapter');
      var ques=getVal('qz-question');
      var a=getVal('qz-a'),b=getVal('qz-b'),c=getVal('qz-c'),d=getVal('qz-d');
      var ans=getVal('qz-ans').toUpperCase();
      var topic=getVal('qz-topic')||'General',subt=getVal('qz-subtopic')||'All Questions',exp=getVal('qz-exp');
      if(!cn||cn<1||cn>10){toast('Select a valid Class','error');return}
      if(!sub){toast('Select a Subject','error');return}
      if(!ch){toast('Enter Chapter / Sub-Subject','error');return}
      if(!ques){toast('Enter the Question','error');return}
      if(!a||!b){toast('Option A and Option B are required','error');return}
      if((ans==='C'&&!c)||(ans==='D'&&!d)){toast('Correct answer option cannot be empty','error');return}
      var chNorm=String(ch).replace(/^chapter\s*/i,'').replace(/^ch\s*/i,'').replace(/\s+/g,'')||'1';
      var gk='Class'+cn+'_'+sub+'_Chapter'+chNorm;
      var qObj={question:ques,options:{A:a,B:b,C:c,D:d},correctAnswer:ans,subject:sub,class:cn,chapter:chNorm,topic:topic,subtopic:subt,explanation:exp,imageUrls:[],order:safeOrderInt()};
      saveUniversalQuizGroup(gk, [qObj], 'append').then(function(){
        toast('Question saved!','success');
        cancelEditForm();
        refreshUI();
      }).catch(function(err){
        toast('Save failed: '+(err.message||err),'error');
      });
    }

    function getVal(id){
      var el=document.getElementById(id);
      return el?el.value.trim():'';
    }

    function saveItem(dk){
      var rm={'theory':'theoryDatabase','mindmap':'mindMapDatabase','papers':'papersDatabase','games':'gamesDatabase','projects':'projectsDatabase','videos':'videosDatabase','skills':'skillsDatabase'};
      var rp=rm[dk];
      var isSkills=(dk=='skills');
      var isGP=(dk=='games'||dk=='projects');
      var needsSubCls=(dk=='theory'||dk=='mindmap'||dk=='papers'||dk=='videos'||isGP);

      var title=getVal('ef-title');
      var content=getVal('ef-content');
      var images=getVal('ef-images');

      content=content.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');

      var subject=getVal('ef-subject');
      var cls=parseInt(getVal('ef-class'));
      var category=getVal('ef-category');
      var topic=getVal('ef-topic');

      if(!title){toast('Title required','error');return}
      if(isGP){
        if(!subject||!cls||!topic){toast('Subject, Class & Topic required','error');return}
      }else if(isSkills){
        if(!category){toast('Category required','error');return}
      }else if(needsSubCls){
        if(!subject||!cls){toast('Subject & Class required','error');return}
      }

      var item={
        title:title,
        content:content||'',
        imageUrls:images?images.split('\n').map(function(l){return l.trim()}).filter(function(l){return l}):[],
        order:safeOrderInt()
      };

      if(isGP){
        item.subject=subject;
        item.class=cls;
        item.topic=topic;
      }else if(isSkills){
        item.category=category;
      }else if(needsSubCls){
        item.subject=subject;
        item.class=cls;
      }

      if(editingId){
        var ex=allData[dk]?allData[dk][editingId]:null;
        item.key=ex?ex.key||editingId:editingId;
        if(ex&&ex.order&&ex.order<=2147483647)item.order=ex.order;
        db.ref(rp+'/'+editingId).update(item).then(function(){
          toast('Updated!','success');
          cancelEditForm();
          refreshUI();
        }).catch(function(){toast('Error','error')});
      }else{
        var nr=db.ref(rp).push();
        item.key=nr.key;
        nr.set(item).then(function(){
          toast('Added!','success');
          cancelEditForm();
          refreshUI();
        }).catch(function(){toast('Error','error')});
      }
    }

    function renderUsers(){
      var ac=document.getElementById('admin-content');
      var users=settings.users||{};
      var uKeys=Object.keys(users);
      var h='<button class="btn btn-green btn-sm" onclick="showAddUserForm()">➕ Add User</button>';
      h+='<span style="color:var(--mut);margin-left:10px;">Total: '+uKeys.length+'</span><br><br>';

      if(uKeys.length===0){
        h+='<p style="color:var(--mut);">No users yet.</p>';
      }else{
        for(var i=0;i<uKeys.length;i++){
          var ph=uKeys[i];
          var u=users[ph];
          h+='<div class="user-card">';
          h+='<strong>📱 '+sanitizeHTML(ph)+'</strong> | Pass: '+(u.pass?'•●●●●●•':'N/A')+'<br>';
          h+='Modes: '+(u.modes||[]).join(', ')+'<br>';
          h+='Subjects: '+(u.subjects||[]).join(', ')+'<br>';
          h+='Classes: '+(u.classes||[]).join(', ')+'<br>';
          h+='<button class="btn btn-blue btn-xs" onclick="editUser('+q(escapeAttr(ph))+')">✏️ Edit</button>';
          h+='<button class="btn btn-red btn-xs" onclick="deleteUser('+q(escapeAttr(ph))+')">🗑 Delete</button>';
          h+='</div>';
        }
      }
      h+='<div id="userEditForm" style="display:none;margin-top:20px;"></div>';
      ac.innerHTML=h;
    }

    function showAddUserForm(){buildUserForm2(null)}
    function editUser(phone){buildUserForm2(phone)}

    function buildUserForm2(phone){
      var uef=document.getElementById('userEditForm');
      uef.style.display='block';

      var u=(phone&&settings.users[phone])?settings.users[phone]:{pass:'',modes:[],subjects:[],classes:[]};
      var allModes=['learning','quiz','mindmap','skills','ai','papers','games','projects','videos'];

      var h='<div class="card"><h3>'+(phone?'✏️ Edit':'➕ Add')+' User</h3>';
      h+='<div class="form-group"><label>Phone/ID *</label><input type="text" id="uf-phone" class="form-inp" value="'+escapeAttr(phone||'')+'" '+(phone?'readonly':'')+'></div>';
      h+='<div class="form-group"><label>Password *</label><input type="text" id="uf-pass" class="form-inp" value="'+escapeAttr(u.pass||'')+'"></div>';

      h+='<label>Modes:</label><div class="checkbox-group">';
      for(var i=0;i<allModes.length;i++){
        h+='<label class="toggle-checkbox-label"><label class="toggle-switch" style="width:40px;height:22px;"><input type="checkbox" value="'+escapeAttr(allModes[i])+'" class="uf-modes" '+(u.modes.indexOf(allModes[i])!==-1?'checked':'')+'><span class="toggle-slider" style="border-radius:22px;"></span></label> '+sanitizeHTML(allModes[i])+'</label>';
      }
      h+='</div>';

      h+='<label>Subjects:</label><div class="checkbox-group">';
      for(var j=0;j<SUBJECTS.length;j++){
        h+='<label class="toggle-checkbox-label"><label class="toggle-switch" style="width:40px;height:22px;"><input type="checkbox" value="'+escapeAttr(SUBJECTS[j])+'" class="uf-subs" '+(u.subjects.indexOf(SUBJECTS[j])!==-1?'checked':'')+'><span class="toggle-slider"></span></label> '+sanitizeHTML(SUBJECTS[j])+'</label>';
      }
      h+='</div>';

      h+='<label>Classes:</label><div class="checkbox-group">';
      for(var k=0;k<CLASSES.length;k++){
        h+='<label class="toggle-checkbox-label"><label class="toggle-switch" style="width:40px;height:22px;"><input type="checkbox" value="'+CLASSES[k]+'" class="uf-clss" '+(u.classes.indexOf(String(CLASSES[k]))!==-1?'checked':'')+'><span class="toggle-slider"></span></label> Class '+CLASSES[k]+'</label>';
      }
      h+='</div>';

      h+='<input type="hidden" id="uf-orig" value="'+escapeAttr(phone||'')+'">';
      h+='<button class="btn btn-green btn-sm" onclick="saveUser2()">💾 Save</button>';
      h+='<button class="btn btn-dark btn-sm" onclick="cancelUserEdit2()">❌ Cancel</button>';
      h+='</div>';
      uef.innerHTML=h;
    }

    function cancelUserEdit2(){
      document.getElementById('userEditForm').style.display='none';
      document.getElementById('userEditForm').innerHTML='';
    }

    function saveUser2(){
      var phone=getVal('uf-phone');
      var pass=getVal('uf-pass');
      var orig=getVal('uf-orig');

      if(!phone||!pass){toast('Phone & Password required','error');return}

      var modes=[],subs=[],clss=[];
      document.querySelectorAll('.uf-modes:checked').forEach(function(c){modes.push(c.value)});
      document.querySelectorAll('.uf-subs:checked').forEach(function(c){subs.push(c.value)});
      document.querySelectorAll('.uf-clss:checked').forEach(function(c){clss.push(c.value)});

      var upd={};
      var uks=Object.keys(settings.users);
      for(var i=0;i<uks.length;i++)upd[uks[i]]=settings.users[uks[i]];
      if(orig&&orig!==phone)delete upd[orig];

      upd[phone]={pass:pass,modes:modes,subjects:subs,classes:clss};

      db.ref('appSettings/users').set(upd).then(function(){
        settings.users=upd;
        toast('Saved!','success');
        cancelUserEdit2();
        renderUsers();
      }).catch(function(){toast('Error','error')});
    }

    function deleteUser(phone){
      if(!confirm('Delete '+phone+'?'))return;
      var upd={};
      var uks=Object.keys(settings.users);
      for(var i=0;i<uks.length;i++){
        if(uks[i]!==phone)upd[uks[i]]=settings.users[uks[i]];
      }
      db.ref('appSettings/users').set(upd).then(function(){
        settings.users=upd;
        toast('Deleted!','success');
        renderUsers();
      }).catch(function(){toast('Error','error')});
    }

    function renderSettings(){
      var ac=document.getElementById('admin-content');
      var cp=settings.adminPass||DEFAULT_ADMIN_PASS;
      var gid=settings.guestId||DEFAULT_GUEST_ID;
      var gpass=settings.guestPass||DEFAULT_GUEST_PASS;
      var bMode=settings.bulkQuizMode||'append';
      var bCls=settings.bulkDefaultClass||9;
      var bSub=settings.bulkDefaultSubject||'Social';

      var clsOpts='';
      for(var ci=0;ci<CLASSES.length;ci++){
        clsOpts+='<option value="'+CLASSES[ci]+'" '+(CLASSES[ci]==bCls?'selected':'')+'>Class '+CLASSES[ci]+'</option>';
      }
      var subOpts='';
      for(var si=0;si<SUBJECTS.length;si++){
        subOpts+='<option value="'+SUBJECTS[si]+'" '+(SUBJECTS[si]===bSub?'selected':'')+'>'+SUBJECTS[si]+'</option>';
      }

      ac.innerHTML='<div class="card"><h3>⚙️ Settings</h3>'
        +'<div class="toggle-setting-row">'
        +'<span class="toggle-label">🔐 Enable Login</span>'
        +'<div class="toggle-right">'
        +'<label class="toggle-switch"><input type="checkbox" id="set-login" '+(settings.loginEnabled?'checked':'')+' onchange="updateSettingToggle(\'login\')"><span class="toggle-slider"></span></label>'
        +'<span id="login-status">'+(settings.loginEnabled?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span>'
        +'</div></div>'

        +'<div class="toggle-setting-row">'
        +'<span class="toggle-label">📋 Enable Data Copying</span>'
        +'<div class="toggle-right">'
        +'<label class="toggle-switch"><input type="checkbox" id="set-copy" '+(settings.copyEnabled?'checked':'')+' onchange="updateSettingToggle(\'copy\')"><span class="toggle-slider"></span></label>'
        +'<span id="copy-status">'+(settings.copyEnabled?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span>'
        +'</div></div>'

        +'<div class="toggle-setting-row">'
        +'<span class="toggle-label">👤 Guest Auto Login</span>'
        +'<div class="toggle-right">'
        +'<label class="toggle-switch"><input type="checkbox" id="set-guest-auto" '+(settings.guestAutoLogin?'checked':'')+' onchange="updateSettingToggle(\'guestAuto\')"><span class="toggle-slider"></span></label>'
        +'<span id="guestAuto-status">'+(settings.guestAutoLogin?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>')+'</span>'
        +'</div></div>'

        +'<div class="card" style="margin-top:15px;border-color:#10b981;">'
        +'<h3 style="color:#34d399;">🚀 Bulk & Multi-Module Upload Settings</h3>'
        +'<div style="display:flex;gap:15px;flex-wrap:wrap;">'
        +'<div class="form-group" style="flex:1;min-width:200px;"><label>Quiz Bulk Upload Behavior</label><select id="set-bulk-quiz-mode" class="form-inp"><option value="append" '+(bMode==='append'?'selected':'')+'>Append Questions to Existing Chapter</option><option value="replace" '+(bMode==='replace'?'selected':'')+'>Replace / Overwrite Chapter Questions</option></select></div>'
        +'<div class="form-group" style="flex:1;min-width:160px;"><label>Default Fallback Class</label><select id="set-bulk-def-class" class="form-inp">'+clsOpts+'</select></div>'
        +'<div class="form-group" style="flex:1;min-width:160px;"><label>Default Fallback Subject</label><select id="set-bulk-def-sub" class="form-inp">'+subOpts+'</select></div>'
        +'</div></div>'

        +'<div class="form-group"><label>Guest ID</label><input id="set-guest-id" class="form-inp" value="'+escapeAttr(gid)+'" style="max-width:300px;"></div>'
        +'<div class="form-group"><label>Guest Password</label><input id="set-guest-pass" class="form-inp" value="'+escapeAttr(gpass)+'" style="max-width:300px;"></div>'
        +'<div class="form-group"><label>Admin Password</label><input id="set-admin-pass" class="form-inp" value="'+escapeAttr(cp)+'" style="max-width:300px;"></div>'
        +'<button class="btn btn-green btn-sm" onclick="saveSettings2()">💾 Save</button>'
        +'<button class="btn btn-orange btn-sm" onclick="resetAdminPass2()">🔄 Reset Admin</button>'
        +'<button class="btn btn-teal btn-sm" onclick="resetGuestCreds()">🔄 Reset Guest</button>'
        +'</div>';
    }

    function updateSettingToggle(type){
      var cb,se;
      if(type==='login'){cb=document.getElementById('set-login');se=document.getElementById('login-status')}
      else if(type==='copy'){cb=document.getElementById('set-copy');se=document.getElementById('copy-status')}
      else{cb=document.getElementById('set-guest-auto');se=document.getElementById('guestAuto-status')}
      if(cb&&se)se.innerHTML=cb.checked?'<span class="toggle-status on">ON</span>':'<span class="toggle-status off">OFF</span>';
    }

    function saveSettings2(){
      var le=document.getElementById('set-login')?document.getElementById('set-login').checked:true;
      var ce=document.getElementById('set-copy')?document.getElementById('set-copy').checked:false;
      var ga=document.getElementById('set-guest-auto')?document.getElementById('set-guest-auto').checked:false;
      var ap=getVal('set-admin-pass');
      var gid=getVal('set-guest-id');
      var gpass=getVal('set-guest-pass');
      var bMode=getVal('set-bulk-quiz-mode')||'append';
      var bCls=parseInt(getVal('set-bulk-def-class'),10)||9;
      var bSub=getVal('set-bulk-def-sub')||'Social';

      if(!ap||!gid||!gpass){toast('All fields required','error');return}

      db.ref('appSettings').update({
        loginEnabled:le,
        adminPass:ap,
        copyEnabled:ce,
        guestAutoLogin:ga,
        guestId:gid,
        guestPass:gpass,
        bulkQuizMode:bMode,
        bulkDefaultClass:bCls,
        bulkDefaultSubject:bSub
      }).then(function(){
        settings.loginEnabled=le;
        settings.adminPass=ap;
        settings.copyEnabled=ce;
        settings.guestAutoLogin=ga;
        settings.guestId=gid;
        settings.guestPass=gpass;
        settings.bulkQuizMode=bMode;
        settings.bulkDefaultClass=bCls;
        settings.bulkDefaultSubject=bSub;
        if(ce)document.body.classList.remove('protected-mode');
        else document.body.classList.add('protected-mode');
        updateGuestDisplay();
        toast('Saved!','success');
      }).catch(function(){toast('Error','error')});
    }

    function resetAdminPass2(){
      if(!confirm('Reset?'))return;
      db.ref('appSettings/adminPass').set(DEFAULT_ADMIN_PASS).then(function(){
        settings.adminPass=DEFAULT_ADMIN_PASS;
        toast('Reset!','success');
        renderSettings();
      });
    }

    function resetGuestCreds(){
      if(!confirm('Reset?'))return;
      db.ref('appSettings').update({
        guestId:DEFAULT_GUEST_ID,
        guestPass:DEFAULT_GUEST_PASS
      }).then(function(){
        settings.guestId=DEFAULT_GUEST_ID;
        settings.guestPass=DEFAULT_GUEST_PASS;
        updateGuestDisplay();
        toast('Reset!','success');
        renderSettings();
      });
    }

    function initApp(){
      initTheme();
      db.ref('appSettings').once('value').then(function(s){
        var v = s.val() || {};
        if (typeof v === 'string') { try { v = JSON.parse(v); } catch(e) { v = {}; } }
        
        settings.loginEnabled=v.loginEnabled!==undefined?v.loginEnabled:true;
        settings.copyEnabled=v.copyEnabled!==undefined?v.copyEnabled:false;
        settings.users=v.users||{};
        settings.adminPass=v.adminPass||DEFAULT_ADMIN_PASS;
        settings.guestAutoLogin=v.guestAutoLogin!==undefined?v.guestAutoLogin:false;
        settings.guestId=v.guestId||DEFAULT_GUEST_ID;
        settings.guestPass=v.guestPass||DEFAULT_GUEST_PASS;
        settings.bulkQuizMode=v.bulkQuizMode||'append';
        settings.bulkDefaultClass=v.bulkDefaultClass||9;
        settings.bulkDefaultSubject=v.bulkDefaultSubject||'Social';
        if(settings.copyEnabled)document.body.classList.remove('protected-mode');
        else document.body.classList.add('protected-mode');
        checkAuth();
      });
      db.ref('activeSessions').once('value').then(function(s){
        var v = s.val() || {};
        if (typeof v === 'string') { try { v = JSON.parse(v); } catch(e) { v = {}; } }
        activeSessions = v;
        checkAuth();
      });
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);
    else initApp();
  </script>
