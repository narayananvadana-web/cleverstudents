<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Clever Students</title>
  <link href="[https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap](https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap)" rel="stylesheet">
  <style>
    :root { --bg: #080c14; --srf: #161b27; --txt: #e2e8f0; --brd: rgba(255,255,255,.1); --font: 'Nunito', sans-serif; }
    body { font-family: var(--font); background: var(--bg); color: var(--txt); margin: 0; padding: 20px; line-height: 1.8; }
    .container { max-width: 800px; margin: 40px auto; background: var(--srf); padding: 40px; border-radius: 12px; border: 1px solid var(--brd); box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    h1 { color: #f59e0b; font-size: 2.2rem; margin-bottom: 10px; }
    p { font-size: 1.05rem; color: #cbd5e1; }
    .contact-box { background: rgba(0,0,0,0.3); border: 1px solid var(--brd); padding: 30px; border-radius: 10px; margin-top: 30px; }
    .contact-box h3 { color: #3b82f6; margin-top: 0; }
    .btn { display: inline-block; padding: 12px 24px; background: #10b981; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 800; margin-top: 30px; cursor: pointer; border: none; }
    .btn:hover { background: #059669; }
    a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📞 Contact Us</h1>
    <p>Have a question, feedback, or need support? We are always here to help you.</p>
    
    <div class="contact-box">
      <h3>Get in Touch</h3>
      <p><strong>Email:</strong> <a href="mailto:support@cleverstudents.in">support@cleverstudents.in</a></p>
      <p><strong>Website:</strong> www.cleverstudents.in</p>
      <p>We try to respond to all inquiries within 24-48 hours. Thank you for being a part of CleverStudents!</p>
    </div>

    <button class="btn" onclick="javascript:history.back()">← Go Back</button>
  </div>
</body>
</html>
