<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel KV - Data Migrator</title>
  <style>
    body { font-family: 'Nunito', sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; text-align: center; }
    .box { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    h2 { color: #f59e0b; }
    input[type="file"] { margin: 20px 0; padding: 10px; background: #0f172a; color: #fff; border-radius: 6px; }
    .btn { background: #10b981; color: #fff; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #059669; }
    #log { margin-top: 25px; text-align: left; background: #000; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; color: #4ade80; }
  </style>
</head>
<body>

  <div class="box">
    <h2>🚀 Firebase to Vercel KV Migrator</h2>
    <p>Upload your <b>cleverstudents9-default-rtdb-export.json</b> file below.</p>
    
    <input type="file" id="jsonFile" accept=".json"><br>
    <button class="btn" onclick="startMigration()">Upload & Distribute Data</button>

    <div id="log">Waiting for file...</div>
  </div>

  <script>
    function logMessage(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<div>> ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function startMigration() {
      const fileInput = document.getElementById('jsonFile');
      if (!fileInput.files.length) {
        alert("Please select the JSON file first!");
        return;
      }

      const file = fileInput.files[0];
      logMessage(`Reading file: ${file.name}...`);

      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const topLevelKeys = Object.keys(data);
        
        logMessage(`Found ${topLevelKeys.length} main categories (nodes).`);

        // Loop through each node and send it to Vercel KV
        for (let i = 0; i < topLevelKeys.length; i++) {
          let nodeKey = topLevelKeys[i];
          let nodeData = data[nodeKey];
          
          logMessage(`Uploading [${nodeKey}] to Vercel KV...`);
          
          const response = await fetch('/api/db', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'set', path: nodeKey, data: nodeData })
          });

          if(response.ok) {
            logMessage(`✅ Successfully uploaded [${nodeKey}]`);
          } else {
            logMessage(`❌ Failed to upload [${nodeKey}]`);
          }
        }

        logMessage(`<br><b style="color:#f59e0b;">🎉 Migration Complete! All panels will now display their respective data automatically.</b>`);
        
      } catch (err) {
        logMessage(`<span style="color:#ef4444;">Error: ${err.message}</span>`);
      }
    }
  </script>
</body>
</html>
